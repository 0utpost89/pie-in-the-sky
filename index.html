/* --- black holes: they warp what's behind them --- */
const lens = document.createElement('canvas');
const lensCtx = lens.getContext('2d');
// Copy a square of the canvas (centre cx, cy, half-size R, in view units) into the lens buffer.
function grabLens(cx, cy, R) {
  const k = canvas.width / W, full = 2 * R * k;
  const size = Math.max(2, Math.min(1200, Math.ceil(full))), sc = size / full;   // capped, so big swirls stay cheap
  if (lens.width !== size || lens.height !== size) { lens.width = size; lens.height = size; }
  lensCtx.setTransform(1, 0, 0, 1, 0, 0);
  lensCtx.clearRect(0, 0, size, size);
  let sx = (cx - R) * k, sy = (cy - R) * k, sw = full, sh = full, dx = 0, dy = 0;
  if (sx < 0) { dx = -sx; sw += sx; sx = 0; }
  if (sy < 0) { dy = -sy; sh += sy; sy = 0; }
  sw = Math.min(sw, canvas.width - sx); sh = Math.min(sh, canvas.height - sy);
  if (sw > 1 && sh > 1) lensCtx.drawImage(canvas, sx, sy, sw, sh, dx * sc, dy * sc, sw * sc, sh * sc);
}
// Twist what's behind a circle: thin rings, each turned a little more than
// the one outside it, so the middle spins most. `spin` turns the lot.
function swirl(cx, cy, R, spin, twist, rings = 12) {
  grabLens(cx, cy, R);
  for (let k = 1; k <= rings; k++) {
    const f = (k - 1) / rings, rr = R * (1 - f);
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.clip();
    ctx.translate(cx, cy);
    ctx.rotate(spin * f + twist * f * f);
    const sc = 1 + twist * 0.05 * f;
    ctx.scale(sc, sc);
    ctx.drawImage(lens, -R, -R, 2 * R, 2 * R);
    ctx.restore();
  }
}

function drawBlackHoles(cam) {
  const BH = CONFIG.blackHole;
  for (const bh of game.holes) {
    const x = bh.x, y = bh.y - cam;
    if (y < -BH.pullRadius || y > H + BH.pullRadius) continue;
    swirl(x, y, 120, Math.sin(bh.t * 0.9) * 0.7, 1.8, 10);
    ctx.save();
    ctx.translate(x, y);
    // the reach of its pull, as a faint dashed ring
    ctx.rotate(bh.t * 0.2);
    ctx.strokeStyle = 'rgba(196,155,255,0.22)'; ctx.lineWidth = 2; ctx.setLineDash([8, 10]);
    ctx.beginPath(); ctx.arc(0, 0, BH.pullRadius * 0.8, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.rotate(-bh.t * 0.2);
    // accretion disc
    const glow = ctx.createRadialGradient(0, 0, 14, 0, 0, 70);
    glow.addColorStop(0, 'rgba(255,143,200,0.9)'); glow.addColorStop(0.35, 'rgba(196,155,255,0.6)'); glow.addColorStop(1, 'rgba(122,211,255,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, 70, 0, TAU); ctx.fill();
    ctx.save(); ctx.rotate(bh.t * 1.6);
    for (let arm = 0; arm < 3; arm++) {
      ctx.strokeStyle = ['rgba(255,214,140,0.8)', 'rgba(255,143,200,0.75)', 'rgba(122,211,255,0.7)'][arm]; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let k = 0; k < 24; k++) { const a = arm * TAU / 3 + k * 0.17, r = 18 + k * 2.2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.stroke();
    }
    ctx.restore();
    // the core
    ctx.fillStyle = '#05020a'; ctx.beginPath(); ctx.arc(0, 0, 19, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ffd1e8'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, 19, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, 23 + Math.sin(bh.t * 5) * 1.5, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   13. RENDER: PLAYER — Rolo
   --------------------------------------------------------------------- */

function drawPlayerAt(x, y, scaleX = 1, scaleY = 1, rot = 0) {
  const p = player;
  ctx.save();
  ctx.translate(x, y);
  if (rot) { ctx.translate(0, -BODY_H / 2); ctx.rotate(rot); ctx.translate(0, BODY_H / 2); }   // spin about his middle
  ctx.scale(scaleX * p.facing, scaleY);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const tid = themeId();
  drawCreature(p, tid);
  ctx.restore();
}

/* The hero: Rolo, a tabby Persian. A big round fluffy head with a flat
   face, a tiny nose, huge copper eyes and a permanent frown; small low
   ears with long tufts; a cream ruff and a great bushy tail. In Yarn World
   he wears a knitted bobble hat, and in Dog World a pair of floppy dog
   ears, as a disguise. */
const KIT = {
  fur: '#b8946a', dark: '#5e4a36', mid: '#8f7556', light: '#e6d9c2', cream: '#d9c6a4',
  eye: '#e8962a', eyeRim: '#2a1a12', nose: '#b87a6a', inner: '#8a6a58', pink: '#b87a6a',
};

// A fluffy outline: an ellipse whose edge is made of swept tufts of fur.
function furPath(cx, cy, rx, ry, n, tuft, seed = 0, a0 = 0, sweep = TAU) {
  const pt = (a, r) => [cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r];
  const full = sweep >= TAU - 1e-6;
  ctx.beginPath();
  let [x, y] = pt(a0, 1); ctx.moveTo(x, y);
  for (let i = 0; i < n; i++) {
    const a = a0 + i / n * sweep, step = sweep / n, k = 1 + (tuft / Math.min(rx, ry)) * (0.7 + 0.6 * hash(i * 7.3 + seed));
    const [c1x, c1y] = pt(a + step * 0.2, 1 + (k - 1) * 0.7);
    const [tx, ty] = pt(a + step * 0.62, k);
    const [c2x, c2y] = pt(a + step * 0.9, 1 + (k - 1) * 0.15);
    const [bx, by] = pt(a + step, 1);
    ctx.quadraticCurveTo(c1x, c1y, tx, ty);
    ctx.quadraticCurveTo(c2x, c2y, bx, by);
  }
  if (full) ctx.closePath();
}

function drawCreature(p, tid) {
  const t = game.time, b = p.belly;
  const st = clamp(p.stretch, -0.3, 0.2), sx = 1 - st * 0.4, sy = 1 + st * 0.5;
  const ouch = p.ouchT > 0 || game.state === 'dying' || game.state === 'over';
  const happy = p.chewT > 0;
  const u = (clamp(p.arms, -1, 1) + 1) / 2;                            // 0 falling .. 1 rising
  const fluff = 1 + clamp(p.hair, -1, 1) * 0.12;                       // fur puffs up on a bounce
  ctx.save(); ctx.scale(sx, sy);                                        // squash & stretch from the feet

  const icon = !!p.iconPose;                                            // straight-on and symmetrical, for the app icon
  if (!icon) {
    // the great bushy tail, swishing behind
    const wag = Math.sin(t * 2.2) * 0.3 + clamp(p.hair, -1, 1) * 0.35;
    const tailPts = [];
    for (let k = 0; k <= 8; k++) {
      const f = k / 8, x = lerp(-10, -20 + wag * 10, f) - Math.sin(f * Math.PI) * 5, y = lerp(-10, -32 + Math.abs(wag) * 3, f);
      tailPts.push([x, y, lerp(5, 4, f) * fluff]);
    }
    ctx.fillStyle = OUT; for (const [x, y, r] of tailPts) { ctx.beginPath(); ctx.arc(x, y, r + 2, 0, TAU); ctx.fill(); }
    ctx.fillStyle = KIT.fur; for (const [x, y, r] of tailPts) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = KIT.dark; ctx.lineWidth = 1.8;
    ctx.beginPath(); for (const k of [2, 4, 6]) { const [x, y, r] = tailPts[k]; ctx.moveTo(x - r * 0.8, y + 1); ctx.quadraticCurveTo(x, y - 1.5, x + r * 0.8, y + 1); } ctx.stroke();
    ctx.strokeStyle = KIT.light; ctx.lineWidth = 1;                       // wispy tip
    const [tx, ty] = tailPts[8];
    ctx.beginPath(); for (const d of [-3, 0, 3]) { ctx.moveTo(tx + d, ty - 3); ctx.lineTo(tx + d * 1.4, ty - 8); } ctx.stroke();

  }

  // back feet: big fluffy slippers
  ctx.fillStyle = KIT.cream; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  for (const fx of [-7, 7]) { ctx.beginPath(); ctx.ellipse(fx, -3, 5.5, 3.8, 0, 0, TAU); ctx.fill(); ctx.stroke(); }

  // body: a fluffy round loaf (rounder with a fuller belly)
  const bw = (12 + b * 1.5) * fluff, bh = (12 + b * 0.5) * fluff;
  ctx.fillStyle = KIT.fur; ctx.strokeStyle = OUT; ctx.lineWidth = 2.5;
  furPath(0, -15, bw, bh, 13, 2.6, 3); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = KIT.dark; ctx.lineWidth = 2;                       // tabby stripes down his back
  ctx.beginPath();
  if (!icon) for (const a of [0.92, 1.06, 1.2]) {
    ctx.moveTo(Math.cos(Math.PI * a) * bw * 0.95, -15 + Math.sin(Math.PI * a) * bh * 0.95);
    ctx.lineTo(Math.cos(Math.PI * a) * bw * 0.55, -15 + Math.sin(Math.PI * a) * bh * 0.55);
  }
  ctx.stroke();
  ctx.fillStyle = KIT.light; furPath(icon ? 0 : 3, -14, bw * 0.55, bh * 0.75, 9, 2.4, 11); ctx.fill();   // creamy chest ruff

  // front paws: tucked in when falling, up and out when he's rising
  const paws = [[-7, -8], [8, -8]].map(([x, y], k) => [lerp(x, k ? 13 : -12, u), lerp(y, -23, u)]);
  for (const [x, y] of paws) {
    ctx.fillStyle = KIT.cream; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = KIT.mid; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x - 2.5, y - 1.5); ctx.lineTo(x + 2.5, y - 1.5); ctx.stroke();
  }

  // head: big, round and fluffy, with small low ears tucked into the fur
  const hx = 1, hy = -33, squash = p.helmetOn ? clamp(p.helmet * 1.4, 0, 1) : 0;
  const perk = clamp(p.hair, -1, 1) * 0.1;
  for (const side of [-1, 1]) {
    const ex = hx + side * 10.5, ey = hy - 13.5, tall = 7.5 * (1 - squash * 0.45);
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(side * (0.6 + perk));
    ctx.fillStyle = KIT.fur; ctx.strokeStyle = OUT; ctx.lineWidth = 2.3;
    ctx.beginPath(); ctx.moveTo(-5, 3); ctx.quadraticCurveTo(-1, -tall, 0, -tall); ctx.quadraticCurveTo(1, -tall, 5, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = KIT.inner; ctx.beginPath(); ctx.moveTo(-2.4, 2); ctx.lineTo(0, -tall + 3); ctx.lineTo(2.4, 2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = KIT.light; ctx.lineWidth = 0.9;                   // long ear tufts
    ctx.beginPath(); ctx.moveTo(0, 1); ctx.lineTo(-1, -tall - 4); ctx.moveTo(1, 1); ctx.lineTo(2.5, -tall - 2.5); ctx.moveTo(-1, 1); ctx.lineTo(-3.5, -tall - 1.5); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = KIT.fur; ctx.strokeStyle = OUT; ctx.lineWidth = 2.5;
  furPath(hx, hy, 16 * fluff, 13.5 * fluff, 16, 2.8, 5); ctx.fill(); ctx.stroke();

  const fx = hx + (icon ? 0 : 2);                                       // his face looks where he's heading
  // lighter muzzle and cheeks
  ctx.fillStyle = KIT.light;
  ctx.beginPath(); ctx.ellipse(fx, hy + 5, 8.5, 5.5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(230,217,194,0.6)';
  ctx.beginPath(); ctx.ellipse(fx - 10, hy + 4, 4.5, 4, 0.3, 0, TAU); ctx.ellipse(fx + 10.5, hy + 4, 4.5, 4, -0.3, 0, TAU); ctx.fill();
  // the tabby "M" on his forehead, and cheek stripes
  ctx.strokeStyle = KIT.dark; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(fx - 5, hy - 6); ctx.lineTo(fx - 3.5, hy - 12); ctx.lineTo(fx - 1, hy - 7.5); ctx.lineTo(fx + 1.5, hy - 12); ctx.lineTo(fx + 3, hy - 6);
  ctx.moveTo(fx - 1, hy - 7.5); ctx.lineTo(fx - 1, hy - 13);
  for (const side of [-1, 1]) { ctx.moveTo(fx + side * 12.5, hy - 1); ctx.lineTo(fx + side * 8.5, hy + 0.5); ctx.moveTo(fx + side * 13, hy + 2); ctx.lineTo(fx + side * 9.5, hy + 3); }
  ctx.stroke();

  // eyes: huge and copper, under a heavy frown
  const eyes = [[fx - 5.6, hy - 0.5], [fx + 5.6, hy - 0.5]];
  if (ouch) {
    ctx.strokeStyle = KIT.eyeRim; ctx.lineWidth = 1.6;
    eyes.forEach(([x, y], k) => { const d = k ? -1 : 1; ctx.beginPath(); ctx.moveTo(x - 2.2 * d, y - 2.2); ctx.lineTo(x + 2.2 * d, y); ctx.lineTo(x - 2.2 * d, y + 2.2); ctx.stroke(); });
  } else if (happy || p.blinkT < 0) {
    ctx.strokeStyle = KIT.eyeRim; ctx.lineWidth = 1.6;
    eyes.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y - 0.5, 2.8, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke(); });   // content, eyes shut
  } else {
    eyes.forEach(([x, y]) => {
      ctx.fillStyle = KIT.eyeRim; ctx.beginPath(); ctx.arc(x, y, 4.2, 0, TAU); ctx.fill();
      const g = ctx.createRadialGradient(x, y + 1, 0.5, x, y, 3.4);
      g.addColorStop(0, '#f6c060'); g.addColorStop(1, KIT.eye);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 3.4, 0, TAU); ctx.fill();
      ctx.fillStyle = KIT.eyeRim; ctx.beginPath(); ctx.ellipse(x, y, 1.3, 2.6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + 1.2, y - 1.4, 1, 0, TAU); ctx.fill();
    });
  }
  ctx.strokeStyle = KIT.dark; ctx.lineWidth = 1.7;                     // the famous frown
  ctx.beginPath();
  ctx.moveTo(fx - 9.5, hy - 4.6); ctx.lineTo(fx - 2.6, hy - 3.4);
  ctx.moveTo(fx + 9.5, hy - 4.6); ctx.lineTo(fx + 2.6, hy - 3.4);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(94,74,54,0.6)'; ctx.lineWidth = 1;           // little tear lines, very Persian
  ctx.beginPath(); ctx.moveTo(fx - 2.4, hy + 2.5); ctx.lineTo(fx - 3, hy + 5); ctx.moveTo(fx + 2.4, hy + 2.5); ctx.lineTo(fx + 3, hy + 5); ctx.stroke();

  // tiny flat nose, and a grumpy downturned mouth
  ctx.fillStyle = KIT.mid; ctx.beginPath(); ctx.ellipse(fx, hy + 1.6, 2.2, 1.4, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = KIT.nose;
  ctx.beginPath(); ctx.moveTo(fx - 1.6, hy + 2.6); ctx.lineTo(fx + 1.6, hy + 2.6); ctx.lineTo(fx, hy + 4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = KIT.eyeRim; ctx.lineWidth = 1.1;
  if (happy) {
    const o = Math.abs(Math.sin(p.chewT * 16));
    ctx.fillStyle = '#9a4a50'; ctx.beginPath(); ctx.ellipse(fx, hy + 6.8, 1.8, 0.5 + o * 1.4, 0, 0, TAU); ctx.fill();
  } else if (ouch) {
    ctx.fillStyle = '#9a4a50'; ctx.beginPath(); ctx.ellipse(fx, hy + 7, 1.5, 1.9, 0, 0, TAU); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(fx, hy + 4); ctx.lineTo(fx, hy + 5.2);
    ctx.moveTo(fx - 3.2, hy + 7.2); ctx.quadraticCurveTo(fx, hy + 4.6, fx + 3.2, hy + 7.2); ctx.stroke();
  }
  ctx.fillStyle = KIT.light; furPath(fx, hy + 10.5, 4.5, 2.2, 5, 1.6, 9, 0, Math.PI); ctx.fill();   // fluffy chin

  // long white whiskers
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 0.8;
  ctx.beginPath();
  for (const side of [-1, 1]) for (const k of [-1, 0, 1]) { ctx.moveTo(fx + side * 5, hy + 4.5 + k * 0.8); ctx.quadraticCurveTo(fx + side * 13, hy + 3 + k * 2, fx + side * 21, hy + 5 + k * 3.5); }
  ctx.stroke();

  if (p.chewT > 0 && p.lastFood) drawFood(p.lastFood, fx + 10, hy + 8, -0.4, 0.42);
  const tid2 = tid;
  if (tid2 === 'yarn') drawBobbleHat(hx, hy);
  if (tid2 === 'dog') drawDogEars(hx, hy);
  if (p.helmetOn) drawHelmet(p, hx, hy, 22);
  ctx.restore();
}

// Yarn World: a stripy knitted bobble hat.
function drawBobbleHat(hx, hy) {
  ctx.save(); ctx.translate(hx, hy - 10); ctx.rotate(-0.12); ctx.scale(1.15, 1.15);
  ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  ctx.save(); ctx.beginPath(); ctx.moveTo(-13, 2); ctx.quadraticCurveTo(-12, -14, 0, -14); ctx.quadraticCurveTo(12, -14, 13, 2); ctx.closePath(); ctx.clip();
  ['#e85a8a', '#ffd65a', '#e85a8a', '#8a6ad0'].forEach((c, k) => { ctx.fillStyle = c; ctx.fillRect(-14, -15 + k * 4.5, 28, 4.5); });
  ctx.restore();
  ctx.beginPath(); ctx.moveTo(-13, 2); ctx.quadraticCurveTo(-12, -14, 0, -14); ctx.quadraticCurveTo(12, -14, 13, 2); ctx.closePath(); ctx.stroke();
  ctx.fillStyle = '#fff6e8'; roundRect(ctx, -14, -1, 28, 5, 2.5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffd65a'; ctx.beginPath(); ctx.arc(1, -16, 4.5, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.restore();
}
// Dog World: a headband with floppy dog ears. Nobody will ever know.
function drawDogEars(hx, hy) {
  ctx.save(); ctx.translate(hx, hy - 9);
  ctx.strokeStyle = '#4a8ad0'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 9, 16, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.fillStyle = '#8a5a3a';
  const flap = Math.sin(game.time * 5) * 0.12;
  for (const side of [-1, 1]) {
    ctx.save(); ctx.translate(side * 14, -1); ctx.rotate(-side * (0.35 + flap));
    ctx.beginPath(); ctx.ellipse(side * 3, 8, 4.2, 9, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// The space helmet: a glass bubble that drops on with a bounce; the gold
// visor flips up while he eats so the crumbs float off.
function drawHelmet(p, cx, cy, r) {
  const helm = easeOutBack(clamp(p.helmet, 0, 1)), drop = (1 - helm) * -50;
  ctx.save(); ctx.translate(cx, cy + drop);
  ctx.fillStyle = 'rgba(200,235,255,0.2)'; ctx.strokeStyle = OUT; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); ctx.stroke();
  const open = p.visorT > 0 ? Math.min(1, (1 - p.visorT) * 6, p.visorT * 5) : 0;
  ctx.save(); ctx.rotate(-open * 1.25);
  ctx.fillStyle = 'rgba(255,200,90,0.3)'; ctx.strokeStyle = 'rgba(255,214,90,0.9)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, r - 1.5, -Math.PI * 0.62, -Math.PI * 0.12); ctx.arc(0, 0, r * 0.62, -Math.PI * 0.12, -Math.PI * 0.62, true); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, r - 4, Math.PI * 1.1, Math.PI * 1.35); ctx.stroke();
  ctx.fillStyle = '#d8dee8'; ctx.strokeStyle = OUT; ctx.lineWidth = 1.8;          // collar ring
  roundRect(ctx, -11, r - 5, 22, 5, 2.5); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// Rush streaks and big-bounce pips: drawn around him.
function drawPlayerFx(x, y) {
  const p = player, t = game.time, by = y - BODY_H / 2;
  if (p.rushT > 0) {
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
    for (let k = 0; k < 6; k++) {
      const lx = x + (hash2(k, Math.floor(t * 20)) - 0.5) * 60, ly = by + (hash2(k + 7, Math.floor(t * 20)) - 0.5) * 70;
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly + 26); ctx.stroke();
    }
  }
  if (p.bigBounces > 0) {
    for (let k = 0; k < p.bigBounces; k++) {
      const ax = x - (p.bigBounces - 1) * 6 + k * 12, ay = y - BODY_H - 18 + Math.sin(t * 6 + k) * 2;
      ctx.fillStyle = EFFECT_COLORS.bounce; ctx.strokeStyle = OUT; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(ax, ay - 5); ctx.lineTo(ax + 5, ay + 2); ctx.lineTo(ax - 5, ay + 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
}

// Draws him (twice near the edges, so the screen wrap looks seamless).
function drawPlayer(x, y) {
  const p = player;
  let rot = 0, sx = 1, sy = 1;
  if (p.beam) rot = Math.sin(game.time * 4) * 0.5;
  if (game.state === 'dying' || game.state === 'over') rot = game.deathT * 6;
  const blink = p.graceT > 0 && p.ouchT <= 0 && Math.sin(game.time * 40) > 0 && game.state === 'play';
  if (blink) ctx.globalAlpha = 0.5;
  for (const off of [0, -W, W]) {
    const xx = x + off;
    if (xx < -40 || xx > W + 40) continue;
    drawPlayerFx(xx, y);
    drawPlayerAt(xx, y, sx, sy, rot);
  }
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------------------
   14. RENDER: PARTICLES & UI
   --------------------------------------------------------------------- */
function drawStar(x, y, r, rot, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawParticles(cam) {
  for (const q of game.particles) {
    const t = q.life / q.max;
    const x = q.x, y = q.screen ? q.y : q.y - cam;
    if (y < -60 || y > H + 60) continue;
    if (q.type === 'dust') {
      const r = q.r0 + (q.r1 - q.r0) * (1 - (1 - t) * (1 - t));
      ctx.globalAlpha = (1 - t) * 0.7;
      ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    } else if (q.type === 'crumb') {
      ctx.globalAlpha = 1 - t * t;
      ctx.save(); ctx.translate(x, y); ctx.rotate(q.rot);
      ctx.fillStyle = q.color; ctx.fillRect(-q.r0, -q.r0, q.r0 * 2, q.r0 * 2);
      ctx.restore();
    } else if (q.type === 'star') {
      ctx.globalAlpha = 1 - t;
      drawStar(x, y, q.r0, q.rot, q.color);
    } else if (q.type === 'spark') {
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(x, y, q.r0 * (1 - t * 0.5), 0, TAU); ctx.fill();
    } else if (q.type === 'feather') {
      ctx.globalAlpha = 1 - t;
      ctx.save(); ctx.translate(x, y); ctx.rotate(q.rot);
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#aab0bc'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(0, 0, q.r0, q.r0 * 0.4, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.restore();
    } else if (q.type === 'text') {
      ctx.globalAlpha = t > 0.7 ? (1 - t) / 0.3 : 1;
      const pop = t < 0.15 ? easeOutBack(t / 0.15) : 1;
      ctx.save(); ctx.translate(x, y); ctx.rotate(q.rot); ctx.scale(pop, pop);
      drawText(q.text, 0, 0, q.size, q.color);
      if (q.sub) drawText(q.sub, 0, q.size * 1.05, q.size * 0.85, '#ffe066');
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

function drawText(str, x, y, size, color = '#fff', align = 'center', stroke = true) {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = Math.max(2, size * 0.18); ctx.strokeStyle = OUT; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function fitSize(str, size, maxW) {
  ctx.font = `bold ${size}px ${FONT}`;
  const w = ctx.measureText(str).width;
  return w > maxW ? Math.floor(size * maxW / w) : size;
}
function wrapLines(str, size, maxW) {
  ctx.font = `bold ${size}px ${FONT}`;
  const words = str.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// Speech bubbles: "In my day...", "MINE!" and the like.
function bubbleAnchor(b, cam) {
  const tg = b.target;
  if (tg === 'player') return { x: player.x, y: player.y - cam - BODY_H - 12 };
  if (tg.plat !== undefined || tg.kind) {                        // a hazard
    if (!game.hazards.includes(tg)) return null;
    const [bx, by, bw] = hazardBox(tg);
    return { x: bx + bw / 2, y: by - cam - 8 };
  }
  if (tg.state !== undefined) { if (!game.gulls.includes(tg)) return null; return { x: tg.x, y: tg.y - cam - 14 }; }   // a gull
  if (tg.w !== undefined) { if (!game.platforms.includes(tg)) return null; return { x: tg.x + tg.w / 2, y: tg.y - cam - 18 }; }
  return null;
}
function drawBubbles(cam) {
  for (const b of game.bubbles) {
    const a = bubbleAnchor(b, cam);
    if (!a || a.y < -20 || a.y > H + 20) continue;
    const size = 13;
    ctx.font = `bold ${size}px ${FONT}`;
    const bw = Math.min(W - 16, ctx.measureText(b.text).width + 20), bh = 26;
    const bx = clamp(a.x - bw / 2, 8, W - bw - 8);
    const by = Math.max(46, a.y - bh - 10);
    const pop = b.t < 0.18 ? easeOutBack(b.t / 0.18) : 1;
    ctx.save();
    ctx.globalAlpha = b.t > b.max - 0.3 ? Math.max(0, (b.max - b.t) / 0.3) : 1;
    ctx.translate(a.x, a.y); ctx.scale(pop, pop); ctx.translate(-a.x, -a.y);
    // bubble and tail outlined with a double-width stroke and filled over, so the seam disappears
    const tail = () => {
      const tx = clamp(a.x, bx + 14, bx + bw - 14);
      ctx.beginPath(); ctx.moveTo(tx - 6, by + bh - 6); ctx.lineTo(clamp(a.x, bx + 4, bx + bw - 4), Math.max(a.y, by + bh + 7)); ctx.lineTo(tx + 6, by + bh - 6); ctx.closePath();
    };
    ctx.strokeStyle = OUT; ctx.lineWidth = 5; ctx.lineJoin = 'round';
    roundRect(ctx, bx, by, bw, bh, 12); ctx.stroke();
    tail(); ctx.stroke();
    ctx.fillStyle = '#fff';
    roundRect(ctx, bx, by, bw, bh, 12); ctx.fill();
    tail(); ctx.fill();
    drawText(b.text, bx + bw / 2, by + bh / 2 + 1, fitSize(b.text, size, bw - 12), b.color, 'center', false);
    ctx.restore();
  }
}

function drawMuteButton() {
  const { x, y, r } = MUTE_BTN;
  ctx.fillStyle = 'rgba(43,23,64,0.75)'; ctx.beginPath(); ctx.arc(x, y, r - 4, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(x - 8, y - 3); ctx.lineTo(x - 4, y - 3); ctx.lineTo(x + 1, y - 8); ctx.lineTo(x + 1, y + 8); ctx.lineTo(x - 4, y + 3); ctx.lineTo(x - 8, y + 3); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  if (Sound.muted) {
    ctx.strokeStyle = '#ff6b6b';
    ctx.beginPath(); ctx.moveTo(x + 4, y - 4); ctx.lineTo(x + 10, y + 4); ctx.moveTo(x + 10, y - 4); ctx.lineTo(x + 4, y + 4); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(x + 2, y, 5, -0.8, 0.8); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 2, y, 9, -0.8, 0.8); ctx.stroke();
  }
  ctx.lineCap = 'butt';
}
function drawMusicButton() {
  const { x, y, r } = MUSIC_BTN;
  ctx.fillStyle = 'rgba(43,23,64,0.75)'; ctx.beginPath(); ctx.arc(x, y, r - 4, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(x - 4.5, y + 5, 3.2, 2.4, -0.4, 0, TAU); ctx.ellipse(x + 4.5, y + 3, 3.2, 2.4, -0.4, 0, TAU); ctx.fill();
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(x - 1.6, y + 4.5); ctx.lineTo(x - 1.6, y - 6); ctx.lineTo(x + 7.4, y - 8); ctx.lineTo(x + 7.4, y + 2.5); ctx.stroke();
  if (!Music.on) {
    ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 9, y - 9); ctx.lineTo(x + 9, y + 9); ctx.stroke();
    ctx.lineCap = 'butt';
  }
}

// --- Buttons: drawn each frame and remembered so taps can find them ---
let uiButtons = [];
function hitButton(v) {
  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (v.x >= b.x && v.x <= b.x + b.w && v.y >= b.y && v.y <= b.y + b.h) { b.onTap(); return true; }
  }
  return false;
}
function uiButton(x, y, w, h, label, onTap, fill = '#ff8fc8', size = 18, radius = h / 2) {
  ctx.fillStyle = fill; roundRect(ctx, x, y, w, h, radius); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke();
  if (label) drawText(label, x + w / 2, y + h / 2 + 1, fitSize(label, size, w - 16), '#fff');
  uiButtons.push({ x, y, w, h, onTap });
}

// A little belly icon that fills out, with a pip per belly level, the
// digestion timer under the pips and the food-points multiplier below.
const BELLY_W = 104;
// Green when he's light and jumps high, through to red when he's stuffed.
const BELLY_COLORS = ['#9be564', '#c8ec4a', '#ffd65a', '#ffa23c', '#ff6a3c', '#ff3b4a'];
function bellyColor(b) { return BELLY_COLORS[clamp(Math.round(b / CONFIG.belly.max * 5), 0, 5)]; }
function drawBellyMeter(x, y) {
  const p = player, C = CONFIG.belly, col = bellyColor(p.belly), full = p.belly >= C.max;
  const pulse = full ? 0.5 + 0.5 * Math.sin(game.time * 8) : 0;
  ctx.fillStyle = full ? `rgba(120,20,40,${0.75 + pulse * 0.15})` : 'rgba(43,23,64,0.75)'; roundRect(ctx, x, y, BELLY_W, 30, 15); ctx.fill();
  ctx.strokeStyle = full ? mixColor('#ffffff', '#ff3b4a', pulse) : '#fff'; ctx.lineWidth = full ? 2.5 : 2; ctx.stroke();
  const r = Math.min(12, 6 + p.belly * 1.2);
  ctx.fillStyle = mixColor(KIT.fur, '#ff4a4a', p.belly / C.max * 0.7);
  ctx.strokeStyle = OUT; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x + 16, y + 15, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(x + 16 + r * 0.35, y + 15 + r * 0.3, 1.3, 0, TAU); ctx.fill();
  for (let k = 0; k < C.max; k++) {
    const px = x + 38 + k * 13, on = k < p.belly;
    ctx.fillStyle = on ? col : 'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.arc(px, y + 11, 4.2, 0, TAU); ctx.fill();
    if (on) { ctx.strokeStyle = OUT; ctx.lineWidth = 1.2; ctx.stroke(); }
  }
  if (p.belly > 0) {                                   // time until the next burp
    const k = 1 - p.digestT / C.digestSeconds;
    ctx.fillStyle = 'rgba(255,255,255,0.2)'; roundRect(ctx, x + 34, y + 19, 60, 5, 2.5); ctx.fill();
    ctx.fillStyle = '#d8ff7a'; roundRect(ctx, x + 34, y + 19, Math.max(5, 60 * k), 5, 2.5); ctx.fill();
  }
  // what it means, in words
  const mult = 1 + p.belly * C.bonusPerLevel, ms = mult % 1 ? mult.toFixed(1) : mult;
  const label = full ? `STUFFED! x${ms} pts` : p.belly >= 3 ? `heavy · x${ms} pts` : p.belly > 0 ? `x${ms} points` : 'light: big jumps';
  drawText(label, x + 8, y + 42, 12, full ? mixColor(col, '#ffffff', pulse * 0.6) : col, 'left');
}

// Bottom-left: what power-ups are running.
function drawPowerUps() {
  const p = player, C = CONFIG, x = 14, y = H - 26, w = Math.min(110, W * 0.3);
  if (p.laserT > 0) {
    drawText('CHASING THE DOT', x, y - 16, 13, EFFECT_COLORS.laser, 'left');
    ctx.fillStyle = 'rgba(43,23,64,0.85)'; roundRect(ctx, x - 3, y - 3, w + 6, 14, 7); ctx.fill();
    ctx.fillStyle = EFFECT_COLORS.laser; roundRect(ctx, x, y, Math.max(8, w * p.laserT / C.laserTime), 8, 4); ctx.fill();
  }
  if (p.bigBounces > 0) drawText(`BIG BOUNCE x${p.bigBounces}`, W - 14, y + 2, 14, EFFECT_COLORS.bounce, 'right');
}

function drawHUD() {
  // score in the middle, kept clear of the belly meter (left) and the sound buttons (right)
  const str = fmt(game.score), room = W - 2 * (BELLY_W + 18);
  const s = fitSize(str, 40, room) * (1 + game.scorePulse * 0.2);
  drawText(str, W / 2, 28, s, '#fff');
  drawText(`${fmt(game.heightM)}m`, W / 2, 56, 15, '#cfc2ea');
  drawBellyMeter(8, 9);
  if (game.universe > 1) drawText(`UNIVERSE ${game.universe}`, W - 12, 56, 12, '#d8ff7a', 'right');
  drawPowerUps();
  // how to move, for the first few seconds
  if (game.hint > 0 && game.state === 'play') {
    const a = Math.min(1, game.hint) * 0.8;
    ctx.globalAlpha = a;
    if (isTouch && !(tilt.wanted && tilt.seen)) {
      const fx = W / 2 + Math.sin(game.time * 2.5) * W * 0.22, cy = H - 120;   // a finger sliding side to side
      ctx.fillStyle = 'rgba(43,23,64,0.6)'; ctx.beginPath(); ctx.arc(fx, cy, 22, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(fx, cy, 8, 0, TAU); ctx.fill();
      drawText('drag your thumb to steer', W / 2, H - 82, 15, '#fff');
    } else if (isTouch) drawText('tilt to move', W / 2, H - 90, 16, '#fff');
    else drawText('← →  or  A / D  to move', W / 2, H - 90, 16, '#fff');
    ctx.globalAlpha = 1;
  }
}

function drawBanner() {
  const b = game.banner;
  if (!b) return;
  const t = b.t, inT = Math.min(1, t / 0.35), out = t > 2.3 ? Math.max(0, 1 - (t - 2.3) / 0.5) : 1;
  ctx.save();
  ctx.globalAlpha = out;
  const y = b.big ? H * 0.36 : H * 0.28, sc = easeOutBack(inT);
  ctx.translate(W / 2, y); ctx.scale(sc, sc);
  if (b.big) {
    const size = fitSize(b.title, 46, W - 30);
    ctx.font = `bold ${size}px ${FONT}`;
    const total = ctx.measureText(b.title).width;
    let x = -total / 2;
    for (let i = 0; i < b.title.length; i++) {
      const ch = b.title[i], cw = ctx.measureText(ch).width;
      drawText(ch, x + cw / 2, Math.sin(game.time * 5 + i * 0.6) * 4, size, i % 2 ? '#d8ff7a' : '#9be564');
      x += cw;
    }
    drawText(b.sub, 0, size * 0.95, fitSize(b.sub, 28, W - 30), '#ffd1e8');
  } else {
    drawText(b.title, 0, 0, fitSize(b.title, 30, W - 30), b.color);
    drawText(b.sub, 0, 30, 16, '#fff');
  }
  ctx.restore();
}

function drawTitle() {
  const title = 'SKY SCRATCHER';
  const size = fitSize(title, 58, W - 30);
  ctx.font = `bold ${size}px ${FONT}`;
  const total = ctx.measureText(title).width;
  let x = W / 2 - total / 2;
  for (let i = 0; i < title.length; i++) {
    const ch = title[i], cw = ctx.measureText(ch).width;
    const bob = Math.sin(game.time * 4 + i * 0.6) * 5;
    drawText(ch, x + cw / 2, 108 + bob, size, i % 2 ? '#ffd65a' : '#ffb347');
    x += cw;
  }
  const sub = "Rolo's endless climb to the stars";
  drawText(sub, W / 2, 108 + size * 0.8, fitSize(sub, 18, W - 30), '#ffd1e8');

  // what the food does
  const legend = [['fish', 'big bounce', EFFECT_COLORS.bounce], ['catnip', 'zoomies', EFFECT_COLORS.rush], ['laser', 'chase', EFFECT_COLORS.laser]];
  const gap = Math.min(110, (W - 20) / 3);
  legend.forEach(([k, label, c], i) => {
    const lx = W / 2 + (i - 1) * gap, ly = 212;
    ctx.fillStyle = c; ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.arc(lx, ly, 22, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    drawFood(k, lx, ly + Math.sin(game.time * 3 + i) * 3, Math.sin(game.time * 2 + i) * 0.15, 1.15);
    drawText(label, lx, ly + 34, 14, c);
  });

  const lines = isTouch
    ? [['DRAG your thumb to steer', '#fff'], [tilt.supported ? '...or switch on TILT (top left)' : 'Rolo bounces all by himself', '#cfc2ea']]
    : [['← →  or  A / D  to move', '#fff'], ['Rolo bounces all by himself', '#cfc2ea']];
  lines.push(['Eat up. Dodge dogs and tomcats.', '#ffb347'], ['Mind the seagulls!', '#ffb347']);
  const ls = Math.min(17, ...lines.map(([l]) => fitSize(l, 17, W - 30)));
  lines.forEach(([l, c], i) => drawText(l, W / 2, 284 + i * (ls + 9), ls, c));
  if (Math.sin(game.time * 5) > -0.3) drawText(isTouch ? 'Tap to start!' : 'Press SPACE or tap to start!', W / 2, 410, fitSize('Press SPACE or tap to start!', 24, W - 30), '#ffe066');
  drawText(GAME_VERSION, W - 8, H - 10, 10, 'rgba(255,255,255,0.55)', 'right', false);
  if (game.best > 0) {
    const b = `Best: ${fmt(game.best)}${game.bestUniverse > 1 ? `  ·  reached Universe ${game.bestUniverse}` : ''}`;
    drawText(b, W / 2, 442, fitSize(b, 15, W - 30), '#fff6e8');
  }
  // install as an app
  if (!install.standalone && window.self === window.top) {
    if (install.prompt) uiButton(W / 2 - 80, H - 58, 160, 36, 'INSTALL APP', () => { install.armed = true; }, '#5fd068', 17);
    else if (isIOS) {
      const tip = 'To install: tap Share, then "Add to Home Screen"';
      drawText(tip, W / 2, H - 40, fitSize(tip, 14, W - 30), '#fff6e8');
    }
  }
  if (isTouch && tilt.supported) {
    const on = tilt.wanted;
    uiButton(12, 8, 118, 32, on ? 'TILT: ON' : 'TILT: OFF', toggleTilt, on ? '#9be564' : '#8a6aa0', 15);
    if (on && tilt.seen) {                       // a little live meter, to show it's working
      ctx.fillStyle = 'rgba(43,23,64,0.75)'; roundRect(ctx, 16, 46, 110, 10, 5); ctx.fill();
      ctx.fillStyle = '#9be564'; ctx.beginPath(); ctx.arc(71 + tilt.value * 50, 51, 6, 0, TAU); ctx.fill();
      ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.stroke();
    } else if (on) drawText('waiting for tilt...', 71, 54, 11, '#fff');
  }
}

function drawGameOver() {
  const t = Math.min(1, game.overT / 0.35), e = easeOutBack(t);
  ctx.fillStyle = `rgba(20,8,35,${0.55 * t})`;
  ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W - 24, 400), ph = 430;
  ctx.save();
  ctx.translate(W / 2, H / 2 - 20);
  ctx.scale(e, e);
  ctx.fillStyle = '#fff6e8'; roundRect(ctx, -pw / 2, -ph / 2, pw, ph, 22); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = OUT; ctx.stroke();
  ctx.save(); roundRect(ctx, -pw / 2, -ph / 2, pw, ph, 22); ctx.clip();
  ctx.fillStyle = '#ffb347'; ctx.fillRect(-pw / 2, -ph / 2, pw, 62);
  ctx.restore();
  ctx.beginPath(); ctx.moveTo(-pw / 2, -ph / 2 + 62); ctx.lineTo(pw / 2, -ph / 2 + 62); ctx.stroke();
  drawText('GAME OVER', 0, -ph / 2 + 32, fitSize('GAME OVER', 36, pw - 40), '#fff');

  // the quip
  const ms = 17, lines = wrapLines(game.message, ms, pw - 40);
  const shown = lines.slice(0, 3), my = -ph / 2 + 100 - (shown.length - 1) * 11;
  shown.forEach((l, i) => drawText(l, 0, my + i * 22, ms, '#6a3f8a', 'center', false));

  // scores
  const col = pw / 4;
  drawText('SCORE', -col, -50, 15, '#8a6aa0', 'center', false);
  drawText('BEST', col, -50, 15, '#8a6aa0', 'center', false);
  drawText(fmt(game.score), -col, -16, fitSize(fmt(game.score), 38, col * 1.8), '#ffe066');
  drawText(fmt(game.best), col, -16, fitSize(fmt(game.best), 38, col * 1.8), '#9be564');
  if (game.newBest) {
    ctx.save(); ctx.translate(col + 44, -56); ctx.rotate(0.25 + Math.sin(game.time * 6) * 0.08);
    drawStar(0, 0, 26, 0, '#ff6b9c');
    drawText('NEW!', 0, 1, 12, '#fff', 'center', false);
    ctx.restore();
  }
  const stats = `Climbed ${fmt(game.heightM)}m  ·  Ate ${game.foodEaten} snack${game.foodEaten === 1 ? '' : 's'}`;
  drawText(stats, 0, 24, fitSize(stats, 15, pw - 30), '#8a6aa0', 'center', false);

  // rank
  const ri = rankIndex(game.heightM), rank = RANKS[ri][1];
  drawText('Rank', 0, 54, 15, '#8a6aa0', 'center', false);
  drawText(rank, 0, 82, fitSize(rank, 28, pw - 30), '#ff8fc8');
  const next = RANKS[ri + 1];
  const nextStr = next ? `Next: ${next[1]} at ${fmt(next[0])}m` : 'Top cat achieved!';
  drawText(nextStr, 0, 110, fitSize(nextStr, 14, pw - 30), '#8a6aa0', 'center', false);
  if (game.maxUniverse > 1) {
    const u = `Reached Universe ${game.maxUniverse}: ${theme(game.maxUniverse).title}`;
    drawText(u, 0, 140, fitSize(u, 15, pw - 30), '#2f8a4a', 'center', false);
  }
  if (game.overT > 0.6 && Math.sin(game.time * 5) > -0.3) drawText('Tap to try again', 0, ph / 2 - 24, 22, '#fff');
  ctx.restore();
  if (game.overT > 0.3) {
    const mw = Math.min(W - 40, 160), y = Math.min(H - 30, H / 2 - 20 + ph / 2 + 32);
    uiButton(W / 2 - mw / 2, y - 21, mw, 42, 'MENU', goToMenu, '#9be564', 20);
  }
}

// The black hole trip: he spirals in and stretches like spaghetti, the screen
// swirls, white flash, and out he pops into the next universe.
function drawPortal(cam) {
  const pr = game.portal, p = player;
  if (!pr) return;
  const bx = pr.bh.x, by = pr.bh.y - cam;
  if (!pr.switched) {
    const k = clamp(pr.t / PORTAL_IN, 0, 1);
    swirl(bx, by, Math.hypot(W, H) + 20, k * k * 3, k * 5, 16);
    // spiral path in
    const dx = wrapDX(bx, pr.sx), dy = pr.sy - by;
    const a0 = Math.atan2(dy, dx), r0 = Math.hypot(dx, dy);
    const a = a0 + k * k * 9, r = r0 * Math.pow(1 - k, 1.4);
    const px = bx + Math.cos(a) * r, py = by + Math.sin(a) * r;
    const toward = Math.atan2(by - py, bx - px);
    ctx.save();
    ctx.globalAlpha = 1 - Math.pow(k, 5);
    ctx.translate(px, py);
    ctx.rotate(toward + Math.PI / 2 + Math.sin(k * 20) * 0.08);   // head first, towards the hole
    ctx.scale(Math.max(0.15, 1 - k * 0.85), 1 + k * 3.5);         // spaghettification
    drawPlayerAt(0, BODY_H / 2);
    ctx.restore();
    // a few strands of him streaming in
    ctx.strokeStyle = 'rgba(253,232,222,0.6)'; ctx.lineWidth = 2;
    for (let s = 0; s < 4; s++) {
      ctx.beginPath(); ctx.moveTo(px + Math.sin(s * 2) * 6, py + Math.cos(s * 2) * 6);
      ctx.quadraticCurveTo((px + bx) / 2 + Math.cos(a + s) * 20, (py + by) / 2 + Math.sin(a + s) * 20, bx, by); ctx.stroke();
    }
  } else {
    const k = clamp((pr.t - PORTAL_IN) / 0.55, 0, 1);
    const sw = 1 - clamp((pr.t - PORTAL_IN) / PORTAL_OUT, 0, 1);
    if (sw > 0.02) swirl(W / 2, H / 2, Math.hypot(W, H) / 2 + 20, -sw * sw * 3, sw * 4, 14);
    const s = easeOutBack(k);
    if (s > 0.01) {
      ctx.save(); ctx.translate(p.x, p.y - cam - BODY_H / 2); ctx.scale(s, s); ctx.rotate((1 - k) * 6);
      drawPlayerAt(0, BODY_H / 2);
      ctx.restore();
    }
  }
}

// The red dot, and a faint beam from somewhere off the bottom of the screen.
function drawLaserDot(cam) {
  const d = game.dot, x = d.x, y = d.y - cam, t = game.time;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,59,74,0.18)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W * 0.15, H + 10); ctx.lineTo(x, y); ctx.stroke();
  const g = ctx.createRadialGradient(x, y, 0, x, y, 30);
  g.addColorStop(0, 'rgba(255,59,74,0.7)'); g.addColorStop(1, 'rgba(255,59,74,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 30, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ff2a3a'; ctx.beginPath(); ctx.arc(x, y, 8 + Math.sin(t * 30) * 1, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - 1.5, y - 1.5, 3, 0, TAU); ctx.fill();
  ctx.restore();
}

function render(alpha) {
  const camR = lerp(game.prevCam, game.cam, alpha);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.fillStyle = '#1a1430'; ctx.fillRect(0, 0, W, H);
  uiButtons = [];

  ctx.save();
  if (game.shake > 0) ctx.translate(rand(-1, 1) * game.shake, rand(-1, 1) * game.shake);
  drawBackground(camR);
  drawBlackHoles(camR);
  drawPlatforms(camR);
  drawFoods(camR);
  drawHazards(camR);
  drawGulls(camR);
  if (game.state === 'portal') drawPortal(camR);
  else {
    const p = player;
    let px = p.x;
    if (Math.abs(p.x - p.prevX) < W / 2) px = lerp(p.prevX, p.x, alpha);
    drawPlayer(px, lerp(p.prevY, p.y, alpha) - camR);
  }
  drawParticles(camR);
  drawBubbles(camR);
  if (player.laserT > 0 && game.state === 'play') drawLaserDot(camR);
  ctx.restore();

  if (game.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, game.flash * 1.2)})`; ctx.fillRect(0, 0, W, H); }
  if (player.rushT > 0 && game.state === 'play') { ctx.fillStyle = 'rgba(95,208,104,0.08)'; ctx.fillRect(0, 0, W, H); }
  if (player.laserT > 0 && game.state === 'play') { ctx.fillStyle = 'rgba(255,59,74,0.06)'; ctx.fillRect(0, 0, W, H); }

  if (game.state === 'title') drawTitle();
  else drawHUD();
  drawBanner();
  if (game.state === 'over') drawGameOver();
  drawMuteButton();
  drawMusicButton();
}

/* ---------------------------------------------------------------------
   15. MAIN LOOP — fixed timestep simulation, interpolated rendering
   --------------------------------------------------------------------- */
let lastTime = performance.now(), accumulator = 0;

function frame(now) {
  if (install.updateReady && game.state === 'title') { install.updateReady = false; location.reload(); return; }
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  dt = clamp(dt, 0, CONFIG.maxFrameTime);
  accumulator += dt;
  let steps = 0;
  while (accumulator >= CONFIG.fixedStep && steps < 60) {
    step(CONFIG.fixedStep);
    accumulator -= CONFIG.fixedStep;
    steps++;
  }
  render(accumulator / CONFIG.fixedStep);
  requestAnimationFrame(frame);
}

// Installing as an app. The manifest and icons live next to index.html;
// the service worker lets the installed game start offline. (Neither works
// when the game is shown inside another page, or opened as a local file.)
const GAME_VERSION = 'v1.1';    // shown small on the title screen; bump it with each release
const install = {
  updateReady: false,      // a newer version is waiting: reload when back on the title screen
  prompt: null,            // Chrome & co. hand us this when the game can be installed
  armed: false,
  standalone: (window.matchMedia && matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches) || navigator.standalone === true,
};
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); install.prompt = e; });
window.addEventListener('appinstalled', () => { install.prompt = null; install.standalone = true; });
function installApp() {
  const ev = install.prompt;
  if (!ev) return;
  install.prompt = null;
  ev.prompt();
  if (ev.userChoice) ev.userChoice.then(r => { if (r.outcome !== 'accepted') install.prompt = ev; }).catch(() => {});
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.self === window.top) {
  // Check for a new version on every launch, and whenever the app comes back
  // from the background (installed apps often just resume, never reload).
  const hadController = !!navigator.serviceWorker.controller;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(reg => document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); }))
      .catch(() => {});
  });
  // A new version has taken over: reload into it, but only on the title
  // screen, never in the middle of a game.
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) install.updateReady = true; });
}

window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();
setupTitle();
canvas.focus();
requestAnimationFrame(frame);

// Handy for debugging / tweaking from the console.
window.SkyScratcher = { game, player, CONFIG, Sound, startGame };
</script>
