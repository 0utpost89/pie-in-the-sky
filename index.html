      ctx.beginPath(); ctx.ellipse(0, 0, r * 1.9, r * 0.5, 0, 0, Math.PI); ctx.stroke();
      break;
    }
    case 'nebula': {
      const c = ['255,143,200', '196,155,255', '122,211,255'][((seed % 3) + 3) % 3];
      for (let k = 0; k < 4; k++) {
        const g = ctx.createRadialGradient(k * 22 - 30, Math.sin(k * 2) * 15, 0, k * 22 - 30, Math.sin(k * 2) * 15, 60 * s);
        g.addColorStop(0, `rgba(${c},0.35)`); g.addColorStop(1, `rgba(${c},0)`);
        ctx.fillStyle = g; ctx.fillRect(k * 22 - 100, -80, 140, 160);
      }
      break;
    }
    case 'galaxy': case 'swirl': {
      ctx.rotate(t * (kind === 'swirl' ? 0.5 : 0.08) + seed);
      ctx.strokeStyle = kind === 'swirl' ? 'rgba(196,155,255,0.45)' : 'rgba(255,230,250,0.4)'; ctx.lineWidth = 3;
      for (let arm = 0; arm < 2; arm++) {
        ctx.beginPath();
        for (let k = 0; k < 30; k++) { const a = arm * Math.PI + k * 0.2, r = k * 1.6 * s; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r * 0.6); }
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,240,220,0.7)'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.fill();
      break;
    }
    case 'rock': {
      ctx.rotate(t * 0.3 + seed);
      ctx.fillStyle = 'rgba(138,127,143,0.6)';
      ctx.beginPath(); for (let k = 0; k < 7; k++) { const a = k / 7 * TAU, r = (7 + hash2(seed, k) * 4) * s; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill();
      break;
    }
    // --- Pork Pie World ---
    case 'steam': {
      for (let k = 0; k < 3; k++) {
        const rise = (((t * 12 + k * 20 + seed * 7) % 60) + 60) % 60;
        ctx.globalAlpha = alpha * 0.35 * (1 - rise / 60);
        ctx.fillStyle = '#fff6e8';
        ctx.beginPath(); ctx.arc(Math.sin(t + k * 2) * 10 + k * 14 - 14, -rise, 14 + rise * 0.3, 0, TAU); ctx.fill();
      }
      break;
    }
    case 'teapot': {
      ctx.rotate(Math.sin(t * 0.8 + seed) * 0.2);
      ctx.scale(0.8 * s, 0.8 * s);
      ctx.fillStyle = 'rgba(255,246,232,0.75)'; ctx.strokeStyle = 'rgba(43,23,64,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, 20, 15, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(18, -2); ctx.quadraticCurveTo(32, -6, 34, -16); ctx.stroke();
      ctx.beginPath(); ctx.arc(-22, 0, 7, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
      ctx.fillStyle = 'rgba(255,143,200,0.6)'; ctx.fillRect(-14, -3, 28, 4);
      ctx.fillStyle = 'rgba(255,246,232,0.75)'; ctx.beginPath(); ctx.ellipse(0, -15, 8, 3, 0, 0, TAU); ctx.fill(); ctx.stroke();
      break;
    }
    case 'cup': {
      ctx.rotate(Math.sin(t + seed) * 0.3);
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.strokeStyle = 'rgba(43,23,64,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-10, -8); ctx.lineTo(10, -8); ctx.lineTo(7, 8); ctx.lineTo(-7, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(11, -1, 4, -Math.PI / 2, Math.PI / 2); ctx.stroke();
      ctx.fillStyle = 'rgba(160,100,50,0.8)'; ctx.beginPath(); ctx.ellipse(0, -8, 9, 2, 0, 0, TAU); ctx.fill();
      break;
    }
    case 'piePlanet': {
      const r = 30 * s;
      ctx.fillStyle = '#c8823a'; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#e8a650'; ctx.beginPath(); ctx.arc(0, -r * 0.1, r * 0.92, Math.PI, TAU); ctx.fill();
      ctx.fillStyle = '#ffd38a';
      for (let k = 0; k < 9; k++) { const a = Math.PI + k / 8 * Math.PI; ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.92, -r * 0.1 + Math.sin(a) * r * 0.92, 3.5 * s, 0, TAU); ctx.fill(); }
      break;
    }
    case 'gravyMoon': {
      ctx.fillStyle = '#8a5a30'; ctx.beginPath(); ctx.arc(0, 0, 24 * s, 0, TAU); ctx.fill();
      ctx.fillStyle = '#a8703c'; ctx.beginPath(); ctx.arc(-6, -6, 10 * s, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.arc(-9, -10, 4 * s, 0, TAU); ctx.fill();
      break;
    }
    // --- Pizza World ---
    case 'basil': {
      ctx.rotate(t * 0.6 + seed);
      ctx.fillStyle = 'rgba(80,170,70,0.75)'; ctx.beginPath(); ctx.ellipse(0, 0, 12 * s, 6 * s, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(40,110,40,0.8)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-11 * s, 0); ctx.lineTo(11 * s, 0); ctx.stroke();
      break;
    }
    case 'mushroom': {
      ctx.rotate(Math.sin(t * 0.7 + seed) * 0.4);
      ctx.fillStyle = 'rgba(240,226,200,0.8)'; roundRect(ctx, -5, 0, 10, 14, 4); ctx.fill();
      ctx.fillStyle = 'rgba(210,180,140,0.85)'; ctx.beginPath(); ctx.arc(0, 2, 15, Math.PI, TAU); ctx.fill();
      break;
    }
    case 'cheese': {
      ctx.strokeStyle = 'rgba(255,214,90,0.6)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-60, 0); ctx.quadraticCurveTo(0, 30 + Math.sin(t + seed) * 6, 60, 0); ctx.stroke();
      break;
    }
    case 'pepPlanet': case 'olivePlanet': {
      const r = 26 * s, pep = kind === 'pepPlanet';
      ctx.fillStyle = pep ? '#c8382a' : '#3a3a28'; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      if (pep) {
        ctx.fillStyle = 'rgba(120,20,20,0.5)';
        [[6, -8, 4], [-8, 4, 5], [9, 10, 3]].forEach(([a, b, rr]) => { ctx.beginPath(); ctx.arc(a * s, b * s, rr * s, 0, TAU); ctx.fill(); });
      } else {
        ctx.fillStyle = '#1a1a10'; ctx.beginPath(); ctx.arc(0, 0, r * 0.38, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.arc(-r * 0.4, -r * 0.4, r * 0.25, 0, TAU); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

// A soft cloud made of overlapping circles, width w and height h around (x, y).
function puff(x, y, w, h) {
  ctx.beginPath();
  const n = 5;
  for (let k = 0; k < n; k++) {
    const fx = (k / (n - 1)) * 2 - 1;
    const r = h * (1.1 - Math.abs(fx) * 0.45);
    ctx.moveTo(x + fx * w * 0.6 + r, y - r * 0.3);
    ctx.arc(x + fx * w * 0.6, y - r * 0.3, r, 0, TAU);
  }
  ctx.fill();
}

// The start of it all: the back garden of a terraced house at sunset.
function drawGroundScene(cam) {
  const gy = 0 - cam;                              // lawn top on screen
  if (gy < -100 || gy > H + 600) return;
  const at = (f, base) => gy * f + base * (1 - f);
  // low sun
  const sunY = at(0.2, H - 170);
  if (sunY < H + 60) {
    ctx.fillStyle = 'rgba(255,214,140,0.35)'; ctx.beginPath(); ctx.arc(W * 0.72, sunY, 70, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd38a'; ctx.beginPath(); ctx.arc(W * 0.72, sunY, 40, 0, TAU); ctx.fill();
  }
  // the city behind: tower blocks with a few lights on
  const hy = at(0.35, H - 130);
  for (let i = 0; i < Math.ceil(W / 46) + 1; i++) {
    const bw = 34 + hash2(i, 31) * 22, bh = 190 + hash2(i, 32) * 150, bx = i * 46 - 20 + hash2(i, 33) * 10;
    ctx.fillStyle = i % 2 ? '#5e4690' : '#6a52a0';
    ctx.fillRect(bx, hy - bh + 40, bw, bh + 200);
    ctx.fillStyle = 'rgba(255,224,138,0.75)';
    for (let r = 0; r < bh / 14 - 1; r++) for (let c = 0; c < bw / 10 - 1; c++) {
      if (hash2(i * 31 + r, c) > 0.72) ctx.fillRect(bx + 5 + c * 10, hy - bh + 48 + r * 14, 4, 6);
    }
    if (hash2(i, 34) > 0.75) { ctx.fillStyle = '#5e4690'; ctx.fillRect(bx + bw / 2 - 1, hy - bh + 22, 2, 18);   // aerial with a blinking light
      if (Math.sin(game.time * 3 + i) > 0.6) { ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc(bx + bw / 2, hy - bh + 21, 2, 0, TAU); ctx.fill(); } }
  }
  // a terrace of house backs, chimney pots and all
  const ty = at(0.6, H - 92);
  for (let i = 0; i < Math.ceil(W / 110) + 1; i++) {
    const hx = i * 110 - 20, hh = 120 + (i % 2) * 8, top = ty - hh;
    ctx.fillStyle = i % 2 ? '#9a4a4a' : '#a85656'; ctx.fillRect(hx, top, 110, hh + 4);
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for (let r = 0; r < hh; r += 8) ctx.fillRect(hx, top + r, 110, 1);
    ctx.fillStyle = '#4a3a5e';                       // roof
    ctx.beginPath(); ctx.moveTo(hx - 4, top + 2); ctx.lineTo(hx + 14, top - 26); ctx.lineTo(hx + 96, top - 26); ctx.lineTo(hx + 114, top + 2); ctx.fill();
    ctx.fillStyle = '#8a4040'; ctx.fillRect(hx + 72, top - 44, 18, 22);  // chimney
    ctx.fillStyle = '#c87a50'; ctx.fillRect(hx + 74, top - 50, 6, 8); ctx.fillRect(hx + 82, top - 50, 6, 8);
    // windows, some lit
    for (const [wx, wy] of [[18, 22], [64, 22], [18, 70]]) {
      const lit = hash2(i, wx + wy) > 0.4;
      ctx.fillStyle = '#e8dcc8'; ctx.fillRect(hx + wx - 3, top + wy - 3, 30, 34);
      ctx.fillStyle = lit ? '#ffe08a' : '#4a3f6e'; ctx.fillRect(hx + wx, top + wy, 24, 28);
      ctx.fillStyle = '#e8dcc8'; ctx.fillRect(hx + wx + 11, top + wy, 2, 28); ctx.fillRect(hx + wx, top + wy + 13, 24, 2);
    }
    ctx.fillStyle = '#5a7ab0'; ctx.fillRect(hx + 64, top + 66, 26, hh - 62);   // back door
    ctx.fillStyle = '#ffd65a'; ctx.beginPath(); ctx.arc(hx + 84, top + 66 + (hh - 62) / 2, 1.8, 0, TAU); ctx.fill();
  }
  // washing line
  const wy = at(0.8, H - 92) - 70;
  ctx.strokeStyle = 'rgba(43,23,64,0.7)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-10, wy); ctx.quadraticCurveTo(W / 2, wy + 18, W + 10, wy); ctx.stroke();
  const items = ['#7ad3ff', '#ff8fc8', '#fff', '#ffe066', '#3fb6a8'];
  for (let k = 0; k < 5; k++) {
    const lx = W * (0.15 + k * 0.17), ly = wy + 18 * (1 - Math.pow((lx - W / 2) / (W / 2), 2)) - 1, sw = Math.sin(game.time * 2 + k) * 0.08;
    ctx.save(); ctx.translate(lx, ly); ctx.rotate(sw);
    ctx.fillStyle = items[k];
    if (k % 2) { ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(9, 0); ctx.lineTo(8, 10); ctx.lineTo(2, 10); ctx.lineTo(0, 5); ctx.lineTo(-2, 10); ctx.lineTo(-8, 10); ctx.closePath(); ctx.fill(); }
    else { roundRect(ctx, -6, 0, 12, 22, 3); ctx.fill(); ctx.fillRect(-11, 0, 22, 6); }
    ctx.fillStyle = '#c8a070'; ctx.fillRect(-1, -3, 2, 5);
    ctx.restore();
  }
  // fence panels
  const fy = at(0.85, H - 92);
  ctx.fillStyle = '#8a6040'; ctx.fillRect(-10, fy - 46, W + 20, 50);
  ctx.strokeStyle = '#6a4630'; ctx.lineWidth = 1;
  ctx.beginPath(); for (let x = -10; x < W + 20; x += 9) { ctx.moveTo(x, fy - 46); ctx.lineTo(x, fy + 4); } ctx.stroke();
  ctx.fillStyle = '#5e3e28'; for (let x = 20; x < W + 20; x += 120) ctx.fillRect(x, fy - 52, 8, 56);
  // wheelie bins (one with a fishbone poking out, naturally)
  for (const [bx, col, lid] of [[W * 0.06, '#3e7a4a', '#2f6a3c'], [W * 0.06 + 40, '#3a3a46', '#2b2b33']]) {
    ctx.fillStyle = col; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx, fy - 46); ctx.lineTo(bx + 34, fy - 46); ctx.lineTo(bx + 31, fy); ctx.lineTo(bx + 3, fy); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = lid; roundRect(ctx, bx - 2, fy - 52, 38, 7, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2b2b33'; ctx.beginPath(); ctx.arc(bx + 6, fy - 1, 4, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#fff6e8'; ctx.lineWidth = 1.6;
  const fbx = W * 0.06 + 18, fby = fy - 56;
  ctx.beginPath(); ctx.moveTo(fbx - 8, fby); ctx.lineTo(fbx + 8, fby);
  for (let k = -5; k <= 3; k += 4) { ctx.moveTo(fbx + k, fby - 3); ctx.lineTo(fbx + k, fby + 3); }
  ctx.moveTo(fbx + 8, fby); ctx.lineTo(fbx + 12, fby - 3); ctx.moveTo(fbx + 8, fby); ctx.lineTo(fbx + 12, fby + 3); ctx.stroke();
}

/* ---------------------------------------------------------------------
   11. RENDER: PLATFORMS — four roles, re-skinned per zone
       standard: solid & flat     bouncy: pink-tinged dome that squashes
       moving: cyan arrows        breakable: cracked & crumbly
   --------------------------------------------------------------------- */
function drawPlatforms(cam) {
  for (const pl of game.platforms) {
    const sy = pl.y - cam;
    if (sy < -80 || sy > H + 80) continue;
    if (pl.broken) {
      const t = pl.breakT;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - t / 1.1);
      for (const half of [-1, 1]) {
        ctx.save();
        const cx = pl.x + pl.w / 2;
        ctx.translate(cx + half * t * 40, sy);
        ctx.rotate(half * t * 1.6);
        ctx.beginPath(); ctx.rect(half < 0 ? -pl.w / 2 - 30 : 0, -40, pl.w / 2 + 30, 80); ctx.clip();
        ctx.translate(-cx, 0);
        drawPlatform(pl, pl.x, 0);
        ctx.restore();
      }
      ctx.restore();
    } else drawPlatform(pl, pl.x, sy);
  }
}

function drawPlatform(pl, x, y) {
  const w = pl.w;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (pl.look === 'lawn') { drawLawn(x, y, w); return; }
  const fn = PLATFORM_SKINS[pl.look] || PLATFORM_SKINS.garden;
  ctx.save();
  if (pl.role === 'bouncy') {                       // squash down from the top
    const s = clamp(pl.squash, -0.5, 1);
    ctx.translate(x + w / 2, y + 14);
    ctx.scale(1 + s * 0.18, 1 - s * 0.35);
    ctx.translate(-(x + w / 2), -(y + 14));
  }
  fn[pl.role](pl, x, y, w);
  ctx.restore();
  if (pl.role === 'moving') drawChevrons(x, y, w, pl);
  if (pl.role === 'breakable' && !pl.broken && Math.sin(game.time * 3 + pl.seed) > 0.96) {
    addParticle({ type: 'crumb', x: x + rand(4, w - 4), y: pl.y + 8, vx: 0, vy: 20, g: 300, r0: 1.5, rot: 0, vr: 3, life: 0, max: 0.6, color: crumbColors(pl)[0] });
  }
}

// Little cyan arrows either side: "this one moves".
function drawChevrons(x, y, w, pl) {
  const pulse = 0.6 + 0.4 * Math.sin(game.time * 6 + pl.seed);
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#7ad3ff'; ctx.strokeStyle = OUT; ctx.lineWidth = 1.5;
  for (const side of [-1, 1]) {
    const ax = side < 0 ? x - 7 : x + w + 7, ay = y + 6;
    ctx.beginPath(); ctx.moveTo(ax + side * 6, ay); ctx.lineTo(ax - side * 2, ay - 6); ctx.lineTo(ax - side * 2, ay + 6); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

// The back yard: concrete paving, a few weeds, and her food bowl.
function drawLawn(x, y, w) {
  ctx.fillStyle = '#8a8296'; ctx.fillRect(x, y + 8, w, H + 200);
  ctx.fillStyle = '#b4acbc'; ctx.fillRect(x, y, w, 12);
  ctx.strokeStyle = 'rgba(43,23,64,0.3)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.moveTo(x, y + 12); ctx.lineTo(x + w, y + 12);
  for (let gx = x + 20; gx < x + w; gx += 52) { ctx.moveTo(gx, y); ctx.lineTo(gx, y + 12); }
  for (let gx = x + 46; gx < x + w; gx += 52) { ctx.moveTo(gx, y + 12); ctx.lineTo(gx, y + 60); }
  ctx.moveTo(x, y + 36); ctx.lineTo(x + w, y + 36);
  ctx.stroke();
  ctx.fillStyle = '#7ccf62';                              // weeds in the cracks
  for (let gx = x + 20; gx < x + w; gx += 104) { ctx.beginPath(); ctx.moveTo(gx - 3, y); ctx.lineTo(gx - 1, y - 6); ctx.lineTo(gx + 1, y); ctx.lineTo(gx + 3, y - 5); ctx.lineTo(gx + 4, y); ctx.fill(); }
  // her food bowl
  const bx = x + w * 0.8, by = y;
  ctx.fillStyle = '#ff8fc8'; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(bx - 11, by - 7); ctx.lineTo(bx + 11, by - 7); ctx.lineTo(bx + 8, by); ctx.lineTo(bx - 8, by); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c87a40'; ctx.beginPath(); ctx.ellipse(bx, by - 7, 9, 2.2, 0, Math.PI, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = `bold 5px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('KITTY', bx, by - 3.2);
}

function slab(x, y, w, h, fill, top, r = 5) {
  ctx.fillStyle = fill; roundRect(ctx, x, y, w, h, r); ctx.fill();
  if (top) { ctx.fillStyle = top; roundRect(ctx, x + 2, y + 1.5, w - 4, h * 0.38, r - 1); ctx.fill(); }
  ctx.strokeStyle = OUT; ctx.lineWidth = 2; roundRect(ctx, x, y, w, h, r); ctx.stroke();
}
function cracks(x, y, w, h, color = 'rgba(43,23,64,0.7)') {
  ctx.strokeStyle = color; ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(x + w * 0.3, y + 1); ctx.lineTo(x + w * 0.36, y + h * 0.5); ctx.lineTo(x + w * 0.3, y + h - 1);
  ctx.moveTo(x + w * 0.36, y + h * 0.5); ctx.lineTo(x + w * 0.46, y + h * 0.6);
  ctx.moveTo(x + w * 0.7, y + 1); ctx.lineTo(x + w * 0.64, y + h * 0.55); ctx.lineTo(x + w * 0.72, y + h - 1);
  ctx.stroke();
}
// A dome for bouncy platforms; the top is at y.
function dome(x, y, w, h, fill, rim) {
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(x, y + h);
  ctx.quadraticCurveTo(x, y - 2, x + w / 2, y - 2);
  ctx.quadraticCurveTo(x + w, y - 2, x + w, y + h);
  ctx.closePath(); ctx.fill();
  if (rim) { ctx.fillStyle = rim; roundRect(ctx, x - 2, y + h - 5, w + 4, 7, 3.5); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y + h); ctx.quadraticCurveTo(x, y - 2, x + w / 2, y - 2); ctx.quadraticCurveTo(x + w, y - 2, x + w, y + h); ctx.stroke();
}

const PLATFORM_SKINS = {
  garden: {
    standard(pl, x, y, w) {                       // concrete paving slab
      slab(x, y, w, 14, '#bdb6ac', '#dcd6cc', 3);
      ctx.fillStyle = 'rgba(43,23,64,0.18)';
      for (let k = 0; k < 6; k++) ctx.fillRect(x + 6 + hash2(pl.seed, k) * (w - 12), y + 5 + hash2(pl.seed, k + 9) * 6, 2, 2);
      ctx.strokeStyle = 'rgba(43,23,64,0.25)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x + w / 2, y + 2); ctx.lineTo(x + w / 2, y + 12); ctx.stroke();
    },
    bouncy(pl, x, y, w) {                         // a springy grass tuft with clover
      dome(x, y, w, 14, '#6cc46a', '#ff8fc8');
      ctx.strokeStyle = '#3e8a3c'; ctx.lineWidth = 2;
      for (let k = 0; k < 7; k++) {
        const bx = x + 6 + k * (w - 12) / 6, sw = Math.sin(game.time * 4 + k + pl.seed) * 2;
        ctx.beginPath(); ctx.moveTo(bx, y + 4); ctx.lineTo(bx + sw, y - 6 - (k % 2) * 3); ctx.stroke();
      }
      ctx.fillStyle = '#ff8fc8';
      [0.25, 0.7].forEach(fx => { ctx.beginPath(); ctx.arc(x + w * fx, y - 1, 3, 0, TAU); ctx.fill(); });
      ctx.fillStyle = '#fff'; [0.25, 0.7].forEach(fx => { ctx.beginPath(); ctx.arc(x + w * fx, y - 1, 1.2, 0, TAU); ctx.fill(); });
    },
    moving(pl, x, y, w) {                         // a tree branch, swaying along
      ctx.fillStyle = '#8a5a34'; roundRect(ctx, x, y, w, 11, 5.5); ctx.fill();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = '#6a4226'; ctx.lineWidth = 1;
      ctx.beginPath(); for (let k = 8; k < w - 6; k += 11) { ctx.moveTo(x + k, y + 3); ctx.lineTo(x + k + 5, y + 8); } ctx.stroke();
      for (const fx of [0.1, 0.9]) {
        ctx.fillStyle = '#5aa04a'; ctx.beginPath(); ctx.arc(x + w * fx, y + 12, 8, 0, TAU); ctx.arc(x + w * fx + 7, y + 8, 6, 0, TAU); ctx.fill();
        ctx.fillStyle = '#7ccf62'; ctx.beginPath(); ctx.arc(x + w * fx - 2, y + 9, 4, 0, TAU); ctx.fill();
      }
    },
    breakable(pl, x, y, w) {                      // a rotten branch
      ctx.fillStyle = '#5a4434'; roundRect(ctx, x, y, w, 10, 3); ctx.fill();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.setLineDash([6, 3]); roundRect(ctx, x, y, w, 10, 3); ctx.stroke(); ctx.setLineDash([]);
      cracks(x, y, w, 10, '#2b1a14');
      ctx.fillStyle = '#e0455b'; ctx.beginPath(); ctx.arc(x + w * 0.8, y + 1, 4, Math.PI, TAU); ctx.fill();   // a toadstool
      ctx.fillStyle = '#fff'; ctx.fillRect(x + w * 0.8 - 1, y + 1, 2, 3);
      ctx.beginPath(); ctx.arc(x + w * 0.8 - 1.5, y - 1.5, 0.8, 0, TAU); ctx.fill();
    },
  },
  sky: {
    standard(pl, x, y, w) {                       // a fat, dependable cloud
      ctx.fillStyle = '#d9cff2'; roundRect(ctx, x, y + 2, w, 15, 8); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x + w * 0.3, y + 4, 9, 0, TAU); ctx.arc(x + w * 0.6, y + 2, 11, 0, TAU); ctx.arc(x + w * 0.82, y + 6, 7, 0, TAU); ctx.fill();
      roundRect(ctx, x, y + 2, w, 11, 6); ctx.fill();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; roundRect(ctx, x, y + 2, w, 15, 8); ctx.stroke();
    },
    bouncy(pl, x, y, w) {                         // springy pink cumulus
      dome(x, y - 4, w, 18, '#ffd1e8', '#ff8fc8');
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + w * 0.35, y + 2, 6, 0, TAU); ctx.arc(x + w * 0.6, y + 1, 5, 0, TAU); ctx.fill();
    },
    moving(pl, x, y, w) {                         // a passing plane: land on the wings
      const dir = pl.vx >= 0 ? 1 : -1, cx = x + w / 2;
      ctx.save(); ctx.translate(cx, y); ctx.scale(dir, 1);
      ctx.fillStyle = '#e8eef8'; roundRect(ctx, -w / 2 + 6, -2, w - 12, 8, 4); ctx.fill();          // wings
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#ffffff'; roundRect(ctx, -w * 0.45, 2, w * 0.95, 15, 7.5); ctx.fill(); ctx.stroke();   // fuselage
      ctx.fillStyle = '#3f6fc4'; ctx.fillRect(-w * 0.45 + 4, 10, w * 0.9, 3);
      ctx.fillStyle = '#7ad3ff'; for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(-w * 0.3 + k * 9, 7, 2, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#3f6fc4';                                                          // tail fin
      ctx.beginPath(); ctx.moveTo(-w * 0.42, 4); ctx.lineTo(-w * 0.5, -10); ctx.lineTo(-w * 0.38, -10); ctx.lineTo(-w * 0.3, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2b1740'; ctx.beginPath(); ctx.arc(w * 0.44, 7, 3, -1, 1); ctx.fill();   // cockpit
      ctx.restore();
    },
    breakable(pl, x, y, w) {                      // a wispy cloud: don't trust it twice
      ctx.save(); ctx.globalAlpha = 0.85;
      ctx.fillStyle = '#c9c4dc';
      roundRect(ctx, x, y, w, 9, 4.5); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + 6, y + 3); ctx.lineTo(x + w * 0.5, y + 3); ctx.moveTo(x + w * 0.3, y + 6); ctx.lineTo(x + w - 6, y + 6); ctx.stroke();
      ctx.strokeStyle = OUT; ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]); roundRect(ctx, x, y, w, 9, 4.5); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
    },
  },
  edge: {
    standard(pl, x, y, w) {                       // a gold-foil satellite
      ctx.fillStyle = '#a0a8b8'; ctx.fillRect(x, y + 3, w, 4);
      ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.strokeRect(x, y + 3, w, 4);
      slab(x + w * 0.28, y, w * 0.44, 16, '#e8b84a', '#ffd97a', 3);
      ctx.strokeStyle = 'rgba(160,110,20,0.6)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x + w * 0.35, y + 6); ctx.lineTo(x + w * 0.65, y + 12); ctx.moveTo(x + w * 0.4, y + 13); ctx.lineTo(x + w * 0.6, y + 5); ctx.stroke();
      for (const fx of [0, 1]) { ctx.fillStyle = '#ffffff'; roundRect(ctx, x + fx * (w - 16), y, 16, 10, 2); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.stroke(); }
      ctx.strokeStyle = '#a0a8b8'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + w / 2, y + 16); ctx.lineTo(x + w / 2, y + 24); ctx.stroke();
      ctx.fillStyle = '#e0e4ec'; ctx.beginPath(); ctx.arc(x + w / 2, y + 24, 5, 0, Math.PI); ctx.fill();
    },
    bouncy(pl, x, y, w) {                         // inflatable lander airbags
      ctx.fillStyle = '#ff8fc8'; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
      const n = Math.max(3, Math.round(w / 20)), r = w / n / 2 + 1;
      for (let k = 0; k < n; k++) { ctx.beginPath(); ctx.arc(x + r + k * (w - 2 * r) / (n - 1), y + r - 1, r, 0, TAU); ctx.fill(); ctx.stroke(); }
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      for (let k = 0; k < n; k++) { ctx.beginPath(); ctx.arc(x + r * 0.7 + k * (w - 2 * r) / (n - 1), y + r * 0.6, r * 0.3, 0, TAU); ctx.fill(); }
    },
    moving(pl, x, y, w) {                         // a silver satellite on the move
      slab(x, y, w, 12, '#d8dee8', '#ffffff', 4);
      ctx.fillStyle = '#e0455b'; ctx.fillRect(x + 4, y + 7, w - 8, 2.5);
      ctx.strokeStyle = '#a0a8b8'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + w * 0.5, y); ctx.lineTo(x + w * 0.5, y - 9); ctx.stroke();
      if (Math.sin(game.time * 6 + pl.seed) > 0) { ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc(x + w * 0.5, y - 10, 2.5, 0, TAU); ctx.fill(); }
    },
    breakable(pl, x, y, w) {                      // a broken solar panel
      ctx.fillStyle = '#3f6fc4';
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + 8); ctx.lineTo(x + w * 0.8, y + 12); ctx.lineTo(x + w * 0.6, y + 9); ctx.lineTo(x, y + 12); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#9fd0ff'; ctx.lineWidth = 1;
      ctx.beginPath(); for (let k = 10; k < w; k += 10) { ctx.moveTo(x + k, y + 1); ctx.lineTo(x + k, y + 10); } ctx.moveTo(x, y + 5); ctx.lineTo(x + w, y + 5); ctx.stroke();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.setLineDash([6, 3]);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + 8); ctx.lineTo(x + w * 0.8, y + 12); ctx.lineTo(x + w * 0.6, y + 9); ctx.lineTo(x, y + 12); ctx.closePath(); ctx.stroke();
      ctx.setLineDash([]);
      cracks(x, y, w, 11, '#fff');
      if (Math.sin(game.time * 9 + pl.seed) > 0.9) emitSparkles(pl.x + w * 0.6, pl.y + 8, 1, ['#ffe066', '#fff']);
    },
  },
  deep: {
    standard(pl, x, y, w) {                       // a lumpy asteroid
      ctx.fillStyle = '#8a7f8f'; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + 4, y);
      ctx.lineTo(x + w - 4, y);
      const n = 6;
      for (let k = 0; k <= n; k++) { const fx = 1 - k / n; ctx.lineTo(x + fx * w, y + 9 + Math.sin(fx * Math.PI) * 9 + hash2(pl.seed, k) * 4); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#a89cad'; roundRect(ctx, x + 4, y + 1.5, w - 8, 4, 2); ctx.fill();
      ctx.fillStyle = '#6a6070';
      for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(x + w * (0.25 + k * 0.25), y + 10 + (k % 2) * 3, 2.5 + (k % 2), 0, TAU); ctx.fill(); }
    },
    bouncy(pl, x, y, w) {                         // a glowing alien jelly pod
      const glow = 0.5 + 0.5 * Math.sin(game.time * 3 + pl.seed);
      ctx.fillStyle = `rgba(155,229,100,${0.25 + glow * 0.2})`;
      ctx.beginPath(); ctx.ellipse(x + w / 2, y + 8, w * 0.65, 18, 0, 0, TAU); ctx.fill();
      dome(x, y, w, 16, '#9be564', '#ff8fc8');
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(x + w * 0.32, y + 4, 6, 3, -0.3, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ff8fc8'; [0.55, 0.72].forEach((fx, k) => { ctx.beginPath(); ctx.arc(x + w * fx, y + 7 + k * 2, 2.2, 0, TAU); ctx.fill(); });
    },
    moving(pl, x, y, w) {
      if (pl.variant === 1) { drawUFO(pl, x, y, w); return; }
      const dir = pl.vx >= 0 ? 1 : -1, cx = x + w / 2;     // a comet with a glowing tail
      const tail = ctx.createLinearGradient(cx, 0, cx - dir * (w + 70), 0);
      tail.addColorStop(0, 'rgba(255,190,110,0.9)'); tail.addColorStop(0.5, 'rgba(255,120,170,0.45)'); tail.addColorStop(1, 'rgba(255,120,170,0)');
      ctx.fillStyle = tail;
      ctx.beginPath(); ctx.moveTo(cx, y - 4); ctx.lineTo(cx - dir * (w + 70), y + 7); ctx.lineTo(cx, y + 18); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,214,140,0.35)'; ctx.beginPath(); ctx.ellipse(cx, y + 7, w * 0.62, 14, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#bfe6ff'; roundRect(ctx, x, y, w, 14, 7); ctx.fill();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#ffffff'; roundRect(ctx, x + 4, y + 2, w - 8, 4, 2); ctx.fill();
    },
    breakable(pl, x, y, w) {                      // a cracked ice shard
      ctx.fillStyle = '#cfeeff'; ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.setLineDash([6, 3]);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w * 0.85, y + 10); ctx.lineTo(x + w * 0.5, y + 14); ctx.lineTo(x + w * 0.15, y + 10); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.setLineDash([]);
      cracks(x, y, w, 11, '#5a8ab0');
    },
  },
  pie: {
    standard(pl, x, y, w) {                       // a slab of pork pie crust
      ctx.fillStyle = '#c8823a'; roundRect(ctx, x, y, w, 16, 4); ctx.fill();
      ctx.fillStyle = '#f0b860'; roundRect(ctx, x, y, w, 7, 3); ctx.fill();
      ctx.fillStyle = '#ffd38a';
      for (let k = 6; k < w - 3; k += 8) { ctx.beginPath(); ctx.arc(x + k, y + 1, 3, Math.PI, TAU); ctx.fill(); }
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; roundRect(ctx, x, y, w, 16, 4); ctx.stroke();
      ctx.fillStyle = '#e88a8a'; ctx.fillRect(x + w * 0.66, y + 8, w * 0.22, 6);     // a peek of pink filling
    },
    bouncy(pl, x, y, w) {                         // wobbly pork pie jelly
      const wob = Math.sin(game.time * 8 + pl.seed) * 1.5 * (0.3 + Math.abs(pl.squash));
      ctx.save(); ctx.globalAlpha = 0.92;
      dome(x - wob, y + wob, w + wob * 2, 16 - wob, '#ffcf5a', '#ff8fc8');
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,0.65)'; ctx.beginPath(); ctx.ellipse(x + w * 0.3, y + 4, 5, 2.5, -0.3, 0, TAU); ctx.fill();
    },
    moving(pl, x, y, w) {                         // a sliding sausage
      ctx.fillStyle = '#b8603e'; roundRect(ctx, x, y, w, 14, 7); ctx.fill();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = 'rgba(255,220,200,0.45)'; roundRect(ctx, x + 6, y + 2.5, w - 12, 3, 1.5); ctx.fill();
      ctx.strokeStyle = '#8a4428'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.lineTo(x - 2, y + 7); ctx.lineTo(x + 4, y + 10); ctx.moveTo(x + w - 4, y + 4); ctx.lineTo(x + w + 2, y + 7); ctx.lineTo(x + w - 4, y + 10); ctx.stroke();
    },
    breakable(pl, x, y, w) {                      // a sheet of flaky pastry
      ctx.fillStyle = '#f3d08a'; roundRect(ctx, x, y, w, 10, 3); ctx.fill();
      ctx.strokeStyle = '#d4a050'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x + 3, y + 4); ctx.lineTo(x + w - 3, y + 4); ctx.moveTo(x + 3, y + 7); ctx.lineTo(x + w - 3, y + 7); ctx.stroke();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.setLineDash([6, 3]); roundRect(ctx, x, y, w, 10, 3); ctx.stroke(); ctx.setLineDash([]);
      cracks(x, y, w, 10, '#8a5a20');
    },
  },
  pizza: {
    standard(pl, x, y, w) {                       // a pizza box
      slab(x, y, w, 15, '#d9a868', '#ebc48a', 3);
      ctx.strokeStyle = 'rgba(43,23,64,0.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x + 3, y + 6); ctx.lineTo(x + w - 3, y + 6); ctx.stroke();
      ctx.fillStyle = '#e0455b'; ctx.beginPath(); ctx.arc(x + w / 2, y + 10, 3.5, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + w / 2, y + 10, 1.5, 0, TAU); ctx.fill();
    },
    bouncy(pl, x, y, w) {                         // a ball of dough
      dome(x, y, w, 16, '#f6e7c8', '#ff8fc8');
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(x + 8 + hash2(pl.seed, k) * (w - 16), y + 3 + hash2(pl.seed, k + 5) * 6, 1.2, 0, TAU); ctx.fill(); }
    },
    moving(pl, x, y, w) {                         // a flying pizza slice
      const dir = pl.vx >= 0 ? 1 : -1, cx = x + w / 2;
      ctx.save(); ctx.translate(cx, y); ctx.scale(dir, 1);
      ctx.fillStyle = '#ffd65a';
      ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(w / 2, 0); ctx.lineTo(w / 2 - 6, 14); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#e8a650'; roundRect(ctx, -w / 2 - 2, -3, 12, 9, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#c8382a'; [[-12, 4], [6, 4], [18, 7]].forEach(([a, b]) => { ctx.beginPath(); ctx.arc(a * w / 80, b, 3, 0, TAU); ctx.fill(); });
      ctx.restore();
    },
    breakable(pl, x, y, w) {                      // cracker-thin crust, a bit burnt
      ctx.fillStyle = '#e8b860'; roundRect(ctx, x, y, w, 9, 3); ctx.fill();
      ctx.fillStyle = '#6a4020'; [0.2, 0.55, 0.8].forEach(fx => { ctx.beginPath(); ctx.arc(x + w * fx, y + 5, 2, 0, TAU); ctx.fill(); });
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.setLineDash([6, 3]); roundRect(ctx, x, y, w, 9, 3); ctx.stroke(); ctx.setLineDash([]);
      cracks(x, y, w, 9, '#6a4020');
    },
  },
};

function drawUFO(pl, x, y, w) {
  const cx = x + w / 2;
  if (pl.beamOn || (player.beam && player.beam.plat === pl)) {      // the tractor beam
    const k = 0.6 + 0.4 * Math.sin(game.time * 20);
    const g = ctx.createLinearGradient(0, y + 10, 0, y + 280);
    g.addColorStop(0, `rgba(155,229,100,${0.55 * k})`); g.addColorStop(1, 'rgba(155,229,100,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(cx - 14, y + 10); ctx.lineTo(cx + 14, y + 10); ctx.lineTo(cx + 14 + 270 * 0.32, y + 280); ctx.lineTo(cx - 14 - 270 * 0.32, y + 280); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(196,155,255,0.85)'; ctx.beginPath(); ctx.ellipse(cx, y + 1, w * 0.22, 11, 0, Math.PI, TAU); ctx.fill();
  ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#9be564'; ctx.beginPath(); ctx.arc(cx, y - 3, 3.5, 0, TAU); ctx.fill();          // a little green pilot
  ctx.fillStyle = '#b8bec8'; ctx.beginPath(); ctx.ellipse(cx, y + 6, w / 2, 7, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e0e4ec'; ctx.beginPath(); ctx.ellipse(cx, y + 4, w / 2 - 4, 3, 0, 0, TAU); ctx.fill();
  for (let k = 0; k < 5; k++) {
    ctx.fillStyle = (Math.floor(game.time * 6) + k) % 3 ? '#ffe066' : '#ff6b6b';
    ctx.beginPath(); ctx.arc(cx - w * 0.36 + k * w * 0.18, y + 8, 2, 0, TAU); ctx.fill();
  }
}

/* ---------------------------------------------------------------------
   12. RENDER: FOOD, HAZARDS, SEAGULLS, BLACK HOLES
   --------------------------------------------------------------------- */
function drawFoods(cam) {
  for (const f of game.foods) {
    if (f.eaten) continue;
    const sy = f.y - cam + Math.sin(f.t * 2.5) * 4;
    if (sy < -40 || sy > H + 40) continue;
    const eff = FOODS[f.kind].effect;
    if (eff) {                                         // a glow shows it does something special
      const k = 0.5 + 0.5 * Math.sin(f.t * 4);
      ctx.fillStyle = EFFECT_COLORS[eff];
      ctx.globalAlpha = 0.18 + k * 0.14;
      ctx.beginPath(); ctx.arc(f.x, sy, 21 + k * 3, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    drawFood(f.kind, f.x, sy, Math.sin(f.t * 1.7) * 0.15, 1);
  }
}

function drawFood(kind, x, y, rot, s) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  switch (kind) {
    case 'porkpie': {
      // A pork pie cut in half, seen from the front: the back half of the
      // crimped lid, and the cut face showing crust, jelly and pink meat.
      const R = 13, RY = 5, TOP = -4, H = 15;
      // back half of the lid
      ctx.fillStyle = '#e8ad55';
      ctx.beginPath(); ctx.ellipse(0, TOP, R, RY, 0, Math.PI, TAU); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f6c977';
      for (let k = 0; k <= 8; k++) {
        const a = Math.PI + 0.2 + k / 8 * (Math.PI - 0.4);
        ctx.beginPath(); ctx.arc(Math.cos(a) * R * 0.9, TOP + Math.sin(a) * RY * 0.75, 1.5, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = '#c9823a'; ctx.beginPath(); ctx.ellipse(-2, TOP - 2.6, 3, 1.1, -0.2, 0, TAU); ctx.fill();
      // the cut face
      ctx.fillStyle = '#c9823a'; roundRect(ctx, -R, TOP, R * 2, H, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f2d36b'; roundRect(ctx, -R + 2.6, TOP + 2.6, R * 2 - 5.2, H - 5, 3); ctx.fill();
      ctx.fillStyle = '#ef9a9a'; roundRect(ctx, -R + 4.6, TOP + 4.6, R * 2 - 9.2, H - 8.6, 2.5); ctx.fill();
      ctx.fillStyle = '#c96f78';
      [[-5, 3], [-1, 5.5], [3, 2.5], [5.5, 6], [1, 8]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 0.9, 0, TAU); ctx.fill(); });
      ctx.fillStyle = 'rgba(255,240,200,0.4)'; roundRect(ctx, -R + 0.8, TOP + 3, 1.4, H - 7, 0.7); ctx.fill();
      break;
    }
    case 'sausageroll': {
      // Flaky puff pastry wrapped round sausage meat, scored on top,
      // with the open end showing the meat inside the pastry layers.
      ctx.rotate(-0.12);
      const g = ctx.createLinearGradient(0, -8, 0, 8);
      g.addColorStop(0, '#f2c46a'); g.addColorStop(0.55, '#e0a04a'); g.addColorStop(1, '#c07a34');
      ctx.fillStyle = g;
      // slightly lumpy top edge so it looks puffed
      ctx.beginPath(); ctx.moveTo(-15, -3);
      ctx.quadraticCurveTo(-15, -8, -10, -8);
      ctx.quadraticCurveTo(-5, -9.2, 0, -8.2); ctx.quadraticCurveTo(5, -9.2, 10, -8);
      ctx.lineTo(11, -8); ctx.lineTo(11, 8); ctx.lineTo(-11, 8);
      ctx.quadraticCurveTo(-15, 8, -15, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
      // flaky layers along the bottom
      ctx.strokeStyle = 'rgba(255,236,190,0.75)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (const yy of [4, 6]) { ctx.moveTo(-12, yy); for (let xx = -12; xx <= 9; xx += 3) ctx.quadraticCurveTo(xx + 1.5, yy - 0.8, xx + 3, yy); }
      ctx.stroke();
      // three diagonal score marks across the top
      ctx.lineWidth = 1.8; ctx.strokeStyle = '#8a4a1e';
      ctx.beginPath(); for (const k of [-8, -2, 4]) { ctx.moveTo(k - 1.5, -7.2); ctx.lineTo(k + 2.5, -1.5); } ctx.stroke();
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,236,190,0.7)';
      ctx.beginPath(); for (const k of [-8, -2, 4]) { ctx.moveTo(k - 0.4, -7.2); ctx.lineTo(k + 3.4, -2); } ctx.stroke();
      // the open end: rings of pastry with the meat in the middle
      ctx.lineWidth = 2; ctx.strokeStyle = OUT;
      ctx.fillStyle = '#f6dfa0'; ctx.beginPath(); ctx.ellipse(11, 0, 5, 8, 0, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#d9a95a'; ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.ellipse(11, 0, 3.9, 6.6, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = '#b97a5c'; ctx.beginPath(); ctx.ellipse(11, 0.3, 2.9, 5.1, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#e3a08a'; [[10.2, -2.2], [12, 1], [10.6, 2.8]].forEach(([a, b]) => { ctx.beginPath(); ctx.arc(a, b, 0.8, 0, TAU); ctx.fill(); });
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; roundRect(ctx, -11, -6, 8, 2, 1); ctx.fill();
      break;
    }
    case 'pizza': {
      ctx.fillStyle = '#ffd65a';
      ctx.beginPath(); ctx.moveTo(-12, -10); ctx.lineTo(12, -10); ctx.lineTo(0, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e8a650'; roundRect(ctx, -14, -14, 28, 7, 3.5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#c8382a'; [[-4, -3], [4, -2], [0, 5]].forEach(([a, b]) => { ctx.beginPath(); ctx.arc(a, b, 2.6, 0, TAU); ctx.fill(); });
      ctx.fillStyle = '#ffd65a'; ctx.beginPath(); ctx.moveTo(2, 9); ctx.quadraticCurveTo(3, 15, 1.5, 17); ctx.quadraticCurveTo(0, 14, 0.5, 10); ctx.fill();
      break;
    }
    case 'mustard': case 'piccalilli': {
      const pic = kind === 'piccalilli';
      ctx.fillStyle = pic ? '#c8c040' : '#ffd23c'; roundRect(ctx, -10, -9, 20, 21, 5); ctx.fill(); ctx.stroke();
      if (pic) { ctx.fillStyle = '#6a8a2a'; [[-4, 2], [3, 6], [4, -2], [-3, 8]].forEach(([a, b]) => ctx.fillRect(a, b, 3, 3)); }
      ctx.fillStyle = '#fff6e8'; roundRect(ctx, -8, -3, 16, 7, 2); ctx.fill();
      ctx.fillStyle = pic ? '#6a8a2a' : '#e0455b'; ctx.font = `bold 5px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(pic ? 'PICCA' : 'HOT!', 0, 0.8);
      ctx.fillStyle = '#e0455b'; roundRect(ctx, -9, -14, 18, 6, 2); ctx.fill(); ctx.stroke();
      break;
    }
    case 'tea': {
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(-10, -8); ctx.lineTo(10, -8); ctx.lineTo(8, 10); ctx.lineTo(-8, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(11, 0, 4.5, -Math.PI / 2, Math.PI / 2); ctx.stroke();
      ctx.fillStyle = '#b07040'; ctx.beginPath(); ctx.ellipse(0, -8, 9, 2.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ff8fc8'; ctx.fillRect(-8, -1, 16, 3);
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5;
      const t = game.time;
      for (const dx of [-3, 3]) { ctx.beginPath(); ctx.moveTo(dx, -12); ctx.quadraticCurveTo(dx + Math.sin(t * 3 + dx) * 3, -17, dx, -22); ctx.stroke(); }
      break;
    }
    case 'gravy': {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.moveTo(-13, -4); ctx.quadraticCurveTo(-12, 8, 0, 8); ctx.quadraticCurveTo(10, 8, 12, -2); ctx.lineTo(18, -7); ctx.lineTo(8, -5); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#7a4a22'; ctx.beginPath(); ctx.ellipse(-1, -4, 11, 2.5, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(15, -6); ctx.quadraticCurveTo(17, 0, 15, 3); ctx.quadraticCurveTo(13, 0, 15, -6); ctx.fill();
      ctx.strokeStyle = OUT; ctx.beginPath(); ctx.arc(-13, 1, 4, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
      ctx.fillStyle = '#ffd38a'; roundRect(ctx, -6, 9, 12, 3, 1.5); ctx.fill();
      break;
    }
    case 'chilli': {
      ctx.rotate(0.5);
      ctx.fillStyle = '#e0352a';
      ctx.beginPath(); ctx.moveTo(-12, -2); ctx.quadraticCurveTo(0, -9, 12, 2); ctx.quadraticCurveTo(14, 6, 10, 6); ctx.quadraticCurveTo(0, 2, -12, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#5aa04a'; roundRect(ctx, -16, -3, 6, 7, 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(-6, -4, 8, 2);
      break;
    }
    case 'meatball': {
      ctx.fillStyle = '#8a4a2a'; ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#c8382a'; ctx.beginPath(); ctx.arc(0, -4, 9, Math.PI * 1.05, Math.PI * 1.95); ctx.quadraticCurveTo(4, 0, 0, -1); ctx.quadraticCurveTo(-4, 1, -8.6, -6.5); ctx.fill();
      ctx.fillStyle = '#5aa04a'; ctx.beginPath(); ctx.ellipse(2, -9, 3, 1.6, 0.4, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(-4, 3, 2, 0, TAU); ctx.fill();
      break;
    }
    case 'garlicbread': {
      ctx.rotate(-0.15);
      ctx.fillStyle = '#e8b860'; roundRect(ctx, -15, -6, 30, 12, 5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff0c0'; roundRect(ctx, -12, -6, 24, 5, 2.5); ctx.fill();
      ctx.fillStyle = '#5aa04a'; [[-8, -4], [-2, -3], [5, -4], [9, -3]].forEach(([a, b]) => ctx.fillRect(a, b, 2, 1.5));
      ctx.strokeStyle = '#b8823a'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(-5, 5); ctx.moveTo(4, 0); ctx.lineTo(4, 5); ctx.stroke();
      break;
    }
    case 'olive': {
      ctx.fillStyle = '#4a5a24'; ctx.beginPath(); ctx.ellipse(0, 0, 9, 11, 0.3, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e0455b'; ctx.beginPath(); ctx.arc(1, -3, 3, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.ellipse(-3, 3, 2, 3, 0.3, 0, TAU); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

/* --- old, slow people (and their equivalents in other universes) --- */
function drawHazards(cam) {
  for (const hz of game.hazards) {
    const q = hazardPos(hz), sy = q.y - cam;
    if (sy < -100 || sy > H + 100) continue;
    const dir = hz.dir || 1;
    switch (hz.kind) {
      case 'pensioner': drawOldie(q.x, sy, dir, hz.t, 'uk'); break;
      case 'nonna': drawOldie(q.x, sy, dir, hz.t, 'nonna'); break;
      case 'scooter': drawScooter(q.x, sy, dir, hz.t, false); break;
      case 'vespa': drawScooter(q.x, sy, dir, hz.t, true); break;
      case 'queue': drawQueue(q.x, sy, dir, hz.t); break;
      case 'snail': drawSnail(q.x, sy, dir, hz.t, 1); break;
      case 'balloon': drawBalloon(q.x, sy, hz.t, 'uk'); break;
      case 'pizzaballoon': drawBalloon(q.x, sy, hz.t, 'nonna'); break;
      case 'potsnail': drawPotSnail(q.x, sy, dir, hz.t); break;
      case 'jetzimmer': drawJetZimmer(q.x, sy, dir, hz.t); break;
    }
  }
}

// A pensioner shuffling along. style 'uk' (cardigan, flat cap, walking stick)
// or 'nonna' (black dress, headscarf, rolling pin).
function drawOldie(x, y, dir, t, style, scale = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir * scale, scale);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const shuffle = Math.sin(t * 5) * 2, bob = Math.abs(Math.sin(t * 5)) * 1;
  const nonna = style === 'nonna';
  // legs
  ctx.strokeStyle = nonna ? '#3a3040' : '#6a5a50'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-2, -14); ctx.lineTo(-3 + shuffle, -1); ctx.moveTo(2, -14); ctx.lineTo(3 - shuffle, -1); ctx.stroke();
  ctx.fillStyle = '#3a2a2a'; ctx.beginPath(); ctx.ellipse(-2 + shuffle, -1, 4, 2, 0, 0, TAU); ctx.ellipse(4 - shuffle, -1, 4, 2, 0, 0, TAU); ctx.fill();
  // body, hunched forward
  ctx.save(); ctx.translate(0, -bob); ctx.rotate(0.25);
  ctx.fillStyle = nonna ? '#2e2838' : '#c49bff';
  ctx.strokeStyle = OUT; ctx.lineWidth = 1.8;
  roundRect(ctx, -8, -34, 16, 22, 6); ctx.fill(); ctx.stroke();
  if (!nonna) { ctx.fillStyle = '#ffe066'; [-27, -21, -15].forEach(by => { ctx.beginPath(); ctx.arc(3, by, 1.2, 0, TAU); ctx.fill(); }); }
  else { ctx.fillStyle = '#fff'; roundRect(ctx, -6, -24, 12, 10, 3); ctx.fill(); }      // apron
  // head
  ctx.fillStyle = '#ffd9bd'; ctx.beginPath(); ctx.arc(2, -40, 7, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2b1740'; ctx.beginPath(); ctx.arc(5, -41, 1, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#2b1740'; ctx.lineWidth = 1.2;                   // grumpy frown
  ctx.beginPath(); ctx.arc(5, -35.5, 2.2, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3, -44); ctx.lineTo(7, -43); ctx.stroke();
  ctx.strokeStyle = '#c0c0c8'; ctx.lineWidth = 1.5;                   // specs
  ctx.beginPath(); ctx.arc(5.5, -41, 2.3, 0, TAU); ctx.stroke();
  if (nonna) {
    ctx.fillStyle = '#4a3a5e';
    ctx.beginPath(); ctx.arc(2, -41, 8.5, Math.PI * 0.95, Math.PI * 2.05); ctx.lineTo(-5, -34); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = '#eeeeee'; ctx.beginPath(); ctx.arc(-3, -41, 4, 0, TAU); ctx.fill();   // white hair tuft
    ctx.fillStyle = '#6a5a50'; ctx.beginPath(); ctx.ellipse(2, -46, 8, 3.2, 0, Math.PI, TAU); ctx.fill();  // flat cap
    roundRect(ctx, 2, -47, 10, 3, 1.5); ctx.fill();
  }
  // arm and stick / rolling pin
  ctx.strokeStyle = nonna ? '#2e2838' : '#c49bff'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(2, -28); ctx.lineTo(10, -20); ctx.stroke();
  ctx.restore();
  if (nonna) {
    ctx.save(); ctx.translate(12, -24 - bob); ctx.rotate(-0.6 + Math.sin(t * 3) * 0.3);
    ctx.fillStyle = '#d9a868'; ctx.strokeStyle = OUT; ctx.lineWidth = 1.5;

function drawScooter(x, y, dir, t, vespa) {

  // steering column + basket
