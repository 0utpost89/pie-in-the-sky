    const ws = zoneWeights(zones, h);
    let r = hash2(i, 9 + f), zi = 0;
    for (let k = 0; k < ws.length; k++) { r -= ws[k]; if (r <= 0) { zi = k; break; } zi = k; }
    const list = DECOR[zones[zi].id][layer];
    const kind = list[Math.floor(hash2(i, 11 + f) * list.length)];
    if (kind === 'none') continue;
    const x = hash2(i, 13 + f) * (W + 80) - 40;
    drawDecor(kind, x, sy, i, layer === 'far' ? 0.75 : 0.85);
  }
}

function drawDecor(kind, x, y, seed, alpha) {
  const t = game.time, s = 0.8 + hash2(seed, 21) * 0.5;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  switch (kind) {
    case 'sunsetCloud': {
      ctx.fillStyle = 'rgba(255,190,200,0.55)';
      puff(0, 0, 70 * s, 16 * s);
      ctx.fillStyle = 'rgba(255,230,220,0.5)';
      puff(-8, -5, 46 * s, 10 * s);
      break;
    }
    case 'cloud': case 'cloudBig': case 'cloudThin': {
      const k = kind === 'cloudBig' ? 1.7 : kind === 'cloudThin' ? 1.2 : 1;
      ctx.globalAlpha = alpha * (kind === 'cloudThin' ? 0.35 : 0.6);
      ctx.fillStyle = '#d9cff2'; puff(0, 6, 60 * s * k, 16 * s * k);
      ctx.fillStyle = '#ffffff'; puff(0, 0, 54 * s * k, 15 * s * k);
      break;
    }
    case 'moonDay': {
      ctx.fillStyle = 'rgba(255,246,232,0.5)'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(200,180,220,0.4)'; ctx.beginPath(); ctx.arc(5, -4, 4, 0, TAU); ctx.arc(-6, 5, 3, 0, TAU); ctx.fill();
      break;
    }
    case 'moon': {
      ctx.fillStyle = '#f2ecdc'; ctx.beginPath(); ctx.arc(0, 0, 30 * s, 0, TAU); ctx.fill();
      ctx.fillStyle = '#d6cdb8';
      [[8, -8, 6], [-10, 6, 8], [10, 12, 4], [-4, -14, 3]].forEach(([a, b, r]) => { ctx.beginPath(); ctx.arc(a * s, b * s, r * s, 0, TAU); ctx.fill(); });
      break;
    }
    case 'kite': {
      const sw = Math.sin(t * 1.5 + seed) * 0.15;
      ctx.rotate(sw);
      const c = ['#ff8fc8', '#ffe066', '#7ad3ff', '#9be564'][seed & 3];
      ctx.fillStyle = c; ctx.strokeStyle = OUT; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(12, 0); ctx.lineTo(0, 22); ctx.lineTo(-12, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(0, 22); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.stroke();
      ctx.strokeStyle = 'rgba(43,23,64,0.6)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, 22);
      for (let k = 1; k < 6; k++) ctx.lineTo(Math.sin(t * 4 + k) * 5, 22 + k * 9);
      ctx.stroke();
      for (let k = 1; k < 5; k++) { ctx.fillStyle = k % 2 ? '#ff6b6b' : '#fff'; ctx.beginPath(); ctx.arc(Math.sin(t * 4 + k) * 5, 22 + k * 9, 2.2, 0, TAU); ctx.fill(); }
      break;
    }
    case 'birds': {
      ctx.strokeStyle = 'rgba(43,23,64,0.6)'; ctx.lineWidth = 1.6;
      for (let k = 0; k < 3; k++) {
        const bx = k * 18 + Math.sin(t + k) * 3 + (((t * 20 + seed * 30) % (W + 100)) + W + 100) % (W + 100) - W / 2, by = k * 7 - (k === 1 ? 10 : 0), fl = Math.sin(t * 8 + k) * 3;
        ctx.beginPath(); ctx.moveTo(bx - 6, by - fl); ctx.quadraticCurveTo(bx - 2, by - 3, bx, by); ctx.quadraticCurveTo(bx + 2, by - 3, bx + 6, by - fl); ctx.stroke();
      }
      break;
    }
    case 'partyBalloon': {
      const c = ['#ff6b9c', '#ffe066', '#7ad3ff'][((seed % 3) + 3) % 3];
      ctx.translate(0, Math.sin(t * 2 + seed) * 4);
      ctx.strokeStyle = 'rgba(43,23,64,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, 12); ctx.quadraticCurveTo(4, 24, -2, 36); ctx.stroke();
      ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(0, 0, 9, 12, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(-3, -4, 2.5, 4, -0.4, 0, TAU); ctx.fill();
      break;
    }
    case 'planeFar': {
      const dir = seed % 2 ? 1 : -1, px = ((t * 25 * dir + seed * 50) % (W + 200) + W + 200) % (W + 200) - 100 - x;
      ctx.translate(px, 0); ctx.scale(dir * 0.7, 0.7);
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      roundRect(ctx, -22, -4, 44, 8, 4); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(-12, 12); ctx.lineTo(-6, 12); ctx.lineTo(6, 0); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-20, -2); ctx.lineTo(-26, -12); ctx.lineTo(-18, -12); ctx.lineTo(-14, -2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(-120, 0); ctx.stroke();
      break;
    }
    case 'satFar': {
      ctx.rotate(t * 0.2 + seed);
      ctx.fillStyle = 'rgba(232,184,74,0.7)'; ctx.fillRect(-4, -4, 8, 8);
      ctx.fillStyle = 'rgba(90,140,220,0.7)'; ctx.fillRect(-18, -2.5, 12, 5); ctx.fillRect(6, -2.5, 12, 5);
      if (Math.sin(t * 4 + seed) > 0.7) { ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc(0, -6, 1.6, 0, TAU); ctx.fill(); }
      break;
    }
    case 'planet': {
      const c = ['#ff9a7a', '#7ad3ff', '#c49bff', '#9be564'][seed & 3], r = 26 * s;
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.arc(r * 0.45, r * 0.4, r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(-r, -r * 0.3, r * 2, r * 0.2); ctx.fillRect(-r, r * 0.15, r * 2, r * 0.12);
      ctx.restore();
      break;
    }
    case 'ringPlanet': {
      const r = 22 * s;
      ctx.rotate(-0.3);
      ctx.strokeStyle = 'rgba(255,224,160,0.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(0, 0, r * 1.9, r * 0.5, 0, Math.PI, TAU); ctx.stroke();
      ctx.fillStyle = '#e8b86a'; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(160,90,40,0.35)'; ctx.fillRect(-r, -4, r * 2, 5);
      ctx.beginPath(); ctx.ellipse(0, 0, r * 1.9, r * 0.5, 0, 0, Math.PI); ctx.stroke();
      break;
    }
    case 'nebula': {
      const c = ['255,143,200', '196,155,255', '122,211,255'][((seed % 3) + 3) % 3];
      for (let k = 0; k < 4; k++) {
        const g = ctx.createRadialGradient(k * 22 - 30, Math.sin(k * 2) * 15, 0, k * 22 - 30, Math.sin(k * 2) * 15, 60 * s);
        g.addColorStop(0, `rgba(${c},0.35)`); g.addColorStop(1, `rgba(${c},0)`);
        ctx.fillStyle = g; ctx.fillRect(k * 22 - 100, -80, 140, 160);
      }
      break;
    }
    case 'galaxy': case 'swirl': {
      ctx.rotate(t * (kind === 'swirl' ? 0.5 : 0.08) + seed);
      ctx.strokeStyle = kind === 'swirl' ? 'rgba(196,155,255,0.45)' : 'rgba(255,230,250,0.4)'; ctx.lineWidth = 3;
      for (let arm = 0; arm < 2; arm++) {
        ctx.beginPath();
        for (let k = 0; k < 30; k++) { const a = arm * Math.PI + k * 0.2, r = k * 1.6 * s; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r * 0.6); }
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,240,220,0.7)'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.fill();
      break;
    }
    case 'rock': {
      ctx.rotate(t * 0.3 + seed);
      ctx.fillStyle = 'rgba(138,127,143,0.6)';
      ctx.beginPath(); for (let k = 0; k < 7; k++) { const a = k / 7 * TAU, r = (7 + hash2(seed, k) * 4) * s; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill();
      break;
    }
    // --- Yarn World ---
    case 'yarnPlanet': {
      const r = 30 * s, col = ['#e85a8a', '#8a6ad0', '#5fc0b0'][seed % 3];
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); for (let k = -4; k <= 4; k++) { ctx.moveTo(-r, k * 8 * s - r * 0.5); ctx.quadraticCurveTo(0, k * 8 * s + r * 0.4, r, k * 8 * s - r * 0.6); } ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = col; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(r * 0.7, r * 0.7); ctx.quadraticCurveTo(r * 1.4, r * 0.9, r * 1.2 + Math.sin(t + seed) * 6, r * 1.6); ctx.stroke();
      break;
    }
    case 'buttonMoon': case 'button': {
      const r = (kind === 'button' ? 10 : 22) * s;
      if (kind === 'button') ctx.rotate(t * 0.5 + seed);
      ctx.fillStyle = ['#ffd65a', '#7ad3ff', '#ff8fc8'][seed % 3]; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(43,23,64,0.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, r * 0.75, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(43,23,64,0.45)';
      for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { ctx.beginPath(); ctx.arc(a * r * 0.25, b * r * 0.25, r * 0.12, 0, TAU); ctx.fill(); }
      break;
    }
    case 'needles': {
      ctx.rotate(Math.sin(t * 0.6 + seed) * 0.3);
      for (const [rot, col] of [[0.5, 'rgba(192,200,216,0.8)'], [-0.5, 'rgba(138,106,208,0.8)']]) {
        ctx.save(); ctx.rotate(rot);
        ctx.fillStyle = col; roundRect(ctx, -30 * s, -2, 60 * s, 4, 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,214,90,0.85)'; ctx.beginPath(); ctx.arc(-30 * s, 0, 4, 0, TAU); ctx.fill();
        ctx.restore();
      }
      break;
    }
    case 'thread': {
      ctx.strokeStyle = 'rgba(232,90,138,0.55)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-70, 0);
      for (let k = -70; k <= 70; k += 10) ctx.lineTo(k, Math.sin(k * 0.06 + t + seed) * 10);
      ctx.stroke();
      break;
    }
    // --- Dog World ---
    case 'ballPlanet': {
      const r = 30 * s;
      ctx.fillStyle = '#d8f04a'; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(-r * 1.1, 0, r * 0.75, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(r * 1.1, 0, r * 0.75, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.4, r * 0.25, 0, TAU); ctx.fill();
      break;
    }
    case 'boneMoon': case 'bone': {
      const k = kind === 'bone' ? 0.6 * s : 1.3 * s;
      if (kind === 'bone') ctx.rotate(t * 0.7 + seed);
      ctx.scale(k, k);
      ctx.fillStyle = 'rgba(255,246,232,0.85)';
      roundRect(ctx, -16, -4, 32, 8, 4); ctx.fill();
      for (const bx of [-16, 16]) for (const by of [-4, 4]) { ctx.beginPath(); ctx.arc(bx, by, 5.5, 0, TAU); ctx.fill(); }
      break;
    }
    case 'paws': {
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      for (let k = 0; k < 4; k++) {
        const px = -45 + k * 30, py = (k % 2) * 12;
        ctx.beginPath(); ctx.ellipse(px, py, 5, 4, 0, 0, TAU); ctx.fill();
        for (const [a, b] of [[-5, -6], [-1.5, -8], [2, -8], [5.5, -6]]) { ctx.beginPath(); ctx.arc(px + a, py + b, 1.8, 0, TAU); ctx.fill(); }
      }
      break;
    }
  }
  ctx.restore();
}

// A soft cloud made of overlapping circles, width w and height h around (x, y).
function puff(x, y, w, h) {
  ctx.beginPath();
  const n = 5;
  for (let k = 0; k < n; k++) {
    const fx = (k / (n - 1)) * 2 - 1;
    const r = h * (1.1 - Math.abs(fx) * 0.45);
    ctx.moveTo(x + fx * w * 0.6 + r, y - r * 0.3);
    ctx.arc(x + fx * w * 0.6, y - r * 0.3, r, 0, TAU);
  }
  ctx.fill();
}

// The start of it all: the back garden of a terraced house at sunset.
function drawGroundScene(cam) {
  const gy = 0 - cam;                              // lawn top on screen
  if (gy < -100 || gy > H + 600) return;
  const at = (f, base) => gy * f + base * (1 - f);
  // low sun
  const sunY = at(0.2, H - 170);
  if (sunY < H + 60) {
    ctx.fillStyle = 'rgba(255,214,140,0.35)'; ctx.beginPath(); ctx.arc(W * 0.72, sunY, 70, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd38a'; ctx.beginPath(); ctx.arc(W * 0.72, sunY, 40, 0, TAU); ctx.fill();
  }
  // the city behind: tower blocks with a few lights on
  const hy = at(0.35, H - 130);
  for (let i = 0; i < Math.ceil(W / 46) + 1; i++) {
    const bw = 34 + hash2(i, 31) * 22, bh = 190 + hash2(i, 32) * 150, bx = i * 46 - 20 + hash2(i, 33) * 10;
    ctx.fillStyle = i % 2 ? '#5e4690' : '#6a52a0';
    ctx.fillRect(bx, hy - bh + 40, bw, bh + 200);
    ctx.fillStyle = 'rgba(255,224,138,0.75)';
    for (let r = 0; r < bh / 14 - 1; r++) for (let c = 0; c < bw / 10 - 1; c++) {
      if (hash2(i * 31 + r, c) > 0.72) ctx.fillRect(bx + 5 + c * 10, hy - bh + 48 + r * 14, 4, 6);
    }
    if (hash2(i, 34) > 0.75) { ctx.fillStyle = '#5e4690'; ctx.fillRect(bx + bw / 2 - 1, hy - bh + 22, 2, 18);   // aerial with a blinking light
      if (Math.sin(game.time * 3 + i) > 0.6) { ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc(bx + bw / 2, hy - bh + 21, 2, 0, TAU); ctx.fill(); } }
  }
  // a terrace of house backs, chimney pots and all
  const ty = at(0.6, H - 92);
  for (let i = 0; i < Math.ceil(W / 110) + 1; i++) {
    const hx = i * 110 - 20, hh = 120 + (i % 2) * 8, top = ty - hh;
    ctx.fillStyle = i % 2 ? '#9a4a4a' : '#a85656'; ctx.fillRect(hx, top, 110, hh + 4);
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for (let r = 0; r < hh; r += 8) ctx.fillRect(hx, top + r, 110, 1);
    ctx.fillStyle = '#4a3a5e';                       // roof
    ctx.beginPath(); ctx.moveTo(hx - 4, top + 2); ctx.lineTo(hx + 14, top - 26); ctx.lineTo(hx + 96, top - 26); ctx.lineTo(hx + 114, top + 2); ctx.fill();
    ctx.fillStyle = '#8a4040'; ctx.fillRect(hx + 72, top - 44, 18, 22);  // chimney
    ctx.fillStyle = '#c87a50'; ctx.fillRect(hx + 74, top - 50, 6, 8); ctx.fillRect(hx + 82, top - 50, 6, 8);
    // windows, some lit
    for (const [wx, wy] of [[18, 22], [64, 22], [18, 70]]) {
      const lit = hash2(i, wx + wy) > 0.4;
      ctx.fillStyle = '#e8dcc8'; ctx.fillRect(hx + wx - 3, top + wy - 3, 30, 34);
      ctx.fillStyle = lit ? '#ffe08a' : '#4a3f6e'; ctx.fillRect(hx + wx, top + wy, 24, 28);
      ctx.fillStyle = '#e8dcc8'; ctx.fillRect(hx + wx + 11, top + wy, 2, 28); ctx.fillRect(hx + wx, top + wy + 13, 24, 2);
    }
    ctx.fillStyle = '#5a7ab0'; ctx.fillRect(hx + 64, top + 66, 26, hh - 62);   // back door
    ctx.fillStyle = '#ffd65a'; ctx.beginPath(); ctx.arc(hx + 84, top + 66 + (hh - 62) / 2, 1.8, 0, TAU); ctx.fill();
  }
  // washing line
  const wy = at(0.8, H - 92) - 70;
  ctx.strokeStyle = 'rgba(43,23,64,0.7)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-10, wy); ctx.quadraticCurveTo(W / 2, wy + 18, W + 10, wy); ctx.stroke();
  const items = ['#7ad3ff', '#ff8fc8', '#fff', '#ffe066', '#3fb6a8'];
  for (let k = 0; k < 5; k++) {
    const lx = W * (0.15 + k * 0.17), ly = wy + 18 * (1 - Math.pow((lx - W / 2) / (W / 2), 2)) - 1, sw = Math.sin(game.time * 2 + k) * 0.08;
    ctx.save(); ctx.translate(lx, ly); ctx.rotate(sw);
    ctx.fillStyle = items[k];
    if (k % 2) { ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(9, 0); ctx.lineTo(8, 10); ctx.lineTo(2, 10); ctx.lineTo(0, 5); ctx.lineTo(-2, 10); ctx.lineTo(-8, 10); ctx.closePath(); ctx.fill(); }
    else { roundRect(ctx, -6, 0, 12, 22, 3); ctx.fill(); ctx.fillRect(-11, 0, 22, 6); }
    ctx.fillStyle = '#c8a070'; ctx.fillRect(-1, -3, 2, 5);
    ctx.restore();
  }
  // fence panels
  const fy = at(0.85, H - 92);
  ctx.fillStyle = '#8a6040'; ctx.fillRect(-10, fy - 46, W + 20, 50);
  ctx.strokeStyle = '#6a4630'; ctx.lineWidth = 1;
  ctx.beginPath(); for (let x = -10; x < W + 20; x += 9) { ctx.moveTo(x, fy - 46); ctx.lineTo(x, fy + 4); } ctx.stroke();
  ctx.fillStyle = '#5e3e28'; for (let x = 20; x < W + 20; x += 120) ctx.fillRect(x, fy - 52, 8, 56);
  // wheelie bins (one with a fishbone poking out, naturally)
  for (const [bx, col, lid] of [[W * 0.06, '#3e7a4a', '#2f6a3c'], [W * 0.06 + 40, '#3a3a46', '#2b2b33']]) {
    ctx.fillStyle = col; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx, fy - 46); ctx.lineTo(bx + 34, fy - 46); ctx.lineTo(bx + 31, fy); ctx.lineTo(bx + 3, fy); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = lid; roundRect(ctx, bx - 2, fy - 52, 38, 7, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2b2b33'; ctx.beginPath(); ctx.arc(bx + 6, fy - 1, 4, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#fff6e8'; ctx.lineWidth = 1.6;
  const fbx = W * 0.06 + 18, fby = fy - 56;
  ctx.beginPath(); ctx.moveTo(fbx - 8, fby); ctx.lineTo(fbx + 8, fby);
  for (let k = -5; k <= 3; k += 4) { ctx.moveTo(fbx + k, fby - 3); ctx.lineTo(fbx + k, fby + 3); }
  ctx.moveTo(fbx + 8, fby); ctx.lineTo(fbx + 12, fby - 3); ctx.moveTo(fbx + 8, fby); ctx.lineTo(fbx + 12, fby + 3); ctx.stroke();
}

/* ---------------------------------------------------------------------
   11. RENDER: PLATFORMS — four roles, re-skinned per zone
       standard: solid & flat     bouncy: pink-tinged dome that squashes
       moving: cyan arrows        breakable: cracked & crumbly
   --------------------------------------------------------------------- */
function drawPlatforms(cam) {
  for (const pl of game.platforms) {
    const sy = pl.y - cam;
    if (sy < -80 || sy > H + 80) continue;
    if (pl.broken) {
      const t = pl.breakT;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - t / 1.1);
      for (const half of [-1, 1]) {
        ctx.save();
        const cx = pl.x + pl.w / 2;
        ctx.translate(cx + half * t * 40, sy);
        ctx.rotate(half * t * 1.6);
        ctx.beginPath(); ctx.rect(half < 0 ? -pl.w / 2 - 30 : 0, -40, pl.w / 2 + 30, 80); ctx.clip();
        ctx.translate(-cx, 0);
        drawPlatform(pl, pl.x, 0);
        ctx.restore();
      }
      ctx.restore();
    } else drawPlatform(pl, pl.x, sy);
  }
}

function drawPlatform(pl, x, y) {
  const w = pl.w;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (pl.look === 'lawn') { drawLawn(x, y, w); return; }
  const fn = PLATFORM_SKINS[pl.look] || PLATFORM_SKINS.garden;
  ctx.save();
  if (pl.role === 'bouncy') {                       // squash down from the top
    const s = clamp(pl.squash, -0.5, 1);
    ctx.translate(x + w / 2, y + 14);
    ctx.scale(1 + s * 0.18, 1 - s * 0.35);
    ctx.translate(-(x + w / 2), -(y + 14));
  }
  fn[pl.role](pl, x, y, w);
  ctx.restore();
  if (pl.role === 'moving') drawChevrons(x, y, w, pl);
  if (pl.role === 'breakable' && !pl.broken && Math.sin(game.time * 3 + pl.seed) > 0.96) {
    addParticle({ type: 'crumb', x: x + rand(4, w - 4), y: pl.y + 8, vx: 0, vy: 20, g: 300, r0: 1.5, rot: 0, vr: 3, life: 0, max: 0.6, color: crumbColors(pl)[0] });
  }
}

// Little cyan arrows either side: "this one moves".
function drawChevrons(x, y, w, pl) {
  const pulse = 0.6 + 0.4 * Math.sin(game.time * 6 + pl.seed);
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#7ad3ff'; ctx.strokeStyle = OUT; ctx.lineWidth = 1.5;
  for (const side of [-1, 1]) {
    const ax = side < 0 ? x - 7 : x + w + 7, ay = y + 6;
    ctx.beginPath(); ctx.moveTo(ax + side * 6, ay); ctx.lineTo(ax - side * 2, ay - 6); ctx.lineTo(ax - side * 2, ay + 6); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

// The back yard: concrete paving, a few weeds, and his food bowl.
function drawLawn(x, y, w) {
  ctx.fillStyle = '#8a8296'; ctx.fillRect(x, y + 8, w, H + 200);
  ctx.fillStyle = '#b4acbc'; ctx.fillRect(x, y, w, 12);
  ctx.strokeStyle = 'rgba(43,23,64,0.3)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.moveTo(x, y + 12); ctx.lineTo(x + w, y + 12);
  for (let gx = x + 20; gx < x + w; gx += 52) { ctx.moveTo(gx, y); ctx.lineTo(gx, y + 12); }
  for (let gx = x + 46; gx < x + w; gx += 52) { ctx.moveTo(gx, y + 12); ctx.lineTo(gx, y + 60); }
  ctx.moveTo(x, y + 36); ctx.lineTo(x + w, y + 36);
  ctx.stroke();
  ctx.fillStyle = '#7ccf62';                              // weeds in the cracks
  for (let gx = x + 20; gx < x + w; gx += 104) { ctx.beginPath(); ctx.moveTo(gx - 3, y); ctx.lineTo(gx - 1, y - 6); ctx.lineTo(gx + 1, y); ctx.lineTo(gx + 3, y - 5); ctx.lineTo(gx + 4, y); ctx.fill(); }
  // his food bowl
  const bx = x + w * 0.8, by = y;
  ctx.fillStyle = '#ff8fc8'; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(bx - 11, by - 7); ctx.lineTo(bx + 11, by - 7); ctx.lineTo(bx + 8, by); ctx.lineTo(bx - 8, by); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c87a40'; ctx.beginPath(); ctx.ellipse(bx, by - 7, 9, 2.2, 0, Math.PI, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = `bold 5px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('ROLO', bx, by - 3.2);
}

function slab(x, y, w, h, fill, top, r = 5) {
  ctx.fillStyle = fill; roundRect(ctx, x, y, w, h, r); ctx.fill();
  if (top) { ctx.fillStyle = top; roundRect(ctx, x + 2, y + 1.5, w - 4, h * 0.38, r - 1); ctx.fill(); }
  ctx.strokeStyle = OUT; ctx.lineWidth = 2; roundRect(ctx, x, y, w, h, r); ctx.stroke();
}
function cracks(x, y, w, h, color = 'rgba(43,23,64,0.7)') {
  ctx.strokeStyle = color; ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(x + w * 0.3, y + 1); ctx.lineTo(x + w * 0.36, y + h * 0.5); ctx.lineTo(x + w * 0.3, y + h - 1);
  ctx.moveTo(x + w * 0.36, y + h * 0.5); ctx.lineTo(x + w * 0.46, y + h * 0.6);
  ctx.moveTo(x + w * 0.7, y + 1); ctx.lineTo(x + w * 0.64, y + h * 0.55); ctx.lineTo(x + w * 0.72, y + h - 1);
  ctx.stroke();
}
// A dome for bouncy platforms; the top is at y.
function dome(x, y, w, h, fill, rim) {
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(x, y + h);
  ctx.quadraticCurveTo(x, y - 2, x + w / 2, y - 2);
  ctx.quadraticCurveTo(x + w, y - 2, x + w, y + h);
  ctx.closePath(); ctx.fill();
  if (rim) { ctx.fillStyle = rim; roundRect(ctx, x - 2, y + h - 5, w + 4, 7, 3.5); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y + h); ctx.quadraticCurveTo(x, y - 2, x + w / 2, y - 2); ctx.quadraticCurveTo(x + w, y - 2, x + w, y + h); ctx.stroke();
}

const PLATFORM_SKINS = {
  garden: {
    standard(pl, x, y, w) {                       // concrete paving slab
      slab(x, y, w, 14, '#bdb6ac', '#dcd6cc', 3);
      ctx.fillStyle = 'rgba(43,23,64,0.18)';
      for (let k = 0; k < 6; k++) ctx.fillRect(x + 6 + hash2(pl.seed, k) * (w - 12), y + 5 + hash2(pl.seed, k + 9) * 6, 2, 2);
      ctx.strokeStyle = 'rgba(43,23,64,0.25)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x + w / 2, y + 2); ctx.lineTo(x + w / 2, y + 12); ctx.stroke();
    },
    bouncy(pl, x, y, w) {                         // a springy grass tuft with clover
      dome(x, y, w, 14, '#6cc46a', '#ff8fc8');
      ctx.strokeStyle = '#3e8a3c'; ctx.lineWidth = 2;
      for (let k = 0; k < 7; k++) {
        const bx = x + 6 + k * (w - 12) / 6, sw = Math.sin(game.time * 4 + k + pl.seed) * 2;
        ctx.beginPath(); ctx.moveTo(bx, y + 4); ctx.lineTo(bx + sw, y - 6 - (k % 2) * 3); ctx.stroke();
      }
      ctx.fillStyle = '#ff8fc8';
      [0.25, 0.7].forEach(fx => { ctx.beginPath(); ctx.arc(x + w * fx, y - 1, 3, 0, TAU); ctx.fill(); });
      ctx.fillStyle = '#fff'; [0.25, 0.7].forEach(fx => { ctx.beginPath(); ctx.arc(x + w * fx, y - 1, 1.2, 0, TAU); ctx.fill(); });
    },
    moving(pl, x, y, w) {                         // a tree branch, swaying along
      ctx.fillStyle = '#8a5a34'; roundRect(ctx, x, y, w, 11, 5.5); ctx.fill();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = '#6a4226'; ctx.lineWidth = 1;
      ctx.beginPath(); for (let k = 8; k < w - 6; k += 11) { ctx.moveTo(x + k, y + 3); ctx.lineTo(x + k + 5, y + 8); } ctx.stroke();
      for (const fx of [0.1, 0.9]) {
        ctx.fillStyle = '#5aa04a'; ctx.beginPath(); ctx.arc(x + w * fx, y + 12, 8, 0, TAU); ctx.arc(x + w * fx + 7, y + 8, 6, 0, TAU); ctx.fill();
        ctx.fillStyle = '#7ccf62'; ctx.beginPath(); ctx.arc(x + w * fx - 2, y + 9, 4, 0, TAU); ctx.fill();
      }
    },
    breakable(pl, x, y, w) {                      // a rotten branch
      ctx.fillStyle = '#5a4434'; roundRect(ctx, x, y, w, 10, 3); ctx.fill();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.setLineDash([6, 3]); roundRect(ctx, x, y, w, 10, 3); ctx.stroke(); ctx.setLineDash([]);
      cracks(x, y, w, 10, '#2b1a14');
      ctx.fillStyle = '#e0455b'; ctx.beginPath(); ctx.arc(x + w * 0.8, y + 1, 4, Math.PI, TAU); ctx.fill();   // a toadstool
      ctx.fillStyle = '#fff'; ctx.fillRect(x + w * 0.8 - 1, y + 1, 2, 3);
      ctx.beginPath(); ctx.arc(x + w * 0.8 - 1.5, y - 1.5, 0.8, 0, TAU); ctx.fill();
    },
  },
  sky: {
    standard(pl, x, y, w) {                       // a fat, dependable cloud
      ctx.fillStyle = '#d9cff2'; roundRect(ctx, x, y + 2, w, 15, 8); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x + w * 0.3, y + 4, 9, 0, TAU); ctx.arc(x + w * 0.6, y + 2, 11, 0, TAU); ctx.arc(x + w * 0.82, y + 6, 7, 0, TAU); ctx.fill();
      roundRect(ctx, x, y + 2, w, 11, 6); ctx.fill();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; roundRect(ctx, x, y + 2, w, 15, 8); ctx.stroke();
    },
    bouncy(pl, x, y, w) {                         // springy pink cumulus
      dome(x, y - 4, w, 18, '#ffd1e8', '#ff8fc8');
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + w * 0.35, y + 2, 6, 0, TAU); ctx.arc(x + w * 0.6, y + 1, 5, 0, TAU); ctx.fill();
    },
    moving(pl, x, y, w) {                         // a passing plane: land on the wings
      const dir = pl.vx >= 0 ? 1 : -1, cx = x + w / 2;
      ctx.save(); ctx.translate(cx, y); ctx.scale(dir, 1);
      ctx.fillStyle = '#e8eef8'; roundRect(ctx, -w / 2 + 6, -2, w - 12, 8, 4); ctx.fill();          // wings
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#ffffff'; roundRect(ctx, -w * 0.45, 2, w * 0.95, 15, 7.5); ctx.fill(); ctx.stroke();   // fuselage
      ctx.fillStyle = '#3f6fc4'; ctx.fillRect(-w * 0.45 + 4, 10, w * 0.9, 3);
      ctx.fillStyle = '#7ad3ff'; for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(-w * 0.3 + k * 9, 7, 2, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#3f6fc4';                                                          // tail fin
      ctx.beginPath(); ctx.moveTo(-w * 0.42, 4); ctx.lineTo(-w * 0.5, -10); ctx.lineTo(-w * 0.38, -10); ctx.lineTo(-w * 0.3, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2b1740'; ctx.beginPath(); ctx.arc(w * 0.44, 7, 3, -1, 1); ctx.fill();   // cockpit
      ctx.restore();
    },
    breakable(pl, x, y, w) {                      // a wispy cloud: don't trust it twice
      ctx.save(); ctx.globalAlpha = 0.85;
      ctx.fillStyle = '#c9c4dc';
      roundRect(ctx, x, y, w, 9, 4.5); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + 6, y + 3); ctx.lineTo(x + w * 0.5, y + 3); ctx.moveTo(x + w * 0.3, y + 6); ctx.lineTo(x + w - 6, y + 6); ctx.stroke();
      ctx.strokeStyle = OUT; ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]); roundRect(ctx, x, y, w, 9, 4.5); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
    },
  },
  edge: {
    standard(pl, x, y, w) {                       // a gold-foil satellite
      ctx.fillStyle = '#a0a8b8'; ctx.fillRect(x, y + 3, w, 4);
      ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.strokeRect(x, y + 3, w, 4);
      slab(x + w * 0.28, y, w * 0.44, 16, '#e8b84a', '#ffd97a', 3);
      ctx.strokeStyle = 'rgba(160,110,20,0.6)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x + w * 0.35, y + 6); ctx.lineTo(x + w * 0.65, y + 12); ctx.moveTo(x + w * 0.4, y + 13); ctx.lineTo(x + w * 0.6, y + 5); ctx.stroke();
      for (const fx of [0, 1]) { ctx.fillStyle = '#ffffff'; roundRect(ctx, x + fx * (w - 16), y, 16, 10, 2); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.stroke(); }
      ctx.strokeStyle = '#a0a8b8'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + w / 2, y + 16); ctx.lineTo(x + w / 2, y + 24); ctx.stroke();
      ctx.fillStyle = '#e0e4ec'; ctx.beginPath(); ctx.arc(x + w / 2, y + 24, 5, 0, Math.PI); ctx.fill();
    },
    bouncy(pl, x, y, w) {                         // inflatable lander airbags
      ctx.fillStyle = '#ff8fc8'; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
      const n = Math.max(3, Math.round(w / 20)), r = w / n / 2 + 1;
      for (let k = 0; k < n; k++) { ctx.beginPath(); ctx.arc(x + r + k * (w - 2 * r) / (n - 1), y + r - 1, r, 0, TAU); ctx.fill(); ctx.stroke(); }
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      for (let k = 0; k < n; k++) { ctx.beginPath(); ctx.arc(x + r * 0.7 + k * (w - 2 * r) / (n - 1), y + r * 0.6, r * 0.3, 0, TAU); ctx.fill(); }
    },
    moving(pl, x, y, w) {                         // a silver satellite on the move
      slab(x, y, w, 12, '#d8dee8', '#ffffff', 4);
      ctx.fillStyle = '#e0455b'; ctx.fillRect(x + 4, y + 7, w - 8, 2.5);
      ctx.strokeStyle = '#a0a8b8'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + w * 0.5, y); ctx.lineTo(x + w * 0.5, y - 9); ctx.stroke();
      if (Math.sin(game.time * 6 + pl.seed) > 0) { ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc(x + w * 0.5, y - 10, 2.5, 0, TAU); ctx.fill(); }
    },
    breakable(pl, x, y, w) {                      // a broken solar panel
      ctx.fillStyle = '#3f6fc4';
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + 8); ctx.lineTo(x + w * 0.8, y + 12); ctx.lineTo(x + w * 0.6, y + 9); ctx.lineTo(x, y + 12); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#9fd0ff'; ctx.lineWidth = 1;
      ctx.beginPath(); for (let k = 10; k < w; k += 10) { ctx.moveTo(x + k, y + 1); ctx.lineTo(x + k, y + 10); } ctx.moveTo(x, y + 5); ctx.lineTo(x + w, y + 5); ctx.stroke();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.setLineDash([6, 3]);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + 8); ctx.lineTo(x + w * 0.8, y + 12); ctx.lineTo(x + w * 0.6, y + 9); ctx.lineTo(x, y + 12); ctx.closePath(); ctx.stroke();
      ctx.setLineDash([]);
      cracks(x, y, w, 11, '#fff');
      if (Math.sin(game.time * 9 + pl.seed) > 0.9) emitSparkles(pl.x + w * 0.6, pl.y + 8, 1, ['#ffe066', '#fff']);
    },
  },
  deep: {
    standard(pl, x, y, w) {                       // a lumpy asteroid
      ctx.fillStyle = '#8a7f8f'; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + 4, y);
      ctx.lineTo(x + w - 4, y);
      const n = 6;
      for (let k = 0; k <= n; k++) { const fx = 1 - k / n; ctx.lineTo(x + fx * w, y + 9 + Math.sin(fx * Math.PI) * 9 + hash2(pl.seed, k) * 4); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#a89cad'; roundRect(ctx, x + 4, y + 1.5, w - 8, 4, 2); ctx.fill();
      ctx.fillStyle = '#6a6070';
      for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(x + w * (0.25 + k * 0.25), y + 10 + (k % 2) * 3, 2.5 + (k % 2), 0, TAU); ctx.fill(); }
    },
    bouncy(pl, x, y, w) {                         // a glowing alien jelly pod
      const glow = 0.5 + 0.5 * Math.sin(game.time * 3 + pl.seed);
      ctx.fillStyle = `rgba(155,229,100,${0.25 + glow * 0.2})`;
      ctx.beginPath(); ctx.ellipse(x + w / 2, y + 8, w * 0.65, 18, 0, 0, TAU); ctx.fill();
      dome(x, y, w, 16, '#9be564', '#ff8fc8');
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(x + w * 0.32, y + 4, 6, 3, -0.3, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ff8fc8'; [0.55, 0.72].forEach((fx, k) => { ctx.beginPath(); ctx.arc(x + w * fx, y + 7 + k * 2, 2.2, 0, TAU); ctx.fill(); });
    },
    moving(pl, x, y, w) {
      if (pl.variant === 1) { drawUFO(pl, x, y, w); return; }
      const dir = pl.vx >= 0 ? 1 : -1, cx = x + w / 2;     // a comet with a glowing tail
      const tail = ctx.createLinearGradient(cx, 0, cx - dir * (w + 70), 0);
      tail.addColorStop(0, 'rgba(255,190,110,0.9)'); tail.addColorStop(0.5, 'rgba(255,120,170,0.45)'); tail.addColorStop(1, 'rgba(255,120,170,0)');
      ctx.fillStyle = tail;
      ctx.beginPath(); ctx.moveTo(cx, y - 4); ctx.lineTo(cx - dir * (w + 70), y + 7); ctx.lineTo(cx, y + 18); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,214,140,0.35)'; ctx.beginPath(); ctx.ellipse(cx, y + 7, w * 0.62, 14, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#bfe6ff'; roundRect(ctx, x, y, w, 14, 7); ctx.fill();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#ffffff'; roundRect(ctx, x + 4, y + 2, w - 8, 4, 2); ctx.fill();
    },
    breakable(pl, x, y, w) {                      // a cracked ice shard
      ctx.fillStyle = '#cfeeff'; ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.setLineDash([6, 3]);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w * 0.85, y + 10); ctx.lineTo(x + w * 0.5, y + 14); ctx.lineTo(x + w * 0.15, y + 10); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.setLineDash([]);
      cracks(x, y, w, 11, '#5a8ab0');
    },
  },
  yarn: {
    standard(pl, x, y, w) {                       // a knitted scarf, stripy
      const cols = ['#e85a8a', '#ffd65a', '#8a6ad0', '#5fc0b0'], k0 = Math.floor(pl.seed) % 4;
      ctx.save(); roundRect(ctx, x, y, w, 15, 5); ctx.clip();
      for (let i = 0; i * 12 < w; i++) { ctx.fillStyle = cols[(k0 + i) % 4]; ctx.fillRect(x + i * 12, y, 12, 15); }
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;               // the stitches
      ctx.beginPath(); for (let sx = x + 3; sx < x + w; sx += 5) { ctx.moveTo(sx, y + 3); ctx.lineTo(sx + 2, y + 6); ctx.lineTo(sx + 4, y + 3); ctx.moveTo(sx, y + 8); ctx.lineTo(sx + 2, y + 11); ctx.lineTo(sx + 4, y + 8); } ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; roundRect(ctx, x, y, w, 15, 5); ctx.stroke();
      ctx.strokeStyle = cols[k0]; ctx.lineWidth = 2;                                // tassels
      ctx.beginPath(); for (const ex of [x - 1, x + w + 1]) for (let k = 0; k < 3; k++) { ctx.moveTo(ex, y + 3 + k * 4.5); ctx.lineTo(ex + (ex < x + 1 ? -5 : 5), y + 4 + k * 4.5 + Math.sin(game.time * 3 + k) * 1.5); } ctx.stroke();
    },
    bouncy(pl, x, y, w) {                         // a ball of wool
      dome(x, y, w, 18, '#e85a8a', '#ffd65a');
      ctx.save(); ctx.beginPath(); ctx.moveTo(x, y + 18); ctx.quadraticCurveTo(x, y - 2, x + w / 2, y - 2); ctx.quadraticCurveTo(x + w, y - 2, x + w, y + 18); ctx.clip();
      ctx.strokeStyle = 'rgba(120,20,60,0.45)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); for (let k = -3; k <= 3; k++) { ctx.moveTo(x + w / 2 + k * 9 - 12, y + 20); ctx.quadraticCurveTo(x + w / 2 + k * 9, y + 4, x + w / 2 + k * 9 + 14, y - 2); } ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = '#e85a8a'; ctx.lineWidth = 2;                                // a loose end
      ctx.beginPath(); ctx.moveTo(x + w - 4, y + 12); ctx.quadraticCurveTo(x + w + 6, y + 14, x + w + 4, y + 22); ctx.stroke();
    },
    moving(pl, x, y, w) {                         // a pair of knitting needles, sliding along
      for (const [dy, col] of [[2, '#c0c8d8'], [8, '#8a6ad0']]) {
        ctx.fillStyle = col; roundRect(ctx, x + 4, y + dy, w - 8, 5, 2.5); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 1.8; ctx.stroke();
        ctx.fillStyle = '#ffd65a'; ctx.beginPath(); ctx.arc(x + 4, y + dy + 2.5, 4, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x + w - 4, y + dy); ctx.lineTo(x + w + 3, y + dy + 2.5); ctx.lineTo(x + w - 4, y + dy + 5); ctx.fill(); ctx.stroke();
      }
    },
    breakable(pl, x, y, w) {                      // a scrap of loose crochet, coming undone
      ctx.fillStyle = '#ffd1e8'; roundRect(ctx, x, y, w, 10, 3); ctx.fill();
      ctx.strokeStyle = '#e85a8a'; ctx.lineWidth = 1.2;
      ctx.beginPath(); for (let sx = x + 4; sx < x + w - 2; sx += 7) { ctx.moveTo(sx + 3.5, y + 5); ctx.arc(sx, y + 5, 3, 0, TAU); } ctx.stroke();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.setLineDash([6, 3]); roundRect(ctx, x, y, w, 10, 3); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = '#e85a8a'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(x + w * 0.4, y + 10); ctx.quadraticCurveTo(x + w * 0.45, y + 18, x + w * 0.38, y + 22 + Math.sin(game.time * 3 + pl.seed) * 2); ctx.stroke();
    },
  },
  dog: {
    standard(pl, x, y, w) {                       // a kennel roof
      ctx.fillStyle = '#c0503a'; roundRect(ctx, x, y, w, 15, 3); ctx.fill();
      ctx.strokeStyle = 'rgba(80,20,10,0.45)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); for (let r = 0; r < 2; r++) for (let sx = x + (r ? 6 : 0); sx < x + w; sx += 12) { ctx.moveTo(sx, y + 5 + r * 5); ctx.lineTo(sx, y + 10 + r * 5); } ctx.moveTo(x, y + 5); ctx.lineTo(x + w, y + 5); ctx.moveTo(x, y + 10); ctx.lineTo(x + w, y + 10); ctx.stroke();
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; roundRect(ctx, x, y, w, 15, 3); ctx.stroke();
      ctx.fillStyle = '#fff6e8'; roundRect(ctx, x + w / 2 - 12, y + 3, 24, 9, 2); ctx.fill(); ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = '#c0503a'; ctx.font = `bold 6px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(['REX', 'FIDO', 'BUSTER', 'MAX'][Math.floor(pl.seed) % 4], x + w / 2, y + 7.8);
    },
    bouncy(pl, x, y, w) {                         // a giant tennis ball
      dome(x, y, w, 18, '#d8f04a', '#ff8fc8');
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(x + w * 0.2, y + 16); ctx.quadraticCurveTo(x + w * 0.35, y + 2, x + w * 0.5, y + 6); ctx.quadraticCurveTo(x + w * 0.65, y + 10, x + w * 0.8, y + 1); ctx.stroke();
    },
    moving(pl, x, y, w) {                         // a flying frisbee
      const cx = x + w / 2;
      ctx.fillStyle = '#4a8ad0'; ctx.beginPath(); ctx.ellipse(cx, y + 6, w / 2, 7, 0, 0, TAU); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = '#a8d0ff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(cx, y + 4.5, w / 2 - 7, 3.5, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(cx - w * 0.2, y + 3, 6, 1.5, 0, 0, TAU); ctx.fill();
    },
    breakable(pl, x, y, w) {                      // a big crumbly dog biscuit
      ctx.fillStyle = '#d9a868';
      ctx.beginPath(); roundRect(ctx, x + 6, y + 1, w - 12, 9, 3); ctx.fill();
      for (const ex of [x + 6, x + w - 6]) for (const ey of [y + 2, y + 9]) { ctx.beginPath(); ctx.arc(ex, ey, 5, 0, TAU); ctx.fill(); }
      ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.setLineDash([6, 3]);
      ctx.beginPath(); roundRect(ctx, x, y - 3, w, 17, 7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#8a5a2a'; [0.3, 0.5, 0.7].forEach(fx => { ctx.beginPath(); ctx.arc(x + w * fx, y + 5.5, 1.2, 0, TAU); ctx.fill(); });
      cracks(x + 6, y + 1, w - 12, 9, '#6a4020');
    },
  },
};

function drawUFO(pl, x, y, w) {
  const cx = x + w / 2;
  if (pl.beamOn || (player.beam && player.beam.plat === pl)) {      // the tractor beam
    const k = 0.6 + 0.4 * Math.sin(game.time * 20);
    const g = ctx.createLinearGradient(0, y + 10, 0, y + 280);
    g.addColorStop(0, `rgba(155,229,100,${0.55 * k})`); g.addColorStop(1, 'rgba(155,229,100,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(cx - 14, y + 10); ctx.lineTo(cx + 14, y + 10); ctx.lineTo(cx + 14 + 270 * 0.32, y + 280); ctx.lineTo(cx - 14 - 270 * 0.32, y + 280); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(196,155,255,0.85)'; ctx.beginPath(); ctx.ellipse(cx, y + 1, w * 0.22, 11, 0, Math.PI, TAU); ctx.fill();
  ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#9be564'; ctx.beginPath(); ctx.arc(cx, y - 3, 3.5, 0, TAU); ctx.fill();          // a little green pilot
  ctx.fillStyle = '#b8bec8'; ctx.beginPath(); ctx.ellipse(cx, y + 6, w / 2, 7, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e0e4ec'; ctx.beginPath(); ctx.ellipse(cx, y + 4, w / 2 - 4, 3, 0, 0, TAU); ctx.fill();
  for (let k = 0; k < 5; k++) {
    ctx.fillStyle = (Math.floor(game.time * 6) + k) % 3 ? '#ffe066' : '#ff6b6b';
    ctx.beginPath(); ctx.arc(cx - w * 0.36 + k * w * 0.18, y + 8, 2, 0, TAU); ctx.fill();
  }
}

/* ---------------------------------------------------------------------
   12. RENDER: FOOD, HAZARDS, SEAGULLS, BLACK HOLES
   --------------------------------------------------------------------- */
function drawFoods(cam) {
  for (const f of game.foods) {
    if (f.eaten) continue;
    const sy = f.y - cam + Math.sin(f.t * 2.5) * 4;
    if (sy < -40 || sy > H + 40) continue;
    const eff = FOODS[f.kind].effect;
    if (eff) {                                         // a glow shows it does something special
      const k = 0.5 + 0.5 * Math.sin(f.t * 4);
      ctx.fillStyle = EFFECT_COLORS[eff];
      ctx.globalAlpha = 0.18 + k * 0.14;
      ctx.beginPath(); ctx.arc(f.x, sy, 21 + k * 3, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    drawFood(f.kind, f.x, sy, Math.sin(f.t * 1.7) * 0.15, 1);
  }
}

function drawFood(kind, x, y, rot, s) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  switch (kind) {
    case 'fish': {
      // a plump silvery-blue fish
      ctx.rotate(-0.15);
      const g = ctx.createLinearGradient(0, -8, 0, 8);
      g.addColorStop(0, '#6f9cc4'); g.addColorStop(0.5, '#a9cbe4'); g.addColorStop(1, '#e8f2f8');
      // tail
      ctx.fillStyle = '#6f9cc4';
      ctx.beginPath(); ctx.moveTo(7, 0); ctx.quadraticCurveTo(14, -4, 18, -10); ctx.quadraticCurveTo(15, 0, 18, 10); ctx.quadraticCurveTo(14, 4, 7, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      // top fin
      ctx.beginPath(); ctx.moveTo(-4, -6); ctx.quadraticCurveTo(0, -12, 5, -6); ctx.closePath(); ctx.fill(); ctx.stroke();
      // body
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(-15, 0);
      ctx.quadraticCurveTo(-10, -9, 1, -8); ctx.quadraticCurveTo(9, -6, 11, 0);
      ctx.quadraticCurveTo(9, 6, 1, 8); ctx.quadraticCurveTo(-10, 9, -15, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      // gill, scales, eye
      ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(-11, 0, 6, -0.9, 0.9); ctx.stroke();
      ctx.strokeStyle = 'rgba(60,100,140,0.45)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-5, 0.5); ctx.quadraticCurveTo(2, 2, 9, 0); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-11, -2, 2.4, 0, TAU); ctx.fill();
      ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(-11.4, -2, 1.3, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; roundRect(ctx, -6, -6, 9, 1.8, 0.9); ctx.fill();
      break;
    }
    case 'catnip': {
      // a little paper bag of catnip, tied at the top, leaves poking out
      ctx.fillStyle = '#5aa04a';
      for (const [a, r] of [[-4, -0.5], [1, 0.1], [5, 0.6]]) { ctx.save(); ctx.translate(a, -13); ctx.rotate(r); ctx.beginPath(); ctx.ellipse(0, -2, 2.2, 4.2, 0, 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore(); }
      ctx.fillStyle = '#d9b98a';
      // gathered neck, then the bag widening out below it
      ctx.beginPath(); ctx.moveTo(-6, -13); ctx.lineTo(6, -13); ctx.lineTo(3.5, -8);
      ctx.quadraticCurveTo(11, -6, 10, 12); ctx.lineTo(-10, 12); ctx.quadraticCurveTo(-11, -6, -3.5, -8); ctx.closePath(); ctx.fill(); ctx.stroke();
      // the tie
      ctx.fillStyle = '#e0455b'; roundRect(ctx, -4.5, -9.6, 9, 2.6, 1.3); ctx.fill();
      ctx.lineWidth = 1.2; ctx.stroke();
      // label with a leaf on it
      ctx.fillStyle = '#fff6e8'; roundRect(ctx, -7.5, -2, 15, 11, 2); ctx.fill();
      ctx.fillStyle = '#5aa04a'; ctx.beginPath(); ctx.ellipse(0, 1.8, 2, 3.4, 0.6, 0, TAU); ctx.fill();
      ctx.fillStyle = '#3f7a32'; ctx.font = `bold 4.5px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('NIP', 0, 6.6);
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; roundRect(ctx, -9, -4, 1.8, 12, 0.9); ctx.fill();
      break;
    }
    case 'laser': {
      // a laser pen, with a red dot glowing at the tip
      ctx.rotate(-0.5);
      const g = ctx.createRadialGradient(15, 0, 0, 15, 0, 9);
      g.addColorStop(0, 'rgba(255,59,74,0.8)'); g.addColorStop(1, 'rgba(255,59,74,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(15, 0, 9, 0, TAU); ctx.fill();
      ctx.fillStyle = '#4a4a5a'; roundRect(ctx, -15, -4, 27, 8, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#c8ccd8'; roundRect(ctx, 8, -4.5, 6, 9, 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff3b4a'; ctx.beginPath(); ctx.arc(-1, -4, 2.2, Math.PI, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; roundRect(ctx, -12, -2.5, 18, 1.6, 0.8); ctx.fill();
      ctx.fillStyle = '#ff2a3a'; ctx.beginPath(); ctx.arc(15, 0, 2.2, 0, TAU); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

/* --- dogs, stray tomcats and their airborne friends --- */
function drawHazards(cam) {
  for (const hz of game.hazards) {
    const q = hazardPos(hz), sy = q.y - cam;
    if (sy < -100 || sy > H + 100) continue;
    const dir = hz.dir || 1;
    switch (hz.kind) {
      case 'dog': drawDog(q.x, sy, dir, hz.t, 'terrier'); break;
      case 'bulldog': drawDog(q.x, sy, dir, hz.t, 'bulldog'); break;
      case 'tomcat': drawTomcat(q.x, sy, dir, hz.t); break;
      case 'dogballoon': drawDogBalloon(q.x, sy, hz.t); break;
      case 'spacedog': drawSpaceDog(q.x, sy, dir, hz.t); break;
    }
  }
}

const DOGS = {
  terrier: { fur: '#d9b07a', patch: '#8a5a3a', snout: '#f3dcb4', collar: '#e0455b', w: 26, h: 12, legs: 7, head: 8 },
  bulldog: { fur: '#b9a596', patch: '#7a6a62', snout: '#e2d4c8', collar: '#3a3a46', w: 34, h: 15, legs: 6, head: 10 },
};
// A dog trotting along, feet at y. Faces +x before the dir flip.
function drawDog(x, y, dir, t, breed, scale = 1) {
  const D = DOGS[breed], bull = breed === 'bulldog';
  ctx.save(); ctx.translate(x, y); ctx.scale(dir * scale, scale);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const trot = Math.sin(t * (bull ? 7 : 13)), bob = Math.abs(trot) * 1.2;
  const bw = D.w, bh = D.h, top = -D.legs - bh - bob;
  const bark = Math.sin(t * 2.3) > 0.82;
  // tail, wagging
  const wag = Math.sin(t * 16) * 4;
  ctx.strokeStyle = OUT; ctx.lineWidth = 5.5;
  ctx.beginPath(); ctx.moveTo(-bw / 2 + 2, top + 3); ctx.quadraticCurveTo(-bw / 2 - 5, top - 2, -bw / 2 - 4 + wag, top - (bull ? 4 : 10)); ctx.stroke();
  ctx.strokeStyle = D.fur; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-bw / 2 + 2, top + 3); ctx.quadraticCurveTo(-bw / 2 - 5, top - 2, -bw / 2 - 4 + wag, top - (bull ? 4 : 10)); ctx.stroke();
  // legs: front and back pairs swing opposite ways
  const legX = [-bw / 2 + 5, -bw / 2 + 10, bw / 2 - 9, bw / 2 - 4];
  legX.forEach((lx, k) => {
    const sw = (k % 2 ? 1 : -1) * trot * 2.5;
    ctx.strokeStyle = OUT; ctx.lineWidth = bull ? 7 : 6;
    ctx.beginPath(); ctx.moveTo(lx, top + bh - 2); ctx.lineTo(lx + sw, -1); ctx.stroke();
    ctx.strokeStyle = k < 2 ? D.patch : D.fur; ctx.lineWidth = bull ? 4.5 : 3.5;
    ctx.beginPath(); ctx.moveTo(lx, top + bh - 2); ctx.lineTo(lx + sw, -1); ctx.stroke();
  });
  // body
  ctx.fillStyle = D.fur; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  roundRect(ctx, -bw / 2, top, bw, bh, bh / 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = D.patch; ctx.beginPath(); ctx.ellipse(-bw * 0.12, top + bh * 0.4, bw * 0.18, bh * 0.32, 0.2, 0, TAU); ctx.fill();
  // head
  const hr = D.head, hx = bw / 2 + (bull ? 1 : 2), hy = top - (bull ? 1 : 4);
  ctx.fillStyle = D.collar; roundRect(ctx, hx - hr * 0.9, hy + hr * 0.45, 5, hr * 0.9, 2); ctx.fill(); ctx.lineWidth = 1.2; ctx.stroke();
  ctx.lineWidth = 2;
  if (bull) { ctx.fillStyle = '#c0c8d8'; for (let k = 0; k < 2; k++) { ctx.beginPath(); ctx.arc(hx - hr * 0.9 + 2.5, hy + hr * 0.6 + k * 4, 1.3, 0, TAU); ctx.fill(); } }
  ctx.fillStyle = D.fur; ctx.beginPath();
  if (bull) ctx.ellipse(hx, hy, hr * 1.1, hr * 0.9, 0, 0, TAU); else ctx.arc(hx, hy, hr, 0, TAU);
  ctx.fill(); ctx.stroke();
  // snout & nose
  ctx.fillStyle = D.snout;
  ctx.beginPath(); ctx.ellipse(hx + hr * 0.7, hy + hr * 0.25, hr * (bull ? 0.6 : 0.65), hr * 0.45, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = OUT; ctx.beginPath(); ctx.ellipse(hx + hr * 1.22, hy + hr * 0.05, 2.2, 1.7, 0, 0, TAU); ctx.fill();
  if (bark) {                                                   // mouth open, mid-bark
    ctx.fillStyle = '#7a2a3a'; ctx.beginPath(); ctx.ellipse(hx + hr * 0.75, hy + hr * 0.62, 3, 2.2, 0, 0, TAU); ctx.fill();
  } else if (bull) {                                            // underbite with two little teeth
    ctx.fillStyle = '#fff'; ctx.fillRect(hx + hr * 0.5, hy + hr * 0.5, 1.6, 2); ctx.fillRect(hx + hr * 0.9, hy + hr * 0.5, 1.6, 2);
  } else {
    ctx.fillStyle = '#ff7a8a'; ctx.beginPath(); ctx.ellipse(hx + hr * 0.6, hy + hr * 0.75 + Math.abs(trot), 1.8, 2.8, 0, 0, TAU); ctx.fill();   // tongue
  }
  // eye and a cross eyebrow
  ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(hx + hr * 0.25, hy - hr * 0.3, 1.5, 0, TAU); ctx.fill();
  ctx.strokeStyle = OUT; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(hx - hr * 0.1, hy - hr * 0.75); ctx.lineTo(hx + hr * 0.55, hy - hr * 0.5); ctx.stroke();
  // ear
  ctx.fillStyle = D.patch; ctx.lineWidth = 1.8;
  ctx.save(); ctx.translate(hx - hr * 0.35, hy - hr * 0.55); ctx.rotate(bull ? -0.9 : 0.35 + trot * 0.15);
  ctx.beginPath(); ctx.ellipse(0, bull ? -1 : 3, bull ? 3 : 3.2, bull ? 2.6 : 6, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

// A scruffy stray tomcat on the prowl: torn ear, scar, one squinty eye.
function drawTomcat(x, y, dir, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const step = Math.sin(t * 6), fur = '#7d7690', dark = '#55506a';
  // tail, up and kinked
  const sw = Math.sin(t * 2.5) * 3;
  const tail = () => { ctx.beginPath(); ctx.moveTo(-11, -16); ctx.quadraticCurveTo(-20, -20, -18 + sw, -32); ctx.lineTo(-14 + sw, -36); };
  ctx.strokeStyle = OUT; ctx.lineWidth = 6.5; tail(); ctx.stroke();
  ctx.strokeStyle = fur; ctx.lineWidth = 3.8; tail(); ctx.stroke();
  // legs
  [-8, -4, 6, 10].forEach((lx, k) => {
    const s2 = (k % 2 ? 1 : -1) * step * 2;
    ctx.strokeStyle = OUT; ctx.lineWidth = 5.5; ctx.beginPath(); ctx.moveTo(lx, -12); ctx.lineTo(lx + s2, -1); ctx.stroke();
    ctx.strokeStyle = k < 2 ? dark : fur; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(lx, -12); ctx.lineTo(lx + s2, -1); ctx.stroke();
  });
  // body, back hunched
  ctx.fillStyle = fur; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-13, -12); ctx.quadraticCurveTo(-12, -24, 0, -23); ctx.quadraticCurveTo(10, -22, 13, -14);
  ctx.quadraticCurveTo(12, -9, 0, -9); ctx.quadraticCurveTo(-12, -8, -13, -12); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = dark; ctx.lineWidth = 1.8;
  ctx.beginPath(); for (const sx of [-7, -2, 3]) { ctx.moveTo(sx, -22.5); ctx.lineTo(sx + 1, -17); } ctx.stroke();
  // head
  const hx = 14, hy = -22;
  ctx.fillStyle = fur; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(hx - 6, hy - 4); ctx.lineTo(hx - 5, hy - 12); ctx.lineTo(hx - 1, hy - 6); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx + 2, hy - 6); ctx.lineTo(hx + 5, hy - 12); ctx.lineTo(hx + 6, hy - 9); ctx.lineTo(hx + 5.5, hy - 8); ctx.lineTo(hx + 7, hy - 4); ctx.closePath(); ctx.fill(); ctx.stroke();   // the torn one
  ctx.beginPath(); ctx.ellipse(hx, hy, 8, 7, 0, 0, TAU); ctx.fill(); ctx.stroke();
  // face: one yellow slit eye, one scarred shut
  ctx.fillStyle = '#ffd23c'; ctx.beginPath(); ctx.ellipse(hx + 3.5, hy - 1.5, 2.2, 2, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = OUT; ctx.fillRect(hx + 3.1, hy - 3.3, 0.9, 3.6);
  ctx.strokeStyle = OUT; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(hx - 3.5, hy - 1.5); ctx.lineTo(hx - 0.5, hy - 1); ctx.stroke();
  ctx.strokeStyle = '#ff9fb5'; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.moveTo(hx - 3, hy - 4.5); ctx.lineTo(hx - 1, hy + 1.5); ctx.stroke();
  ctx.strokeStyle = OUT; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(hx + 1, hy + 3.5); ctx.lineTo(hx + 4, hy + 3); ctx.lineTo(hx + 6, hy + 4); ctx.stroke();      // a sneer
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(hx + 4, hy + 3); ctx.lineTo(hx + 4.6, hy + 5); ctx.lineTo(hx + 5.2, hy + 3.3); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(hx + 6, hy + 1); ctx.lineTo(hx + 12, hy - 0.5); ctx.moveTo(hx + 6, hy + 2); ctx.lineTo(hx + 12, hy + 3); ctx.stroke();
  ctx.restore();
}

// A dog in a hot-air balloon, ears flapping, barking down at him.
function drawDogBalloon(x, y, t) {
  ctx.save(); ctx.translate(x, y);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  const cols = { human: ['#ff8fc8', '#ffe066', '#7ad3ff'], yarn: ['#e85a8a', '#ffd65a', '#8a6ad0'], dog: ['#e0455b', '#fff6e8', '#4a8ad0'] }[themeId()];
  ctx.save();
  ctx.beginPath(); ctx.arc(0, -40, 26, Math.PI * 0.85, Math.PI * 2.15); ctx.lineTo(9, -10); ctx.lineTo(-9, -10); ctx.closePath();
  ctx.clip();
  for (let k = 0; k < 7; k++) { ctx.fillStyle = cols[k % 3]; ctx.fillRect(-28 + k * 8, -70, 8, 62); }
  ctx.restore();
  ctx.beginPath(); ctx.arc(0, -40, 26, Math.PI * 0.85, Math.PI * 2.15); ctx.lineTo(9, -10); ctx.lineTo(-9, -10); ctx.closePath(); ctx.stroke();
  // a bone badge on the envelope
  ctx.fillStyle = '#fff6e8'; ctx.lineWidth = 1.3;
  ctx.beginPath(); roundRect(ctx, -7, -44, 14, 4, 2); ctx.fill(); ctx.stroke();
  for (const bx of [-7, 7]) for (const by of [-44, -40]) { ctx.beginPath(); ctx.arc(bx, by, 2.2, 0, TAU); ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = '#fff6e8'; roundRect(ctx, -6.5, -43.3, 13, 2.6, 1.3); ctx.fill();
  // ropes + basket
  ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-9, -10); ctx.lineTo(-9, 6); ctx.moveTo(9, -10); ctx.lineTo(9, 6); ctx.stroke();
  // the dog, peering over the edge
  const flap = Math.sin(t * 8) * 0.4;
  ctx.fillStyle = '#d9b07a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 1, 7, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#8a5a3a';
  for (const side of [-1, 1]) { ctx.save(); ctx.translate(side * 6, -2); ctx.rotate(side * (0.6 + flap)); ctx.beginPath(); ctx.ellipse(0, 3, 2.4, 5, 0, 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore(); }
  ctx.fillStyle = '#f3dcb4'; ctx.beginPath(); ctx.ellipse(0, 4, 4, 3, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(-2.4, -0.5, 1, 0, TAU); ctx.arc(2.4, -0.5, 1, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 2.6, 1.8, 1.3, 0, 0, TAU); ctx.fill();
  if (Math.sin(t * 2.3) > 0.6) { ctx.fillStyle = '#7a2a3a'; ctx.beginPath(); ctx.ellipse(0, 6, 2, 1.5, 0, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#b07a40'; roundRect(ctx, -11, 6, 22, 14, 3); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-11, 13); ctx.lineTo(11, 13); ctx.stroke();
  ctx.restore();
}

// A very good space dog: jetpack, fishbowl helmet, absolutely thrilled.
