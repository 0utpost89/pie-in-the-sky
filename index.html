<script>
'use strict';

/* =====================================================================
   SKY SCRATCHER
   Rolo, a grumpy, fluffy tabby Persian, bounces endlessly upward from his
   back yard to the edge of space and beyond, eating fish, chasing laser
   dots and dodging dogs. Everything is drawn with canvas shapes and every sound is
   synthesised with the Web Audio API. No external assets.

   Sections:
     1. Config               9. Update (fixed timestep)
     2. Utilities           10. Render: background
     3. Canvas & scaling    11. Render: platforms
     4. Audio & music       12. Render: food, hazards, black holes
     5. Text data           13. Render: player
     6. Themes & zones      14. Render: particles & UI
     7. Game state & world  15. Main loop
     8. Input
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. CONFIG — tweak the feel of the game here
   --------------------------------------------------------------------- */
const CONFIG = {
  // View: a logical space of fixed height; width adapts to the screen
  // within these limits (a portrait column on wide screens).
  viewHeight: 640,
  minViewWidth: 320,
  maxViewWidth: 520,
  pxPerMetre: 8,           // world pixels per metre of height climbed

  // Physics (px, seconds)
  gravity: 1300,
  jumpVelocity: 775,       // upward speed off a standard platform (~230px jump, floaty)
  bouncyMul: 1.45,         // bouncy platforms launch this much faster
  maxFallSpeed: 1000,
  moveSpeed: 370,          // top sideways speed
  moveAccel: 2800,         // how fast he gets up to speed
  moveDecel: 2000,         // how fast he slows with no input
  airDrag: 2.4,            // how fast sideways shoves (knocks, black-hole flings) fade, per second

  // Touch: drag anywhere and he steers towards your finger
  dragEase: 70,            // px: closer than this he slows down
  dragDeadzone: 5,         // px: close enough, stop

  // Tilt control (phones)
  tiltFullAngle: 22,       // degrees of tilt for full speed
  tiltDeadzone: 2.5,

  // Zones of universe 1, by height in metres. Heights are measured from
  // where the current universe started, so universe 4 starts at the garden again.
  zones: {
    garden: 0,             // Ground & garden
    sky: 1000,             // The sky
    edge: 2500,            // Edge of space (helmet on, lower gravity)
    deep: 4500,            // Deep space
    holes: 7000,           // Black holes (portals to the next universe)
  },
  zoneBlend: 120,          // metres either side of a boundary over which zones blend
  spaceGravityMul: 0.72,   // gravity multiplier in the space zones (floatier)

  // Alternate universes
  altHolesAfter: 2500,     // metres into universe 2+ before black holes appear
  universes: [
    // gravity and jump multipliers: Dog World is heavier and denser
    { theme: 'human', gravityMul: 1,    jumpMul: 1 },
    { theme: 'yarn',  gravityMul: 0.96, jumpMul: 1.0 },
    { theme: 'dog',   gravityMul: 1.24, jumpMul: 1.14 },
  ],

  // Belly: each food makes it bigger. Bigger belly = more points, more gravity.
  belly: {
    max: 5,
    gravityPerLevel: 0.06,  // +6% gravity per level (+30% at max: jumps ~23% lower)
    bonusPerLevel: 0.5,     // food points x (1 + 0.5 per level): x3.5 at max
    digestSeconds: 10,      // one level digests (with a burp) every this many seconds
  },

  // Food
  foodPoints: 50,
  foodChance: 0.2,         // chance of a food item per platform generated
  rushTime: 0.8,           // catnip: seconds of upward rush...
  rushSpeed: 1050,         // ...at this speed
  rushSideMul: 1.35,       // ...and quicker sideways movement
  bigBounces: 3,           // fish: this many bigger bounces...
  bigBounceMul: 1.3,       // ...this much higher
  laserTime: 2.2,          // laser pointer: seconds chasing the red dot...
  laserSpeed: 860,         // ...climbing at this speed
  laserLead: 150,          // ...with the dot this far ahead of him

  // Hazards
  knockDown: 380,          // downward speed after bumping into a dog or a tomcat
  knockSide: 300,
  knockGrace: 1.2,         // seconds before the next knock can happen
  gullSpeed: 175,
  bopPoints: 25,           // points for bouncing on a seagull's head

  // Black holes
  blackHole: {
    pullRadius: 240,       // px: how far the pull reaches
    pull: 2300,            // px/s^2 at the edge of the core
    verticalPull: 0.45,    // pulls mostly left & right
    coreRadius: 20,        // drift into this and you go through
    minSpacing: 700,       // px between black holes
    chance: 0.14,          // per platform generated, once allowed
  },

  // Loop
  fixedStep: 1 / 120,
  maxFrameTime: 0.25,
};

/* ---------------------------------------------------------------------
   2. UTILITIES
   --------------------------------------------------------------------- */
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

function hash(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}
const hash2 = (n, k) => hash(n * 17.31 + k * 101.73);

function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixColor(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`;
}
// Weighted blend of several hex colours: [[hex, weight], ...]
function blendColors(list) {
  let r = 0, g = 0, b = 0, w = 0;
  for (const [hex, k] of list) { if (k <= 0) continue; const c = hexToRgb(hex); r += c[0] * k; g += c[1] * k; b += c[2] * k; w += k; }
  if (!w) return '#000';
  return `rgb(${Math.round(r / w)},${Math.round(g / w)},${Math.round(b / w)})`;
}
const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

function roundRect(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// (Saved keys keep their old 'pieSky.' prefix so existing high scores carry over.)
// localStorage can throw (private mode, blocked storage) so wrap it.
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { /* ignore */ } },
};

const fmt = n => Math.floor(n).toLocaleString('en-GB');

/* ---------------------------------------------------------------------
   3. CANVAS & SCALING
   --------------------------------------------------------------------- */
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');
let W = 400, H = CONFIG.viewHeight;   // logical view size
let DPR = 1;

function resize() {
  const vw = document.body.clientWidth || window.innerWidth, vh = document.body.clientHeight || window.innerHeight;
  H = CONFIG.viewHeight;
  W = Math.round(clamp(H * vw / vh, CONFIG.minViewWidth, CONFIG.maxViewWidth));
  const scale = Math.min(vw / W, vh / H);
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  const cssW = Math.floor(W * scale), cssH = Math.floor(H * scale);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.max(1, Math.round(cssW * DPR));
  canvas.height = Math.max(1, Math.round(cssH * DPR));
  // keep platforms on screen if the view got narrower
  for (const p of game.platforms) p.x = clamp(p.x, 4, Math.max(4, W - p.w - 4));
  player.x = clamp(player.x, 0, W);
}

/* ---------------------------------------------------------------------
   4. AUDIO — everything synthesised with Web Audio
   --------------------------------------------------------------------- */
const Sound = {
  ctx: null, master: null, noiseBuf: null, hum: null,
  muted: store.get('pieSky.muted', '0') === '1',

  // Must be called from a user gesture (browsers block autoplay).
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.55;
      const comp = this.ctx.createDynamicsCompressor();      // keeps overlapping sounds from clipping
      comp.threshold.value = -16; comp.ratio.value = 6;
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      if (game.state === 'title') Music.start();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  on() { return !!this.ctx && !this.muted; },

  setMuted(m) {
    this.muted = m;
    store.set('pieSky.muted', m ? '1' : '0');
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.55, this.ctx.currentTime, 0.02);
  },

  tone(freq, dur, type = 'sine', vol = 0.2, delay = 0, slideTo = 0, out = null) {
    if (!this.on()) return;
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out || this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, freq, vol, delay = 0, type = 'bandpass', q = 1, slideTo = 0) {
    if (!this.on()) return;
    const c = this.ctx, t = c.currentTime + delay;
    const n = c.createBufferSource(); n.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(f); f.connect(g); g.connect(this.master);
    n.start(t, Math.random() * 0.5); n.stop(t + dur + 0.02);
  },

  click()  { this.tone(600, 0.06, 'square', 0.08); },
  blip()   { this.tone(700, 0.08, 'triangle', 0.14); this.tone(1050, 0.1, 'triangle', 0.12, 0.06); },
  nope()   { this.tone(220, 0.18, 'square', 0.06, 0, 150); },
  // A rubbery boing that rises a little with each bounce height.
  bounce(power = 1) {
    const f = rand(250, 290) * (0.9 + power * 0.15);
    this.tone(f, 0.16, 'sine', 0.22, 0, f * 2.1);
    this.tone(f * 0.5, 0.08, 'triangle', 0.12, 0, f);
  },
  spring() {                                            // big, wobbly BOI-OI-OING
    if (!this.on()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain(), lfo = c.createOscillator(), ld = c.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(620, t + 0.45);
    lfo.frequency.value = 16; ld.gain.value = 50;
    lfo.connect(ld); ld.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.28, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g); g.connect(this.master);
    o.start(t); lfo.start(t); o.stop(t + 0.52); lfo.stop(t + 0.52);
  },
  crumble() {
    this.noise(0.25, 900, 0.45, 0, 'lowpass', 1, 250);
    for (let i = 0; i < 5; i++) this.noise(0.04, rand(1500, 3500), 0.18, i * rand(0.03, 0.06), 'bandpass', 3);
  },
  crunch() {                                            // a good crunchy bite
    for (let i = 0; i < 4; i++) this.noise(0.05, rand(2500, 5000), 0.35 - i * 0.05, i * rand(0.045, 0.07), 'bandpass', 1.4);
    this.tone(140, 0.07, 'square', 0.05, 0, 90);
  },
  slurp() {                                             // tea, gravy and other liquids
    this.noise(0.3, 600, 0.3, 0, 'bandpass', 4, 2400);
    this.tone(300, 0.2, 'sine', 0.1, 0.05, 700);
  },
  burp() {
    if (!this.on()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(rand(85, 110), t);
    o.frequency.linearRampToValueAtTime(rand(65, 80), t + 0.35);
    const lfo = c.createOscillator(), ld = c.createGain();
    lfo.frequency.value = 23; ld.gain.value = 18; lfo.connect(ld); ld.connect(o.frequency);
    f.type = 'bandpass'; f.frequency.value = 520; f.Q.value = 1.6;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.7, t + 0.03);
    g.gain.setValueAtTime(0.6, t + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    o.connect(f); f.connect(g); g.connect(this.master);
    o.start(t); lfo.start(t); o.stop(t + 0.45); lfo.stop(t + 0.45);
  },
  meow(vol = 0.16) {                                    // a little mew
    if (!this.on()) return;
    const c = this.ctx, t = c.currentTime, f0 = rand(560, 700);
    const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0, t); o.frequency.linearRampToValueAtTime(f0 * 1.45, t + 0.12); o.frequency.linearRampToValueAtTime(f0 * 0.85, t + 0.36);
    f.type = 'bandpass'; f.Q.value = 3;
    f.frequency.setValueAtTime(900, t); f.frequency.linearRampToValueAtTime(2000, t + 0.12); f.frequency.linearRampToValueAtTime(1100, t + 0.36);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.04); g.gain.setValueAtTime(vol, t + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(f); f.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.42);
  },
  knock() {
    this.tone(330, 0.25, 'sine', 0.4, 0, 90);           // cartoon "bonk"
    this.noise(0.12, 1000, 0.4, 0, 'lowpass');
  },
  grumble() {                                           // a muttered "harrumph"
    for (let i = 0; i < 4; i++) {
      const f = rand(110, 160);
      this.tone(f, 0.12, 'sawtooth', 0.05, 0.08 + i * 0.11, f * rand(0.8, 1.1));
    }
  },
  squawk() {
    this.tone(1300, 0.18, 'sawtooth', 0.08, 0, 700);
    this.tone(1100, 0.2, 'square', 0.04, 0.16, 600);
    this.noise(0.15, 2500, 0.1, 0, 'bandpass', 2);
  },
  bop() { this.tone(520, 0.12, 'square', 0.1, 0, 1040); this.noise(0.08, 3000, 0.2, 0, 'highpass'); },
  rush() { this.noise(0.6, 400, 0.4, 0, 'bandpass', 1.2, 3000); this.tone(200, 0.5, 'sawtooth', 0.06, 0, 800); },
  laser() { this.tone(1800, 0.25, 'sine', 0.08, 0, 2600); this.tone(2400, 0.12, 'square', 0.03, 0.08, 1600); },
  power() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.1, 'square', 0.05, i * 0.05)); },
  helmet() {                                            // thunk + ding
    this.tone(160, 0.12, 'sine', 0.35, 0, 80);
    this.tone(1760, 0.5, 'sine', 0.1, 0.08);
    this.tone(2637, 0.4, 'sine', 0.05, 0.1);
  },
  visor() { this.tone(1200, 0.04, 'square', 0.05); this.noise(0.05, 5000, 0.1, 0, 'highpass'); },
  zone()  { [659, 880, 1175].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.1, i * 0.09)); },
  whoosh() { this.noise(1.2, 200, 0.5, 0, 'bandpass', 1.5, 4000); this.tone(800, 1.1, 'sine', 0.12, 0, 60); },
  zap()   { this.tone(1500, 0.6, 'sine', 0.1, 0, 300); this.tone(1520, 0.6, 'sine', 0.08, 0, 310); },
  flashBang() { this.noise(0.8, 3000, 0.5, 0, 'lowpass', 0.7, 200); this.tone(110, 0.8, 'sine', 0.35, 0, 40); },

  // A low drone that grows as he nears a black hole (0..1).
  setHum(v) {
    if (!this.ctx) return;
    const c = this.ctx;
    if (!this.hum) {
      const o = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
      o.type = 'sawtooth'; o.frequency.value = 46; o2.type = 'sine'; o2.frequency.value = 69;
      f.type = 'lowpass'; f.frequency.value = 260;
      g.gain.value = 0;
      o.connect(f); o2.connect(f); f.connect(g); g.connect(this.master);
      o.start(); o2.start();
      this.hum = { o, o2, g, f };
    }
    const t = c.currentTime;
    this.hum.g.gain.setTargetAtTime(v * 0.22, t, 0.1);
    this.hum.o.frequency.setTargetAtTime(46 + v * 30, t, 0.1);
    this.hum.f.frequency.setTargetAtTime(220 + v * 500, t, 0.1);
  },
};

/* ---------------------------------------------------------------------
   4b. MUSIC — an original, swinging honky-tonk piano tune in the spirit of
   early-60s finger-snapping easy listening, synthesised live
   --------------------------------------------------------------------- */
// Written in swung eighth-note steps (8 per bar). Each bar is a chord name
// plus melody notes as [step, length in steps, MIDI note]; '' = a little meow.
// The left hand plays stride: low bass on beats 1 & 3, a chord on 2 & 4.
const CHORDS = {
  C6: [48, 52, 55, 57], A7: [45, 49, 52, 55], Dm7: [50, 53, 57, 60], G7: [43, 47, 50, 53],
  F6: [41, 45, 48, 50], D7: [50, 54, 57, 60],
};
const SONG = (() => {
  const A = [
    ['C6',  [[0, 1, 76], [1, 1, 75], [2, 2, 76], [4, 1, 79], [5, 1, 76], [6, 2, 72]]],
    ['A7',  [[0, 1, 73], [1, 1, 74], [2, 2, 76], [4, 2, 79], [6, 2, 81]]],
    ['Dm7', [[0, 3, 77], [3, 1, 76], [4, 1, 74], [5, 1, 72], [6, 2, 69]]],
    ['G7',  [[0, 2, 71], [2, 2, 74], [4, 2, 77], [6, 2, '']]],
    ['C6',  [[0, 1, 76], [1, 1, 75], [2, 2, 76], [4, 1, 79], [5, 1, 76], [6, 2, 72]]],
    ['Dm7', [[0, 1, 74], [1, 1, 76], [2, 2, 77], [4, 1, 81], [5, 1, 79], [6, 2, 77]]],
    ['G7',  [[0, 1, 74], [1, 1, 77], [2, 2, 79], [4, 1, 77], [5, 1, 74], [6, 2, 71]]],
    ['C6',  [[0, 2, 72], [2, 2, 67], [4, 2, 72], [6, 2, '']]],
  ];
  const B = [
    ['F6',  [[0, 1, 81], [1, 1, 80], [2, 2, 81], [4, 2, 77], [6, 2, 72]]],
    ['F6',  [[0, 1, 74], [1, 1, 76], [2, 2, 77], [4, 2, 81], [6, 2, 84]]],
    ['C6',  [[0, 3, 84], [3, 1, 83], [4, 1, 81], [5, 1, 79], [6, 2, 76]]],
    ['C6',  [[0, 2, 79], [2, 2, 76], [4, 2, 72], [6, 2, '']]],
    ['D7',  [[0, 1, 78], [1, 1, 79], [2, 2, 81], [4, 2, 78], [6, 2, 74]]],
    ['G7',  [[0, 1, 77], [1, 1, 79], [2, 2, 77], [4, 2, 74], [6, 2, 71]]],
    ['C6',  [[0, 1, 76], [1, 1, 75], [2, 1, 76], [3, 1, 79], [4, 2, 84], [6, 2, 79]]],
    ['G7',  [[0, 2, 74], [2, 2, 71], [4, 2, 67], [6, 2, '']]],
  ];
  return [].concat(A, A, B, A);
})();
const SWING = 0.64;                 // share of each beat the first eighth gets
// Each universe gets its own lead: honky-tonk piano, a twinkly celesta, a jazzy organ.
const BANDS = {
  human: { transpose: 0, lead: 'piano', bpm: 124 },
  yarn:  { transpose: -3, lead: 'celesta', bpm: 108 },
  dog:   { transpose: 2, lead: 'organ', bpm: 134 },
};

const Music = {
  on: store.get('pieSky.music', '1') === '1',
  playing: false, gain: null, timer: null, step: 0, nextTime: 0,
  volume: 0.18,

  setup() {
    const c = Sound.ctx;
    if (!c || this.gain) return !!c;
    this.gain = c.createGain();
    this.gain.gain.value = this.on ? this.volume : 0;
    this.gain.connect(Sound.master);
    return true;
  },
  start() {
    if (!this.setup()) return;
    this.stop();
    this.playing = true;
    this.step = 0;
    this.nextTime = Sound.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.tick(), 25);
  },
  stop() { this.playing = false; clearInterval(this.timer); },
  toggle() {
    this.on = !this.on;
    store.set('pieSky.music', this.on ? '1' : '0');
    if (this.gain) this.gain.gain.setTargetAtTime(this.on ? this.volume : 0, Sound.ctx.currentTime, 0.05);
  },
  band() { return BANDS[themeId()]; },
  bpm() { return this.band().bpm + (game.state === 'play' ? Math.min(game.heightM / 250, 14) : 0); },
  tick() {
    if (!this.playing) return;
    const c = Sound.ctx;
    if (document.hidden) { this.nextTime = c.currentTime + 0.05; return; }
    while (this.nextTime < c.currentTime + 0.15) {
      const beat = 60 / this.bpm(), e = beat / 2;
      this.playStep(this.step, this.nextTime, e);
      this.nextTime += beat * (this.step % 2 === 0 ? SWING : 1 - SWING);     // swing it
      this.step = (this.step + 1) % (SONG.length * 8);
    }
  },
  playStep(step, t, e) {
    const [chord, notes] = SONG[Math.floor(step / 8)], k = step % 8, band = this.band(), tr = band.transpose;
    const ch = CHORDS[chord].map(n => n + tr);
    // brushes and finger snaps
    if (k === 0) this.kick(t);
    if (k === 2 || k === 6) { this.snare(t); this.snap(t); }
    this.hat(t, k % 2 ? 0.025 : 0.045);
    // stride left hand: bass on 1 & 3 (root, then fifth), chord on 2 & 4
    if (k === 0) this.piano(t, ch[0] - 12, e * 1.8, 0.16);
    if (k === 4) this.piano(t, ch[2] - 12 - (ch[2] - 12 > ch[0] - 5 ? 12 : 0), e * 1.8, 0.14);
    if (k === 2 || k === 6) for (const n of ch.slice(1)) this.piano(t, n + 12, e * 0.9, 0.05);
    for (const [st, len, n] of notes) {
      if (st !== k) continue;
      if (n === '') { this.meow(t); continue; }
      this.lead(band.lead, t, n + tr, len * e * 0.92);
    }
  },
  lead(kind, t, midi, d) {
    if (kind === 'piano') {                            // right hand, with a quiet octave below
      this.piano(t, midi, d, 0.17);
      this.piano(t, midi - 12, d, 0.06);
      return;
    }
    if (kind === 'celesta') {                          // a music box
      this.bell(t, midi, d);
      return;
    }
    const c = Sound.ctx, f = 440 * Math.pow(2, (midi - 69) / 12);
    const o1 = c.createOscillator(), o2 = c.createOscillator();
    const filt = c.createBiquadFilter(), g = c.createGain();
    if (kind === 'organ') {
      o1.type = 'square'; o2.type = 'sine';
      o1.frequency.value = f; o2.frequency.value = f * 2;
      filt.type = 'lowpass'; filt.frequency.value = f * 4;
    } else {                                           // cornet: brassy scoop
      o1.type = o2.type = 'sawtooth';
      o1.frequency.setValueAtTime(f * 0.97, t); o1.frequency.exponentialRampToValueAtTime(f, t + 0.035);
      o2.frequency.setValueAtTime(f * 0.975, t); o2.frequency.exponentialRampToValueAtTime(f * 1.004, t + 0.035);
      filt.type = 'lowpass'; filt.Q.value = 2;
      filt.frequency.setValueAtTime(f * 1.5, t);
      filt.frequency.exponentialRampToValueAtTime(Math.min(f * 7, 5000), t + 0.04);
      filt.frequency.exponentialRampToValueAtTime(Math.min(f * 4, 3600), t + 0.18);
    }
    const vol = kind === 'organ' ? 0.13 : 0.18;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.018);
    g.gain.setValueAtTime(vol * 0.8, t + Math.max(0.03, d - 0.04));
    g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.05);
    if (d > 0.3) {                                     // vibrato on held notes
      const lfo = c.createOscillator(), ld = c.createGain();
      lfo.frequency.value = kind === 'organ' ? 6.5 : 5.5;
      ld.gain.setValueAtTime(0, t); ld.gain.linearRampToValueAtTime(f * 0.012, t + 0.25);
      lfo.connect(ld); ld.connect(o1.frequency); ld.connect(o2.frequency);
      lfo.start(t); lfo.stop(t + d + 0.1);
    }
    o1.connect(filt); o2.connect(filt); filt.connect(g); g.connect(this.gain);
    o1.start(t); o2.start(t); o1.stop(t + d + 0.1); o2.stop(t + d + 0.1);
  },
  // A honky-tonk piano: two slightly out-of-tune strings and a percussive decay.
  piano(t, midi, d, vol) {
    const c = Sound.ctx, f = 440 * Math.pow(2, (midi - 69) / 12);
    const filt = c.createBiquadFilter(), g = c.createGain();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(Math.min(f * 8, 7000), t);
    filt.frequency.exponentialRampToValueAtTime(Math.min(f * 2.5, 4000), t + 0.3);
    const ring = Math.min(1.4, d + 0.35);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.18);
    g.gain.setTargetAtTime(0.0001, t + d, 0.06);
    filt.connect(g); g.connect(this.gain);
    for (const [type, mul, amp] of [['triangle', 1, 1], ['triangle', 1.006, 0.8], ['sine', 2, 0.35], ['square', 1, 0.08]]) {
      const o = c.createOscillator(), og = c.createGain();
      o.type = type; o.frequency.value = f * mul; og.gain.value = amp;
      o.connect(og); og.connect(filt); o.start(t); o.stop(t + ring + 0.1);
    }
  },
  bell(t, midi, d) {
    const c = Sound.ctx, f = 440 * Math.pow(2, (midi - 69) / 12), g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(1.2, d + 0.5));
    g.connect(this.gain);
    for (const [mul, amp] of [[1, 1], [4, 0.25], [2.76, 0.12]]) {
      const o = c.createOscillator(), og = c.createGain();
      o.type = 'sine'; o.frequency.value = f * mul; og.gain.value = amp;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + Math.min(1.2, d + 0.5) + 0.05);
    }
  },
  // A little synthesised meow: a nasal tone that rises and falls.
  meow(t) {
    const c = Sound.ctx, o = c.createOscillator(), f1 = c.createBiquadFilter(), f2 = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(520, t); o.frequency.linearRampToValueAtTime(760, t + 0.12); o.frequency.exponentialRampToValueAtTime(430, t + 0.36);
    f1.type = 'bandpass'; f1.Q.value = 3; f1.frequency.setValueAtTime(900, t); f1.frequency.linearRampToValueAtTime(1500, t + 0.12); f1.frequency.linearRampToValueAtTime(800, t + 0.36);
    f2.type = 'lowpass'; f2.frequency.value = 3000;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.04);
    g.gain.setValueAtTime(0.14, t + 0.24); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
    o.connect(f1); f1.connect(f2); f2.connect(g); g.connect(this.gain);
    o.start(t); o.stop(t + 0.4);
  },
  snap(t) { this.drumNoise(t, 0.035, 'bandpass', 2600, 0.22, 2.5); },
  tuba(t, midi, d) {
    const c = Sound.ctx, f = 440 * Math.pow(2, (midi - 69) / 12);
    const o = c.createOscillator(), o2 = c.createOscillator();
    o.type = 'triangle'; o2.type = 'square'; o.frequency.value = f; o2.frequency.value = f;
    const og = c.createGain(); og.gain.value = 0.25;
    const filt = c.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 420;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.38, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(filt); o2.connect(og); og.connect(filt); filt.connect(g); g.connect(this.gain);
    o.start(t); o2.start(t); o.stop(t + d + 0.02); o2.stop(t + d + 0.02);
  },
  drumNoise(t, dur, type, freq, vol, q = 1) {
    const c = Sound.ctx, n = c.createBufferSource(); n.buffer = Sound.noiseBuf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(f); f.connect(g); g.connect(this.gain);
    n.start(t, Math.random() * 0.5); n.stop(t + dur + 0.02);
  },
  kick(t) {
    const c = Sound.ctx, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.1);
    g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(this.gain); o.start(t); o.stop(t + 0.18);
  },
  snare(t) { this.drumNoise(t, 0.16, 'bandpass', 3200, 0.12, 0.6); },              // a soft brush swish
  hat(t, vol = 0.04) { this.drumNoise(t, 0.04, 'highpass', 8000, vol); },

  // --- jingles (sound effects: they play even with the music switched off) ---
  fanfare() {
    if (!Sound.on()) return;
    const t = Sound.ctx.currentTime + 0.05, m = Sound.master;
    [[0, 72, 0.12], [0.14, 72, 0.12], [0.28, 72, 0.12], [0.42, 76, 0.3], [0.76, 74, 0.12], [0.9, 76, 0.12], [1.04, 79, 0.7]]
      .forEach(([dt, n, d]) => { this.leadTo(m, t + dt, n, d, 0.16); this.leadTo(m, t + dt, n - 5, d, 0.1); });
    [[0, 48], [0.42, 55], [1.04, 48]].forEach(([dt, n]) => this.tubaTo(m, t + dt, n, 0.4));
  },
  leadTo(out, t, midi, d, vol) {
    const keep = this.gain; this.gain = out;
    this.lead('cornet', t, midi, d);
    this.gain = keep;
  },
  tubaTo(out, t, midi, d) { const keep = this.gain; this.gain = out; this.tuba(t, midi, d); this.gain = keep; },
  sadTrombone() {
    if (!Sound.on()) return;
    const t = Sound.ctx.currentTime + 0.05;
    [[0, 58, 0.38], [0.45, 57, 0.38], [0.9, 56, 0.38], [1.35, 55, 1.1]].forEach(([dt, n, d]) =>
      this.leadTo(Sound.master, t + dt, n, d, 0.2));
  },
};

function universeCfg(u = game.universe) { return CONFIG.universes[(u - 1) % CONFIG.universes.length]; }
function themeId(u = game.universe) { return universeCfg(u).theme; }
function theme(u = game.universe) { return THEMES[themeId(u)]; }

const toMetres = y => -y / CONFIG.pxPerMetre;                    // world y (up is negative) -> metres
const relHeight = y => toMetres(y) - game.uniStartM;             // metres into the current universe

function zoneEnd(zones, i) { return i + 1 < zones.length ? zones[i + 1].start : Infinity; }
// How much each zone counts at height h (sums to 1), so zones blend gradually.
function zoneWeights(zones, h) {
  const B = CONFIG.zoneBlend;
  let sum = 0;
  const w = zones.map((z, i) => {
    let k = 1;
    if (i > 0) k *= clamp((h - (z.start - B)) / (2 * B), 0, 1);
    const e = zoneEnd(zones, i);
    if (e < Infinity) k *= clamp((e + B - h) / (2 * B), 0, 1);
    sum += k;
    return k;
  });
  return w.map(k => k / (sum || 1));
}
function zoneIndexAt(zones, h) {
  let r = 0;
  for (let i = 0; i < zones.length; i++) if (h >= zones[i].start) r = i;
  return r;
}
function weightedIndex(ws) {
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r <= 0) return i; }
  return ws.length - 1;
}
// Progress through a zone's difficulty ramp (0..1), plus a bit for each universe.
function zoneDifficulty(zones, i, h) {
  const z = zones[i];
  const d = clamp((h - z.start) / z.profile.len, 0, 1);
  return clamp(d + (game.universe - 1) * 0.12, 0, 1.25);
}
const pval = (pair, d) => lerp(pair[0], pair[1], clamp(d, 0, 1));

// Gravity multiplier at a height (blended between zones) for this universe.
function gravityMulAt(h) {
  const zones = theme().zones, ws = zoneWeights(zones, h);
  let g = 0;
  zones.forEach((z, i) => { g += z.gravityMul * ws[i]; });
  return g * universeCfg().gravityMul;
}
function jumpVel() { return CONFIG.jumpVelocity * universeCfg().jumpMul; }
// Jump height off a standard platform with a given gravity multiplier and belly.
function jumpHeight(gMul, belly) {
  const v = jumpVel(), g = CONFIG.gravity * gMul * (1 + belly * CONFIG.belly.gravityPerLevel);
  return v * v / (2 * g);
}

/* ---------------------------------------------------------------------
   7. GAME STATE & WORLD
   --------------------------------------------------------------------- */
const game = {
  state: 'title',          // 'title' | 'play' | 'portal' | 'dying' | 'over'
  time: 0,
  cam: 0, prevCam: 0,      // world y of the top of the view
  platforms: [], foods: [], hazards: [], gulls: [], holes: [], particles: [], bubbles: [],
  nextY: 0, lastHoleY: 0, gullT: 4,
  heightM: 0, foodScore: 0, score: 0, foodEaten: 0,
  best: parseInt(store.get('pieSky.best', '0'), 10) || 0,
  bestUniverse: parseInt(store.get('pieSky.bestUni', '1'), 10) || 1,
  newBest: false,
  universe: 1, uniStartM: 0, maxUniverse: 1,
  zoneIdx: 0,
  shake: 0, flash: 0, scorePulse: 0,
  deathT: 0, overT: 0, message: '',
  banner: null,            // { title, sub, t, color }
  portal: null,            // { t, hole, sx, sy, switched }
  say: null, sayT: 6,
  lastKnockT: -99, lastGullT: -99,
  hint: 0,                 // seconds of "how to move" hints at the start of a run
  tiltWait: 0,             // seconds spent waiting for a first tilt reading
};

const player = {
  x: 200, y: 0, prevX: 200, prevY: 0, vx: 0, vy: 0,
  facing: 1,
  stretch: 0, stretchV: 0,      // squash & stretch spring (legs)
  hair: 0, hairV: 0,            // hair spring
  belly: 0, digestT: 0,
  chewT: 0, visorT: 0,          // munching, and the helmet visor flipped up
  helmet: 0, helmetOn: false,   // helmet drop-on animation 0..1
  rushT: 0, laserT: 0, bigBounces: 0, graceT: 0,
  ouchT: 0, blinkT: 2, beam: null,
  arms: 0,                      // arm pose: -1 down .. 1 up
};

function newPlatform(o) {
  return Object.assign({ x: 0, y: 0, w: 80, h: 14, role: 'standard', look: 'garden', vx: 0,
    broken: false, breakT: 0, squash: 0, squashV: 0, seed: Math.random() * 1000, t: Math.random() * 10,
    variant: 0, linger: 0 }, o);
}

function startGame() {
  game.state = 'play';
  game.time = 0;
  game.platforms = []; game.foods = []; game.hazards = []; game.gulls = []; game.holes = [];
  game.particles = []; game.bubbles = [];
  game.heightM = 0; game.foodScore = 0; game.score = 0; game.foodEaten = 0;
  game.newBest = false;
  game.universe = 1; game.uniStartM = 0; game.maxUniverse = 1;
  game.zoneIdx = 0;
  game.shake = 0; game.flash = 0; game.banner = null; game.portal = null;
  game.say = null; game.sayT = rand(6, 10);
  game.lastKnockT = -99; game.lastGullT = -99;
  game.gullT = rand(6, 10);
  game.hint = 4;
  game.tiltWait = 0;
  game.cam = -(H - 110); game.prevCam = game.cam;
  Object.assign(player, {
    x: W / 2, y: 0, vx: 0, vy: -jumpVel(), facing: 1,
    stretch: 0.3, stretchV: 0, hair: 0, hairV: 0,
    belly: 0, digestT: 0, chewT: 0, visorT: 0, helmet: 0, helmetOn: false,
    rushT: 0, laserT: 0, bigBounces: 0, graceT: 0, ouchT: 0, beam: null, arms: 0,
  });
  player.prevX = player.x; player.prevY = player.y;
  // the lawn: a full-width platform to start from
  game.platforms.push(newPlatform({ x: -30, y: 0, w: W + 60, h: 40, look: 'lawn' }));
  game.nextY = -40;
  game.lastHoleY = 0;
  generate();
  Music.start();
  Sound.meow();
}

// Keep the world filled in above the view.
function generate() {
  while (game.nextY > game.cam - 260) genStep();
}

function genStep() {
  const zones = theme().zones;
  const h = relHeight(game.nextY);
  const ws = zoneWeights(zones, h);
  const zi = weightedIndex(ws), zone = zones[zi], prof = zone.profile;
  const d = zoneDifficulty(zones, zi, h);
  // worst-case gravity here (the heaviest zone in the blend) and a full belly
  let gMax = 0;
  zones.forEach((z, i) => { if (ws[i] > 0) gMax = Math.max(gMax, z.gravityMul); });
  const safe = jumpHeight(gMax * universeCfg().gravityMul, CONFIG.belly.max);
  const gap = lerp(pval(prof.gapMin, d), pval(prof.gapMax, d), Math.random()) * safe;
  const prevY = game.nextY;
  game.nextY -= Math.max(28, gap);
  const y = game.nextY;

  // role
  const roles = ['standard', 'bouncy', 'moving', 'breakable'];
  let role = roles[weightedIndex(roles.map(r => pval(prof[r], d)))];
  let w = pval(prof.width, d) * rand(0.9, 1.1);
  let look = zone.look, variant = 0, vx = 0;

  // moving platforms: comets are fast, UFOs a bit slower
  if (role === 'moving') {
    let sp = pval(prof.moveSpeed, d) * rand(0.85, 1.15);
    if (look === 'deep') {
      variant = Math.random() < 0.45 ? 1 : 0;           // 0 comet, 1 UFO
      sp *= variant ? 0.8 : 2.3;
      if (variant) w = Math.max(w, 76);
    }
    if (look === 'sky') w = Math.max(w, 92);            // plane wings
    vx = sp * (Math.random() < 0.5 ? -1 : 1);
  }
  if (role === 'breakable') w *= 0.92;
  if (role === 'bouncy') w = Math.min(w, 66);

  // walkers (dogs and stray tomcats) patrol some platforms
  const walkerHere = zone.walkers.length && Math.random() < pval(prof.walker, d) &&
    (role === 'standard' || (role === 'moving' && zone.walkOnMoving));
  let wk = null;
  if (walkerHere) {
    wk = pick(zone.walkers);
    if (zone.walkOnMoving && role === 'moving') wk = 'tomcat';
    w = Math.max(w, wk === 'bulldog' ? 108 : 96);
  }

  w = Math.min(w, W - 20);
  let x = rand(8, W - w - 8);
  // keep platforms clear of black hole cores
  for (const bh of game.holes) {
    if (Math.abs(bh.y - y) < 110 && x < bh.x + 90 && x + w > bh.x - 90) x = bh.x > W / 2 ? rand(8, Math.max(8, bh.x - 100 - w)) : rand(Math.min(W - w - 8, bh.x + 100), W - w - 8);
  }
  const plat = newPlatform({ x, y, w, role, look, vx, variant });
  game.platforms.push(plat);

  if (wk) {
    game.hazards.push({ kind: wk, plat, off: rand(0.15, 0.85), dir: Math.random() < 0.5 ? -1 : 1,
      speed: wk === 'dog' ? 26 : wk === 'bulldog' ? 9 : 15, t: rand(0, 10), sayT: 0 });
  }

  // a decoy (extra) platform now and then, to fill the sky out
  if (gap > safe * 0.5 && Math.random() < 0.35) {
    const r2 = Math.random() < 0.6 ? 'breakable' : 'standard';
    const w2 = pval(prof.width, d) * 0.85, y2 = y + gap * rand(0.35, 0.65);
    let x2 = rand(8, W - w2 - 8);
    if (x2 < x + w + 10 && x2 + w2 > x - 10) x2 = x + w / 2 > W / 2 ? rand(8, Math.max(8, x - w2 - 10)) : rand(Math.min(W - w2 - 8, x + w + 10), W - w2 - 8);
    game.platforms.push(newPlatform({ x: x2, y: y2, w: w2, role: r2, look }));
  }

  // food floating between platforms
  if (Math.random() < CONFIG.foodChance) spawnFood(rand(30, W - 30), lerp(prevY, y, rand(0.35, 0.65)));

  // floating hazards (dogs in balloons, jetpack space dogs)
  if (zone.floater && Math.random() < pval(prof.floater, d)) {
    const fy = lerp(prevY, y, 0.5);
    game.hazards.push({ kind: zone.floater, x: rand(30, W - 30), y: fy, baseY: fy,
      vx: rand(25, 45) * (Math.random() < 0.5 ? -1 : 1), t: rand(0, 10), sayT: 0 });
  }

  // black holes
  const BH = CONFIG.blackHole;
  if (zone.blackHoles && y < game.lastHoleY - BH.minSpacing && Math.random() < BH.chance) {
    const by = y - gap * 0.5 - 60, bx = rand(70, W - 70);
    game.holes.push({ x: bx, y: by, t: rand(0, 10), seed: Math.random() * 100 });
    game.lastHoleY = by;
    // a little ring of food in orbit, to tempt him close
    const n = randInt(1, 3), a0 = rand(0, TAU);
    for (let i = 0; i < n; i++) {
      const a = a0 + i * TAU / n, r = rand(85, 130);
      spawnFood(clamp(bx + Math.cos(a) * r, 24, W - 24), by + Math.sin(a) * r * 0.8);
    }
  }
}

function spawnFood(x, y) {
  const list = theme().foods;
  const kind = list[weightedIndex(list.map(f => f[1]))][0];
  game.foods.push({ kind, x, y, t: rand(0, 10), eaten: false, stolen: null });
}

// Throw away things that have fallen far below the view.
function cull() {
  const bottom = game.cam + H + 120;
  game.platforms = game.platforms.filter(p => p.y < bottom && !(p.broken && p.breakT > 1.2));
  game.foods = game.foods.filter(f => f.y < bottom && !f.eaten);
  game.hazards = game.hazards.filter(hz => (hz.plat ? game.platforms.includes(hz.plat) : hz.y < bottom + 80));
  game.holes = game.holes.filter(bh => bh.y < bottom + 200);
  game.bubbles = game.bubbles.filter(b => b.t < b.max);
}

/* --- particles --- */
function addParticle(p) {
  if (game.particles.length > 450) game.particles.shift();
  game.particles.push(p);
}
function emitDust(x, y, count, color = '#fff6e8', spread = 1) {
  for (let i = 0; i < count; i++) {
    const a = rand(Math.PI * 0.95, Math.PI * 2.05), sp = rand(40, 140) * spread;
    addParticle({ type: 'dust', x: x + rand(-14, 14), y: y + rand(-2, 2), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.4,
      r0: rand(3, 5), r1: rand(8, 13), life: 0, max: rand(0.35, 0.6), color });
  }
}
function emitCrumbs(x, y, count, colors, gravity = 700) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, TAU), sp = rand(60, 230);
    addParticle({ type: 'crumb', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100, g: gravity,
      r0: rand(1.5, 3.5), rot: rand(0, TAU), vr: rand(-12, 12), life: 0, max: rand(0.5, 1.0), color: pick(colors) });
  }
}
function emitStars(x, y, count, colors = ['#ffe066', '#fff3b0', '#ffb3c7']) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, TAU), sp = rand(120, 320);
    addParticle({ type: 'star', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120,
      r0: rand(4, 8), rot: rand(0, TAU), vr: rand(-10, 10), life: 0, max: rand(0.6, 1.1), color: pick(colors) });
  }
}
function emitSparkles(x, y, count, colors = ['#fff', '#ffe066', '#9be564']) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, TAU), sp = rand(60, 220);
    addParticle({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r0: rand(1.5, 3.5), life: 0, max: rand(0.35, 0.7), color: pick(colors) });
  }
}
function emitFeathers(x, y, count) {
  for (let i = 0; i < count; i++) {
    addParticle({ type: 'feather', x: x + rand(-8, 8), y: y + rand(-6, 6), vx: rand(-90, 90), vy: rand(-140, -20),
      rot: rand(0, TAU), vr: rand(-4, 4), life: 0, max: rand(0.9, 1.5), r0: rand(4, 6) });
  }
}
function popText(text, x, y, opts = {}) {
  addParticle({ type: 'text', text, x, y, vx: opts.vx || 0, vy: opts.vy ?? -50,
    size: opts.size || 20, color: opts.color || '#ffe066', rot: opts.rot ?? rand(-0.2, 0.2),
    life: 0, max: opts.max || 0.9, screen: !!opts.screen, sub: opts.sub || '' });
}

function updateParticles(dt) {
  const ps = game.particles;
  let j = 0;
  for (let i = 0; i < ps.length; i++) {
    const q = ps[i];
    q.life += dt;
    if (q.life >= q.max) continue;
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.type === 'dust') { q.vx *= 1 - 4 * dt; q.vy *= 1 - 4 * dt; }
    else if (q.type === 'crumb') { q.vy += q.g * dt; q.rot += q.vr * dt; }
    else if (q.type === 'star') { q.vy += 700 * dt; q.rot += q.vr * dt; }
    else if (q.type === 'spark') { q.vx *= 1 - 3 * dt; q.vy *= 1 - 3 * dt; }
    else if (q.type === 'feather') { q.vx *= 1 - 2 * dt; q.vy = q.vy * (1 - 2 * dt) + 60 * dt; q.rot += q.vr * dt; q.x += Math.sin(q.life * 6) * 30 * dt; }
    else if (q.type === 'text') { q.vy *= 1 - 1.8 * dt; }
    ps[j++] = q;
  }
  ps.length = j;
}

// A speech bubble attached to something in the world (or to him).
function speak(text, target, opts = {}) {
  game.bubbles = game.bubbles.filter(b => b.target !== target);
  game.bubbles.push({ text, target, t: 0, max: opts.max || 2.2, color: opts.color || '#6a3f8a' });
}

/* ---------------------------------------------------------------------
   8. INPUT — arrow keys / A-D, drag to steer on touch screens, or phone tilt
   --------------------------------------------------------------------- */
const input = { keys: new Set(), pointers: new Map() };   // pointer id -> finger x (view units)
const LEFT_KEYS = new Set(['ArrowLeft', 'KeyA']), RIGHT_KEYS = new Set(['ArrowRight', 'KeyD']);
const START_KEYS = new Set(['Space', 'Enter', 'ArrowUp', 'KeyW']);
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// Tilt. iPhones need permission, which must be asked from a tap, so a tap
// "arms" the request on the way down and it's made on the way up.
const tilt = {
  supported: typeof window.DeviceOrientationEvent !== 'undefined',
  needsPermission: typeof window.DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function',
  wanted: store.get('pieSky.tilt', '0') === '1',
  listening: false, seen: false, value: 0, armed: false, denied: false,
};
function onOrient(e) {
  if (e.gamma == null) return;
  tilt.seen = true;
  let ang = 0;
  if (screen.orientation && typeof screen.orientation.angle === 'number') ang = screen.orientation.angle;
  else if (typeof window.orientation === 'number') ang = window.orientation;
  let a = e.gamma;
  if (ang === 90) a = e.beta; else if (ang === -90 || ang === 270) a = -e.beta; else if (ang === 180) a = -e.gamma;
  const C = CONFIG, m = Math.abs(a);
  tilt.value = m < C.tiltDeadzone ? 0 : Math.sign(a) * clamp((m - C.tiltDeadzone) / (C.tiltFullAngle - C.tiltDeadzone), 0, 1);
}
function listenTilt() {
  if (!tilt.listening) {
    window.addEventListener('deviceorientation', onOrient);
    tilt.listening = true;
  }
  // a working sensor sends readings straight away; if none come, say so
  setTimeout(() => { if (tilt.wanted && !tilt.seen) tiltUnavailable(); }, 2500);
}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isBrave = !!(navigator.brave && typeof navigator.brave.isBrave === 'function');
function tiltMessage(lines) {
  lines.forEach((l, i) => popText(l, W / 2, H * 0.6 + i * 22, { screen: true, size: 15, color: '#ff8fab', rot: 0, max: 5, vy: -4 }));
}
function requestTilt() {
  if (!tilt.supported) return;
  if (!tilt.needsPermission) { listenTilt(); return; }
  // iPhones: this must run inside a touchend or click, or Safari refuses
  // without even asking.
  let ask;
  try { ask = DeviceOrientationEvent.requestPermission(); } catch (e) { listenTilt(); return; }
  ask.then(r => {
    if (r === 'granted') { tilt.denied = false; listenTilt(); }
    else if (isIOS) tiltRefused(true);
    else listenTilt();                     // other browsers say 'denied' without asking: see if readings come anyway
  }).catch(() => listenTilt());            // couldn't even ask: listen anyway, and see if readings come
}
// answered: the person said no (Safari remembers that until it's closed);
// otherwise the browser wouldn't even ask, which happens when the game is
// shown inside another page.
function tiltRefused(answered) {
  tilt.denied = true; tilt.wanted = false; store.set('pieSky.tilt', '0');
  tiltMessage(answered
    ? ['Motion access was turned down.', 'Close Safari fully and reopen to be asked again.']
    : ["This page can't use tilt.", 'Open the game on its own page to tilt.']);
}
// Some browsers (and games shown inside another page) never send tilt
// readings at all. If nothing arrives, say so and fall back to dragging.
function tiltUnavailable() {
  if (!tilt.wanted) return;
  tilt.wanted = false; store.set('pieSky.tilt', '0');
  if (isBrave) tiltMessage(['Brave blocks tilt for privacy.', 'Use Chrome to tilt, or drag to steer.']);
  else if (window.self !== window.top) tiltMessage(["This page can't use tilt.", 'Open the game on its own page to tilt.']);
  else tiltMessage(["No tilt readings from this browser.", 'Drag your thumb to steer instead.']);
}
function toggleTilt() {
  tilt.wanted = !tilt.wanted;
  store.set('pieSky.tilt', tilt.wanted ? '1' : '0');
  Sound.click();
  if (tilt.wanted) tilt.armed = true;
}

function moveInput() {
  let k = 0;
  for (const c of input.keys) { if (LEFT_KEYS.has(c)) k -= 1; if (RIGHT_KEYS.has(c)) k += 1; }
  if (k) return clamp(k, -1, 1);
  if (input.pointers.size) {
    // steer towards the (latest) finger, easing off as he gets close
    let fx = 0; for (const v of input.pointers.values()) fx = v;
    const d = fx - player.x;
    if (Math.abs(d) < CONFIG.dragDeadzone) return 0;
    return clamp(d / CONFIG.dragEase, -1, 1);
  }
  if (tilt.wanted && tilt.listening) return tilt.value;
  return 0;
}

function pointerToView(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
const MUTE_BTN = { r: 20, get x() { return W - 30; }, y: 24 };
const MUSIC_BTN = { r: 20, get x() { return W - 72; }, y: 24 };
function inMuteButton(x, y) { return Math.hypot(x - MUTE_BTN.x, y - MUTE_BTN.y) < MUTE_BTN.r + 6; }
function inMusicButton(x, y) { return Math.hypot(x - MUSIC_BTN.x, y - MUSIC_BTN.y) < MUSIC_BTN.r + 2; }
function toggleMute() { Sound.setMuted(!Sound.muted); if (!Sound.muted) Sound.click(); }
function toggleMusic() { Music.toggle(); Sound.click(); }

function pressStart() {
  if (game.state === 'title') startGame();
  else if (game.state === 'over' && game.overT > 0.6) startGame();
}

window.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  e.preventDefault();
  Sound.unlock();
  const v = pointerToView(e);
  if (inMuteButton(v.x, v.y)) { toggleMute(); return; }
  if (inMusicButton(v.x, v.y)) { toggleMusic(); return; }
  if (hitButton(v)) return;
  if (tilt.wanted && !tilt.listening) tilt.armed = true;           // ask for tilt on the way up
  if (game.state === 'play' || game.state === 'portal') input.pointers.set(e.pointerId, v.x);
  else pressStart();
}, { passive: false });
window.addEventListener('pointermove', e => {
  if (!input.pointers.has(e.pointerId)) return;
  const v = pointerToView(e);
  input.pointers.set(e.pointerId, v.x);
});
// Ask for tilt when the tap ends. On touch screens that has to happen in
// touchend (Safari doesn't count pointerup as a tap for this).
function askTiltIfArmed() {
  if (tilt.armed) { tilt.armed = false; if (tilt.wanted) requestTilt(); }
  if (install.armed) { install.armed = false; installApp(); }
}
const pointerUp = e => {
  Sound.unlock();
  if (e.pointerType !== 'touch') askTiltIfArmed();
  input.pointers.delete(e.pointerId);
};
window.addEventListener('pointerup', pointerUp);
window.addEventListener('pointercancel', pointerUp);

window.addEventListener('keydown', e => {
  if (e.code === 'KeyM') { Sound.unlock(); toggleMute(); return; }
  if (e.code === 'KeyN') { Sound.unlock(); toggleMusic(); return; }
  if (e.code === 'Escape' && game.state === 'over') { goToMenu(); return; }
  if (LEFT_KEYS.has(e.code) || RIGHT_KEYS.has(e.code)) {
    e.preventDefault();
    input.keys.add(e.code);
    if (game.state === 'title' && !e.repeat) { Sound.unlock(); startGame(); }
    return;
  }
  if (START_KEYS.has(e.code)) {
    e.preventDefault();
    if (e.repeat) return;
    Sound.unlock();
    pressStart();
  }
});
window.addEventListener('keyup', e => input.keys.delete(e.code));

// Stop the page from scrolling, zooming or showing menus on mobile.
['touchstart', 'touchmove', 'gesturestart', 'dblclick', 'contextmenu'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchend', () => { Sound.unlock(); askTiltIfArmed(); }, { passive: true });

function releaseAll() { input.pointers.clear(); input.keys.clear(); }
window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) releaseAll();
  lastTime = performance.now();
});

/* ---------------------------------------------------------------------
   9. UPDATE — runs at a fixed timestep
   --------------------------------------------------------------------- */
const approach = (v, target, amt) => (v < target ? Math.min(target, v + amt) : Math.max(target, v - amt));
const BODY_H = 48;                                  // feet to top of head (px)
const bodyY = () => player.y - BODY_H / 2;
// Shortest horizontal distance on a wrapping screen.
function wrapDX(a, b) { let d = b - a; if (d > W / 2) d -= W; else if (d < -W / 2) d += W; return d; }

function updateSprings(dt) {
  const p = player;
  const target = clamp(-p.vy / jumpVel() * 0.1, -0.04, 0.12);
  p.stretchV += ((target - p.stretch) * 120 - p.stretchV * 18) * dt;
  p.stretch += p.stretchV * dt;
  p.hairV += (-p.hair * 140 - p.hairV * 12) * dt;
  p.hair += p.hairV * dt;
  p.arms = lerp(p.arms, clamp(-p.vy / jumpVel(), -1, 1), Math.min(1, dt * 4));
  p.blinkT -= dt;
  if (p.blinkT < -0.12) p.blinkT = rand(2, 5);
  if (p.helmetOn && p.helmet < 1) p.helmet = Math.min(1, p.helmet + dt / 0.7);
  p.chewT = Math.max(0, p.chewT - dt);
  p.visorT = Math.max(0, p.visorT - dt);
  p.ouchT = Math.max(0, p.ouchT - dt);
}

function step(dt) {
  game.time += dt;
  game.prevCam = game.cam;
  player.prevX = player.x; player.prevY = player.y;
  updateParticles(dt);
  for (const b of game.bubbles) b.t += dt;
  game.shake = Math.max(0, game.shake - dt * 30);
  game.flash = Math.max(0, game.flash - dt * 1.6);
  game.scorePulse = Math.max(0, game.scorePulse - dt * 4);
  if (game.banner) { game.banner.t += dt; if (game.banner.t > 2.8) game.banner = null; }
  switch (game.state) {
    case 'title': updateTitle(dt); break;
    case 'play': updatePlay(dt); break;
    case 'portal': updatePortal(dt); break;
    case 'dying': updateDying(dt); break;
    case 'over': game.overT += dt; updateSprings(dt); break;
  }
}

// Title screen: he bounces on the lawn while the menu shows.
function setupTitle() {
  game.state = 'title';
  game.universe = 1; game.uniStartM = 0;
  game.platforms = [newPlatform({ x: -30, y: 0, w: W + 60, h: 40, look: 'lawn' })];
  game.foods = []; game.hazards = []; game.gulls = []; game.holes = []; game.bubbles = [];
  game.cam = game.prevCam = -(H - 92);
  Object.assign(player, { x: W / 2, y: 0, vx: 0, ex: 0, vy: 0, facing: 1, belly: 0, helmetOn: false, helmet: 0,
    rushT: 0, laserT: 0, bigBounces: 0, beam: null, chewT: 0, ouchT: 0 });
  player.prevX = player.x; player.prevY = player.y;
}
function updateTitle(dt) {
  const p = player;
  p.vy += CONFIG.gravity * dt;
  p.y += p.vy * dt;
  if (p.y >= 0) {
    p.y = 0; p.vy = -400;
    p.stretch = -0.22; p.stretchV = 0; p.hairV += 3;
    emitDust(p.x, 0, 2, '#d8d2d8', 0.5);
  }
  if (Math.random() < dt * 0.12) p.facing = -p.facing;
  updateSprings(dt);
}

function goToMenu() {
  if (game.state === 'over' && game.overT < 0.3) return;
  setupTitle();
  Music.start();
  Sound.click();
}

function updatePlay(dt) {
  const p = player, C = CONFIG;
  if (game.hint > 0) game.hint -= dt;
  if (tilt.wanted && tilt.listening && !tilt.seen) { game.tiltWait += dt; if (game.tiltWait > 2.5) tiltUnavailable(); }
  const hRel = relHeight(p.y);
  const g = C.gravity * gravityMulAt(hRel) * (1 + p.belly * C.belly.gravityPerLevel);

  // --- sideways movement ---
  const dir = moveInput();
  const maxV = C.moveSpeed * (p.rushT > 0 ? C.rushSideMul : 1);
  p.vx = dir ? approach(p.vx, dir * maxV, C.moveAccel * dt) : approach(p.vx, 0, C.moveDecel * dt);
  p.ex = (p.ex || 0) * Math.exp(-C.airDrag * dt);          // knocks and black-hole flings fade away
  if (Math.abs(p.vx + p.ex) > 25) p.facing = Math.sign(p.vx + p.ex);

  // --- vertical ---
  if (p.beam) updateBeam(dt);
  else if (p.laserT > 0) updateLaser(dt);
  else if (p.rushT > 0) {
    p.rushT -= dt;
    p.vy = -C.rushSpeed;
    if (Math.random() < dt * 40) {
      const colors = ['#5fd068', '#9be564', '#d8ff7a', '#fff'];
      addParticle({ type: 'dust', x: p.x + rand(-6, 6), y: p.y + 4, vx: rand(-40, 40), vy: rand(80, 200), r0: rand(4, 6), r1: rand(10, 16), life: 0, max: rand(0.3, 0.5), color: pick(colors) });
    }
    if (p.rushT <= 0) p.vy = -C.rushSpeed * 0.5;
  } else {
    p.vy = Math.min(p.vy + g * dt, C.maxFallSpeed);
  }

  // --- black holes ---
  let hum = 0;
  const BH = C.blackHole;
  for (const bh of game.holes) {
    const dx = wrapDX(p.x, bh.x), dy = bh.y - bodyY(), dist = Math.hypot(dx, dy) || 1;
    if (dist > BH.pullRadius) continue;
    const k = 1 - dist / BH.pullRadius;
    hum = Math.max(hum, k);
    let a = BH.pull * k * k;
    if (dist < 75) a += 2600 * (1 - dist / 75);        // the point of no return
    p.ex += dx / dist * a * dt;
    if (!p.rushT && !p.laserT) p.vy += dy / dist * a * BH.verticalPull * dt * (dist < 75 ? 2.5 : 1);
    if (dist < BH.coreRadius) { enterPortal(bh); return; }
  }
  game.humAcc = (game.humAcc || 0) + dt;
  if (game.humAcc > 0.05) { game.humAcc = 0; Sound.setHum(hum); }

  // --- move ---
  const prevFeet = p.y;
  p.x += (p.vx + p.ex) * dt;
  p.y += p.vy * dt;
  if (p.x < 0) { p.x += W; p.prevX = p.x; }
  else if (p.x >= W) { p.x -= W; p.prevX = p.x; }

  updatePlatforms(dt);

  // --- landing ---
  if (p.vy > 0 && !p.beam && p.rushT <= 0 && p.laserT <= 0) {
    for (const pl of game.platforms) {
      if (pl.broken || pl.leaving) continue;
      if (prevFeet <= pl.y + 3 && p.y >= pl.y && p.x > pl.x - 12 && p.x < pl.x + pl.w + 12) { land(pl); break; }
    }
  }

  updateFood(dt);
  updateHazards(dt);
  updateGulls(dt);
  for (const bh of game.holes) bh.t += dt;
  updateSprings(dt);
  p.graceT = Math.max(0, p.graceT - dt);

  // digestion
  if (p.belly > 0) {
    p.digestT += dt;
    if (p.digestT >= C.belly.digestSeconds) {
      p.digestT = 0; p.belly--;
      Sound.burp();
      popText('BURP!', p.x + p.facing * 16, p.y - 56, { size: 18, color: '#d8ff7a', vx: p.facing * 30 });
      addParticle({ type: 'dust', x: p.x + p.facing * 12, y: p.y - 52, vx: p.facing * 60, vy: -20, r0: 4, r1: 14, life: 0, max: 0.6, color: '#e8f5c8' });
    }
  } else p.digestT = 0;

  // --- camera & score ---
  const target = p.y - BODY_H / 2 - H * 0.42;
  if (target < game.cam) game.cam = target;
  const m = toMetres(p.y);
  if (m > game.heightM) game.heightM = m;
  const newScore = Math.floor(game.heightM) + game.foodScore;
  game.score = newScore;
  checkZone();

  // little things he says
  game.sayT -= dt;
  if (game.sayT <= 0) { game.sayT = rand(14, 24); speak(pick(SAYINGS[themeId()]), 'player'); }

  generate();
  cull();

  // fell off the bottom?
  if (p.y - BODY_H > game.cam + H) die();
}

// Laser pointer: a red dot zips up the screen, weaving side to side,
// and he can't help but chase it.
function updateLaser(dt) {
  const p = player, C = CONFIG, d = game.dot;
  p.laserT -= dt;
  d.t += dt;
  d.x = W / 2 + Math.sin(d.t * 2.1 + d.phase) * W * 0.3 + Math.sin(d.t * 5.3) * 18;
  d.y = p.y - BODY_H - C.laserLead;
  p.x += wrapDX(p.x, d.x) * Math.min(1, dt * 6);
  p.vx = 0;
  if (Math.abs(wrapDX(p.x, d.x)) > 6) p.facing = Math.sign(wrapDX(p.x, d.x));
  p.vy = -C.laserSpeed;
  if (Math.random() < dt * 30) addParticle({ type: 'dust', x: p.x + rand(-6, 6), y: p.y + 4, vx: rand(-40, 40), vy: rand(80, 200), r0: rand(3, 5), r1: rand(8, 12), life: 0, max: rand(0.3, 0.5), color: pick(['#fff', '#ffd1d6', '#ff8a94']) });
  if (p.laserT <= 0) {
    p.laserT = 0; p.vy = -C.laserSpeed * 0.45;
    Sound.tone(1200, 0.08, 'square', 0.05);
    emitSparkles(d.x, d.y, 8, [EFFECT_COLORS.laser, '#fff']);
    speak(pick(['Where did it go?!', 'I nearly had it!', 'Next time, dot.', 'It was RIGHT there.']), 'player');
  }
}

function updatePlatforms(dt) {
  for (const pl of game.platforms) {
    pl.t += dt;
    if (pl.broken) { pl.breakT += dt; pl.fallV = (pl.fallV || 0) + 900 * dt; pl.y += pl.fallV * dt; continue; }
    if (pl.vx) {
      pl.x += pl.vx * dt;
      if (!pl.leaving) {
        if (pl.x < 4) { pl.x = 4; pl.vx = Math.abs(pl.vx); }
        else if (pl.x + pl.w > W - 4) { pl.x = W - 4 - pl.w; pl.vx = -Math.abs(pl.vx); }
      }
    }
    if (pl.leaving) { pl.y -= 160 * dt; pl.vx *= 1 + dt * 2; }
    if (pl.role === 'bouncy') { pl.squashV += (-pl.squash * 320 - pl.squashV * 10) * dt; pl.squash += pl.squashV * dt; }
    // UFOs: hang about near one for too long and it switches on its tractor beam
    if (pl.look === 'deep' && pl.role === 'moving' && pl.variant === 1 && !pl.leaving) {
      const cx = pl.x + pl.w / 2;
      if (Math.hypot(wrapDX(player.x, cx), pl.y - bodyY()) < 170) pl.linger += dt;
      else pl.linger = Math.max(0, pl.linger - dt * 0.5);
      if (pl.linger > 1.5 && !pl.beamOn) { pl.beamOn = true; pl.beamT = 0; Sound.zap(); speak(pick(['Bleep?', 'Specimen detected!', 'Ooh, a fluffy one!']), pl, { color: '#2f8a4a' }); }
      if (pl.beamOn) {
        pl.beamT += dt;
        const p = player, by = p.y - 30;
        const inCone = by > pl.y + 4 && by < pl.y + 280 && Math.abs(wrapDX(cx, p.x)) < 16 + (by - pl.y) * 0.32;
        if (inCone && !p.beam && game.state === 'play') { p.beam = { plat: pl, t: 0 }; p.rushT = 0; p.laserT = 0; Sound.zap(); }
        if (pl.beamT > 2.4 && !p.beam) { pl.leaving = true; pl.vx = (Math.random() < 0.5 ? -1 : 1) * 380; Sound.tone(500, 0.6, 'sine', 0.1, 0, 1800); }
      }
    }
  }
}

// Caught in a UFO's tractor beam: hauled up, inspected, then dropped.
function updateBeam(dt) {
  const p = player, b = p.beam, pl = b.plat;
  b.t += dt;
  const cx = pl.x + pl.w / 2;
  p.x += wrapDX(p.x, cx) * Math.min(1, dt * 5);
  p.vy = 0;
  p.y = lerp(p.y, pl.y + 76, Math.min(1, dt * 4));
  p.ex = 0; p.vx = 0;
  if (Math.random() < dt * 20) emitSparkles(p.x + rand(-14, 14), p.y - rand(0, 60), 1, ['#9be564', '#d8ff7a', '#fff']);
  if (b.t > 1.2) {
    p.beam = null;
    p.vy = 260; p.graceT = 0.5;
    pl.leaving = true; pl.beamOn = false; pl.vx = (Math.random() < 0.5 ? -1 : 1) * 380;
    speak(pick(['Wrong species!', 'Too fluffy!', 'Put it back.', 'Smells of fish.']), pl, { color: '#2f8a4a' });
    Sound.tone(600, 0.5, 'sine', 0.1, 0, 1800);
    game.shake = 4;
  }
}

function land(pl) {
  const p = player, C = CONFIG;
  let mul = 1;
  if (pl.role === 'bouncy') {
    mul = C.bouncyMul;
    pl.squash = 1; pl.squashV = 0;
    Sound.spring();
    emitSparkles(p.x, pl.y, 8, ['#ff8fc8', '#fff', '#ffd1e8']);
  } else Sound.bounce();
  if (p.bigBounces > 0) {
    mul *= C.bigBounceMul;
    p.bigBounces--;
    emitStars(p.x, pl.y, 5, ['#9be564', '#d8ff7a', '#fff']);
  }
  p.vy = -jumpVel() * mul;
  p.y = pl.y;
  p.stretch = -0.25; p.stretchV = 0;
  p.hairV += 4;
  emitDust(p.x, pl.y, 3, dustColor(pl), 0.7);
  if (pl.role === 'breakable') {
    pl.broken = true; pl.fallV = 0;
    Sound.crumble();
    emitCrumbs(pl.x + pl.w / 2, pl.y + 4, 14, crumbColors(pl), 900);
  }
  if (pl.role === 'moving' && pl.look === 'deep' && pl.variant === 1) pl.linger += 0.35;
}

function dustColor(pl) {
  return { lawn: '#d8d2d8', garden: '#e8e2d6', sky: '#ffffff', edge: '#e6ecff', deep: '#c9b8e8', yarn: '#ffd1e8', dog: '#e8f5d0' }[pl.look] || '#fff';
}
function crumbColors(pl) {
  switch (pl.look) {
    case 'garden': return ['#6b4a2e', '#8a6340', '#4f3520'];
    case 'sky': return ['#ffffff', '#e6e0f5', '#cfc2ea'];
    case 'edge': return ['#3f6fc4', '#7ad3ff', '#c0c8d8'];
    case 'deep': return ['#bfe6ff', '#8fc4e8', '#ffffff'];
    case 'yarn': return ['#e85a8a', '#ffd65a', '#8a6ad0'];
    case 'dog': return ['#d9a868', '#b8844a', '#f3dcb4'];
  }
  return ['#fff'];
}

function updateFood(dt) {
  const p = player, by = bodyY();
  for (const f of game.foods) {
    f.t += dt;
    if (f.eaten) continue;
    const dx = wrapDX(p.x, f.x), dy = f.y - by;
    if (dx * dx + dy * dy < 36 * 36) eat(f);
  }
}

function eat(f) {
  const p = player, C = CONFIG, def = FOODS[f.kind];
  f.eaten = true;
  if (def.toy) { grabToy(f, def); return; }
  p.lastFood = f.kind;
  const pts = Math.round(C.foodPoints * (1 + p.belly * C.belly.bonusPerLevel));
  p.belly = Math.min(C.belly.max, p.belly + 1);
  p.digestT = 0;
  game.foodScore += pts;
  game.foodEaten++;
  game.scorePulse = 1;
  p.chewT = 0.7;
  if (p.helmetOn && themeId() === 'human') { p.visorT = 1.0; Sound.visor(); }
  if (def.liquid) Sound.slurp(); else Sound.crunch();
  const floaty = p.helmetOn ? -40 : 700;                       // in space the crumbs float off
  emitCrumbs(f.x, f.y, 12, foodCrumbColors(f.kind), floaty);
  popText(def.name, f.x, f.y - 14, { size: 15, color: '#fff', sub: `+${pts}`, max: 1.1 });
  popText(pick(def.liquid ? SLURP_WORDS : MUNCH_WORDS), p.x + p.facing * 24, p.y - 70, { size: 16, color: '#ffe066', vx: p.facing * 20 });
  if (def.effect === 'rush') {
    p.rushT = C.rushTime; p.vy = -C.rushSpeed;
    Sound.rush(); game.shake = 4;
    popText('CATNIP ZOOMIES!', W / 2, H * 0.3, { screen: true, size: 26, color: EFFECT_COLORS.rush, rot: 0, max: 1.2 });
  } else if (def.effect === 'bounce') {
    p.bigBounces = C.bigBounces;
    Sound.power();
    popText(`BIG BOUNCE x${C.bigBounces}`, W / 2, H * 0.3, { screen: true, size: 24, color: EFFECT_COLORS.bounce, rot: 0, max: 1.2 });
  }
  if (def.effect) emitSparkles(p.x, bodyY(), 10, [EFFECT_COLORS[def.effect], '#fff']);
  if (p.belly === C.belly.max) {
    speak(pick(['I may need a bigger collar.', 'Room for one more... maybe.', 'Oof. Worth it.']), 'player');
    popText('STUFFED! Jumps are lower', W / 2, H * 0.4, { screen: true, size: 20, color: BELLY_COLORS[5], rot: 0, max: 1.6 });
  } else if (p.belly === 3) {
    popText('Getting heavy...', W / 2, H * 0.4, { screen: true, size: 18, color: BELLY_COLORS[3], rot: 0, max: 1.3 });
  }
}

// Toys aren't eaten, so they don't fill the belly.
function grabToy(f, def) {
  const p = player, C = CONFIG;
  if (def.effect === 'laser') {
    p.laserT = C.laserTime; p.rushT = 0; p.vy = -C.laserSpeed;
    game.dot = { x: p.x, y: p.y - BODY_H - C.laserLead, t: 0, phase: Math.asin(clamp((p.x - W / 2) / (W * 0.3), -1, 1)) };
    Sound.laser(); game.shake = 3;
    popText('LASER CHASE!', W / 2, H * 0.3, { screen: true, size: 26, color: EFFECT_COLORS.laser, rot: 0, max: 1.2 });
    popText(pick(['THE DOT!', 'MINE!', '!!!']), p.x + p.facing * 24, p.y - 70, { size: 16, color: '#ffe066', vx: p.facing * 20 });
    emitSparkles(p.x, bodyY(), 10, [EFFECT_COLORS.laser, '#fff']);
  }
}

function foodCrumbColors(kind) {
  if (kind === 'catnip') return ['#5aa04a', '#9be564', '#c8a878'];
  return ['#9fc4dc', '#e8f2f8', '#6a90b0'];                     // fish
}

// Dogs, tomcats & co.: where they are, and their hitbox [x, y, w, h].
function hazardPos(hz) {
  if (hz.plat) return { x: hz.plat.x + hz.off * hz.plat.w, y: hz.plat.y };
  return { x: hz.x, y: hz.y };
}
function hazardBox(hz) {
  const q = hazardPos(hz);
  switch (hz.kind) {
    case 'dog': return [q.x - 15, q.y - 24, 30, 24];
    case 'bulldog': return [q.x - 20, q.y - 28, 40, 28];
    case 'tomcat': return [q.x - 13, q.y - 30, 26, 30];
    case 'dogballoon': return [q.x - 18, q.y - 46, 36, 70];
    default: return [q.x - 18, q.y - 20, 36, 38];      // space dog
  }
}
function updateHazards(dt) {
  const p = player;
  for (const hz of game.hazards) {
    hz.t += dt;
    if (hz.plat) {
      if (hz.plat.broken || hz.plat.leaving) { hz.gone = true; continue; }
      hz.off += hz.dir * hz.speed * dt / hz.plat.w;
      if (hz.off < 0.12) { hz.off = 0.12; hz.dir = 1; } else if (hz.off > 0.88) { hz.off = 0.88; hz.dir = -1; }
    } else {
      hz.x += hz.vx * dt;
      if (hz.x < 24) { hz.x = 24; hz.vx = Math.abs(hz.vx); } else if (hz.x > W - 24) { hz.x = W - 24; hz.vx = -Math.abs(hz.vx); }
      hz.y = hz.baseY + Math.sin(hz.t * 1.4) * 12;
      hz.dir = Math.sign(hz.vx);
    }
    if (p.graceT > 0 || p.rushT > 0 || p.laserT > 0 || p.beam) continue;
    const [bx, byy, bw, bh] = hazardBox(hz);
    const px = p.x;
    const overlapX = Math.abs(wrapDX(px, bx + bw / 2)) < bw / 2 + 9;
    if (overlapX && p.y > byy && p.y - BODY_H < byy + bh) knock(hz);
  }
  game.hazards = game.hazards.filter(hz => !hz.gone);
}

function knock(hz) {
  const p = player, C = CONFIG, q = hazardPos(hz);
  const side = wrapDX(q.x, p.x) < 0 ? -1 : 1;
  speak(pick(GRUMBLES[hz.kind] || GRUMBLES.dog), hz);
  Sound.grumble();
  p.vy = Math.max(p.vy, C.knockDown);
  p.ex = side * C.knockSide;
  p.graceT = C.knockGrace;
  p.ouchT = 0.8;
  p.rushT = 0;
  p.laserT = 0;
  game.shake = 9;
  game.lastKnockT = game.time;
  Sound.knock(); Sound.meow(0.14);
  emitStars(p.x, p.y - 60, 6);
  popText(pick(['MEW!', 'MROW!', 'HISS!', 'OW!']), p.x, p.y - 84, { size: 18, color: '#ff8fab' });
}

/* --- seagulls: they swoop in and nick his food --- */
function updateGulls(dt) {
  const p = player, C = CONFIG;
  // spawning
  game.gullT -= dt;
  if (game.gullT <= 0) {
    game.gullT = 1;
    const zones = theme().zones, h = relHeight(p.y), zi = zoneIndexAt(zones, h);
    const rate = pval(zones[zi].profile.gull, zoneDifficulty(zones, zi, h));
    if (h > 60 && game.gulls.length < 2 && Math.random() < rate) {
      const side = Math.random() < 0.5 ? -1 : 1;
      game.gulls.push({ x: side < 0 ? -30 : W + 30, y: game.cam + rand(40, H * 0.4), vx: -side * 60, vy: 0,
        state: 'hunt', target: null, t: 0, carry: null, dir: -side });
      Sound.squawk();
    }
  }
  for (const gl of game.gulls) {
    gl.t += dt;
    if (gl.state === 'hunt') {
      // nearest food on screen, or him
      if (!gl.target || gl.target.eaten) {
        let best = null, bd = 1e9;
        for (const f of game.foods) {
          if (f.eaten || f.y < game.cam || f.y > game.cam + H) continue;
          const d = Math.hypot(f.x - gl.x, f.y - gl.y);
          if (d < bd) { bd = d; best = f; }
        }
        gl.target = best || 'player';
      }
      const tx = gl.target === 'player' ? p.x : gl.target.x;
      const ty = gl.target === 'player' ? bodyY() : gl.target.y;
      const dx = tx - gl.x, dy = ty - gl.y, d = Math.hypot(dx, dy) || 1;
      const sp = C.gullSpeed * (gl.target === 'player' ? 1 : 1.2);
      gl.vx = approach(gl.vx, dx / d * sp, 420 * dt);
      gl.vy = approach(gl.vy, dy / d * sp + Math.sin(gl.t * 5) * 40, 420 * dt);
      if (gl.target !== 'player' && d < 16) {
        gl.target.eaten = true; gl.carry = gl.target.kind;
        gl.state = 'flee';
        Sound.squawk();
        speak(pick(GULL_LINES), gl, { color: '#c2335a' });
      }
      if (gl.t > 8) gl.state = 'flee';
    } else if (gl.state === 'flee') {
      gl.vx = approach(gl.vx, gl.dir * 240, 300 * dt);
      gl.vy = approach(gl.vy, -140, 300 * dt);
    } else if (gl.state === 'bopped') {
      gl.vy += 900 * dt; gl.vx *= 1 - dt;
    }
    gl.x += gl.vx * dt; gl.y += gl.vy * dt;
    if (Math.abs(gl.vx) > 20) gl.dir = Math.sign(gl.vx);

    // touching him
    if (gl.state === 'bopped' || p.beam) continue;
    const dx = wrapDX(p.x, gl.x), dy = gl.y - bodyY();
    if (Math.abs(dx) < 26 && Math.abs(dy) < 34) {
      if (p.vy > 0 && p.y < gl.y + 8) {                 // landed on its head: BOP
        gl.state = 'bopped'; gl.vy = 100;
        p.vy = -jumpVel() * 0.95; p.stretch = -0.25; p.hairV += 4;
        game.foodScore += C.bopPoints;
        Sound.bop(); emitFeathers(gl.x, gl.y, 8);
        popText(pick(BOP_LINES), gl.x, gl.y - 20, { size: 18, color: '#fff', sub: `+${C.bopPoints}` });
      } else if (gl.state === 'hunt' && p.graceT <= 0 && p.rushT <= 0 && p.laserT <= 0) {
        gl.state = 'flee';
        Sound.squawk(); emitFeathers(gl.x, gl.y, 4);
        speak(pick(GULL_LINES), gl, { color: '#c2335a' });
        game.lastGullT = game.time;
        p.graceT = 0.8; p.ex = -gl.dir * 140; p.vy = Math.max(p.vy, 80);
        game.shake = 5;
        if (p.belly > 0) {                                // nicks the last thing he ate
          p.belly--;
          gl.carry = pick(theme().foods.filter(f => !FOODS[f[0]].toy))[0];
          popText('-1 BELLY', p.x, p.y - 84, { size: 16, color: '#ff8fab' });
        }
      }
    }
  }
  game.gulls = game.gulls.filter(gl => gl.x > -80 && gl.x < W + 80 && gl.y < game.cam + H + 100 && gl.y > game.cam - 200);
}

function checkZone() {
  const zones = theme().zones, zi = zoneIndexAt(zones, relHeight(player.y));
  if (zi <= game.zoneIdx) return;
  game.zoneIdx = zi;
  const z = zones[zi];
  game.banner = { title: z.name.toUpperCase(), sub: `${fmt(game.heightM)}m`, t: 0, color: '#ffe066' };
  Sound.zone();
  if (themeId() === 'human' && z.space && !player.helmetOn) {
    player.helmetOn = true; player.helmet = 0;
    setTimeout(() => Sound.helmet(), 380);
    popText('HELMET ON!', player.x, player.y - 100, { size: 18, color: '#7ad3ff' });
  }
  if (z.blackHoles) setTimeout(() => speak(pick(['Is that... a portal?', 'Ooh, swirly.', 'I wonder where that goes.']), 'player'), 900);
}

/* --- black hole portal --- */
function enterPortal(bh) {
  const p = player;
  game.state = 'portal';
  game.portal = { t: 0, bh, sx: p.x, sy: bodyY(), switched: false, fanfare: false };
  input.pointers.clear();
  Music.stop();
  Sound.whoosh();
  Sound.setHum(0.6);
  p.beam = null; p.rushT = 0; p.laserT = 0;
}
const PORTAL_IN = 1.4, PORTAL_OUT = 1.6;
function updatePortal(dt) {
  const pr = game.portal, p = player;
  pr.t += dt;
  updateSprings(dt);
  if (!pr.switched && pr.t >= PORTAL_IN) {
    pr.switched = true;
    game.flash = 1;
    Sound.flashBang();
    Sound.setHum(0);
    switchUniverse();
  }
  if (pr.switched && !pr.fanfare && pr.t >= PORTAL_IN + 0.35) { pr.fanfare = true; Music.fanfare(); }
  if (pr.t >= PORTAL_IN + PORTAL_OUT) {
    game.state = 'play';
    game.portal = null;
    Music.start();
    setTimeout(() => speak(pick(SAYINGS[themeId()]), 'player'), 600);
  }
  if (!pr.switched) {                     // he spirals in
    for (const bh of game.holes) bh.t += dt;
  }
}

function switchUniverse() {
  const p = player;
  game.universe++;
  game.maxUniverse = Math.max(game.maxUniverse, game.universe);
  game.uniStartM = toMetres(p.y);
  game.platforms = []; game.foods = []; game.hazards = []; game.gulls = []; game.holes = []; game.bubbles = [];
  game.zoneIdx = 0;
  p.helmetOn = false; p.helmet = 0; p.visorT = 0;
  p.vx = 0; p.ex = 0; p.beam = null;
  const py = game.cam + H * 0.72;
  p.x = W / 2; p.y = py; p.prevX = p.x; p.prevY = p.y;
  p.vy = -jumpVel() * 1.15;
  p.stretch = 0.4;
  const look = theme().zones[0].look;
  game.platforms.push(newPlatform({ x: W / 2 - 55, y: py, w: 110, look }));
  game.nextY = py - 30; game.lastHoleY = py;
  generate();
  const T = theme();
  game.banner = { title: T.name.toUpperCase(), sub: T.title, t: 0, color: '#d8ff7a', big: true };
  emitStars(p.x, p.y - 30, 16, ['#ffe066', '#fff', '#ff8fc8', '#7ad3ff']);
}

/* --- falling off --- */
function die() {
  const p = player;
  game.state = 'dying';
  game.deathT = 0;
  Music.stop();
  Music.sadTrombone();
  Sound.setHum(0);
  p.rushT = 0; p.laserT = 0; p.beam = null;
  // pick a game-over line
  const t = game.time, tid = themeId();
  let pool = MESSAGES.any;
  if (t - game.lastKnockT < 3) pool = MESSAGES.knocked;
  else if (t - game.lastGullT < 3) pool = MESSAGES.gull;
  else if (p.belly >= 3 && Math.random() < 0.6) pool = MESSAGES.belly;
  else if (Math.random() < 0.5) {
    if (tid === 'yarn') pool = MESSAGES.yarn;
    else if (tid === 'dog') pool = MESSAGES.dog;
    else if (theme().zones[game.zoneIdx].space) pool = MESSAGES.space;
  }
  let msg = pick(pool);
  if (msg === game.lastMsg && pool.length > 1) msg = pick(pool.filter(m => m !== msg));
  game.lastMsg = msg;
  game.message = msg.replace('{food}', FOODS[p.lastFood || 'fish'].name.toLowerCase());
  if (game.score > game.best) {
    game.best = game.score; game.newBest = true;
    store.set('pieSky.best', game.best);
  }
  if (game.maxUniverse > game.bestUniverse) { game.bestUniverse = game.maxUniverse; store.set('pieSky.bestUni', game.bestUniverse); }
}
function updateDying(dt) {
  const p = player;
  game.deathT += dt;
  p.vy = Math.min(p.vy + CONFIG.gravity * dt, CONFIG.maxFallSpeed);
  p.y += p.vy * dt;
  p.x += (p.vx + (p.ex || 0)) * dt * 0.3;
  game.cam += (p.y - H * 0.55 - game.cam) * Math.min(1, dt * 3);
  p.ouchT = 1;
  updateSprings(dt);
  updatePlatforms(dt);
  if (game.deathT > 1.3) { game.state = 'over'; game.overT = 0; }
}

/* ---------------------------------------------------------------------
   10. RENDER: BACKGROUND
   --------------------------------------------------------------------- */
const FONT = '"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",system-ui,sans-serif';
const OUT = '#2b1740';                       // the outline colour used everywhere

// Background scenery for each zone: far layer (slow) and near layer.
const DECOR = {
  garden:     { far: ['sunsetCloud', 'none', 'moonDay'], near: ['kite', 'birds', 'partyBalloon', 'sunsetCloud', 'none'] },
  sky:        { far: ['cloudBig', 'cloudBig', 'none'], near: ['cloud', 'birds', 'planeFar', 'cloud', 'none'] },
  edge:       { far: ['moon', 'none', 'satFar'], near: ['satFar', 'none', 'cloudThin', 'none'] },
  deep:       { far: ['ringPlanet', 'planet', 'nebula', 'galaxy'], near: ['rock', 'none', 'none', 'satFar'] },
  holes:      { far: ['galaxy', 'nebula', 'nebula', 'ringPlanet'], near: ['rock', 'none', 'swirl', 'none'] },
  yarn:       { far: ['yarnPlanet', 'buttonMoon', 'none'], near: ['button', 'needles', 'thread', 'button', 'none'] },
  yarnHoles:  { far: ['yarnPlanet', 'nebula', 'buttonMoon'], near: ['thread', 'button', 'none', 'swirl'] },
  dog:        { far: ['ballPlanet', 'boneMoon', 'none'], near: ['bone', 'paws', 'bone', 'cloud', 'none'] },
  dogHoles:   { far: ['ballPlanet', 'nebula', 'boneMoon'], near: ['bone', 'none', 'swirl', 'paws'] },
};

// The background's zone mix at the middle of the view.
function viewZoneWeights(cam) {
  const zones = theme().zones;
  return { zones, ws: zoneWeights(zones, relHeight(cam + H / 2)) };
}

function drawBackground(cam) {
  const { zones, ws } = viewZoneWeights(cam);
  const top = blendColors(zones.map((z, i) => [z.bg[0], ws[i]]));
  const bot = blendColors(zones.map((z, i) => [z.bg[1], ws[i]]));
  const gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, top); gr.addColorStop(1, bot);
  ctx.fillStyle = gr; ctx.fillRect(-20, -20, W + 40, H + 40);

  // stars: strongest in space, a faint twinkle elsewhere
  const tid = themeId();
  let space = 0;
  zones.forEach((z, i) => { if (z.space) space += ws[i]; });
  if (tid !== 'human') space = 0.3 + 0.4 * (ws[1] || 0);
  if (game.universe === 1 && tid === 'human') space = Math.max(space, clamp((relHeight(cam + H / 2) - 1700) / 900, 0, 0.6));
  if (space > 0.01) drawStars(cam, space, tid);

  // Earth's curve, sinking away below as he leaves the atmosphere
  if (tid === 'human') {
    const ei = zones.findIndex(z => z.id === 'edge');
    const mH = relHeight(cam + H / 2);
    if (ei >= 0 && mH > CONFIG.zones.edge - 300 && mH < CONFIG.zones.edge + 900) drawEarthLimb(H * 0.78 + (mH - CONFIG.zones.edge) * 0.35, clamp((mH - (CONFIG.zones.edge - 300)) / 300, 0, 1));
  }

  drawDecorLayer(cam, 0.12, 300, 'far', zones);
  if (game.universe === 1) drawGroundScene(cam);
  drawDecorLayer(cam, 0.4, 190, 'near', zones);
}

function drawStars(cam, a, tid) {
  const colors = tid === 'yarn' ? ['#fff1f8', '#ffd1e8'] : tid === 'dog' ? ['#f4ffe0', '#d8f04a'] : ['#ffffff', '#cfe8ff', '#ffe9b0'];
  const span = H + 40, off = -cam * 0.05;
  for (let i = 0; i < 90; i++) {
    const x = hash2(i, 1) * W, y = ((hash2(i, 2) * span + off) % span + span) % span - 20;
    const tw = 0.6 + 0.4 * Math.sin(game.time * (1 + hash2(i, 3) * 3) + i);
    const r = 0.6 + hash2(i, 4) * 1.4;
    ctx.globalAlpha = a * tw;
    ctx.fillStyle = colors[i % colors.length];
    if (r > 1.6) drawStar(x, y, r * 2, 0, ctx.fillStyle);
    else { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function drawEarthLimb(topY, a) {
  if (topY > H + 40) return;
  const R = 900, cx = W / 2, cy = topY + R;
  ctx.save();
  ctx.globalAlpha = a;
  const glow = ctx.createRadialGradient(cx, cy, R - 10, cx, cy, R + 60);
  glow.addColorStop(0, 'rgba(122,211,255,0.55)'); glow.addColorStop(1, 'rgba(122,211,255,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, R + 60, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3f7fd0'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
  ctx.fillStyle = '#5cb860';                       // a continent or two (one of them is Britain, obviously)
  for (let i = 0; i < 5; i++) {
    const x = cx - 300 + i * 150 + Math.sin(i * 7) * 40, y = topY + 30 + (i % 2) * 40;
    ctx.beginPath(); ctx.ellipse(x, y, 60 + i * 9, 18 + (i % 3) * 6, 0.2 * i, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(cx - 280 + i * 110, topY + 18 + (i % 2) * 22, 40, 7, 0, 0, TAU); ctx.fill(); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(200,240,255,0.9)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  ctx.restore();
}

function drawDecorLayer(cam, f, S, layer, zones) {
  const pc = cam * f;
  const i0 = Math.floor((pc - 160) / S), i1 = Math.floor((pc + H + 160) / S);
  for (let i = i0; i <= i1; i++) {
    const yP = i * S + hash2(i, 5 + f) * S * 0.6;
    const sy = yP - pc;
    // which zone this bit of sky belongs to (blended by chance, so zones mix)
    const realY = yP / f;
    const h = relHeight(realY);
    if (game.universe === 1 && h < 60 && layer === 'near') continue;   // the garden scene has this covered
